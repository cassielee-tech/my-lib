<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">性能分析漏斗</title><desc id="desc">从可量化的端到端现象开始，经过稳定基线、时间线、阶段、可验证假设和对照实验，最终形成有证据的根因。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker><style>.t{font:700 26px system-ui;fill:#182230}.h{font:700 17px system-ui;fill:#fff}.s{font:15px system-ui;fill:#52606d}.arr{stroke:#718096;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">不要从“我觉得是通信慢”开始，要让证据逐层收敛</text><polygon points="130,85 1070,85 1015,155 185,155" fill="#3677d2"/><text x="600" y="115" text-anchor="middle" class="h">① 定义现象：工作负载、硬件、输入 Shape、当前指标与目标</text><text x="600" y="140" text-anchor="middle" class="h">例：8 卡 Step Time 2.4 s，扩展效率从 91% 降至 76%</text><line x1="600" y1="160" x2="600" y2="183" class="arr"/><polygon points="185,190 1015,190 960,255 240,255" fill="#4e82c7"/><text x="600" y="217" text-anchor="middle" class="h">② 建立稳定基线</text><text x="600" y="241" text-anchor="middle" class="h">固定版本、Batch、精度、设备数、预热与测量区间</text><line x1="600" y1="260" x2="600" y2="283" class="arr"/><polygon points="240,290 960,290 905,355 295,355" fill="#805ad5"/><text x="600" y="317" text-anchor="middle" class="h">③ 看端到端时间线</text><text x="600" y="341" text-anchor="middle" class="h">Host 空隙 · Kernel · 通信暴露 · 同步 · Rank 差异</text><line x1="600" y1="360" x2="600" y2="383" class="arr"/><polygon points="295,390 905,390 850,455 350,455" fill="#db7c20"/><text x="600" y="417" text-anchor="middle" class="h">④ 缩小范围并提出假设</text><text x="600" y="441" text-anchor="middle" class="h">Compute / Memory / Communication / Sync / Imbalance</text><line x1="600" y1="460" x2="600" y2="483" class="arr"/><polygon points="350,490 850,490 795,555 405,555" fill="#2f855a"/><text x="600" y="517" text-anchor="middle" class="h">⑤ 单变量对照实验</text><text x="600" y="541" text-anchor="middle" class="h">验证根因，再回到端到端指标确认收益与正确性</text><text x="600" y="592" text-anchor="middle" class="s">输出不是“某项指标很高”，而是“在相同条件下改变 X，使 Y 按预测变化，因此支持根因 Z”。</text></svg>
