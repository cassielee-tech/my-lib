<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">AI 加速器产品层级</title><desc id="desc">芯片或模组被集成到多卡底板，再组成服务器，最后通过网络扩展为超节点或集群。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker><style>.t{font:700 26px system-ui;fill:#182230}.h{font:700 19px system-ui;fill:#24364b}.s{font:15px system-ui;fill:#52606d}.b{stroke-width:2}.arr{stroke:#718096;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="520" rx="24" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="t">先确认比较的是单设备，还是多设备聚合系统</text><rect x="45" y="110" width="225" height="270" rx="20" fill="#e8f1ff" stroke="#3677d2" class="b"/><text x="158" y="148" text-anchor="middle" class="h">① 芯片 / 加速模组</text><rect x="103" y="188" width="110" height="100" rx="15" fill="#3677d2"/><path d="M85 205H103M85 230H103M85 255H103M213 205H231M213 230H231M213 255H231" stroke="#3677d2" stroke-width="5"/><text x="158" y="235" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="17" fill="#fff">GPU / NPU</text><text x="158" y="325" text-anchor="middle" class="s">H100 SXM · MI325X OAM</text><text x="158" y="349" text-anchor="middle" class="s">Atlas 300I A2 PCIe 卡</text><path d="M275 245H325" class="arr"/><rect x="335" y="90" width="245" height="310" rx="20" fill="#f1eaff" stroke="#805ad5" class="b"/><text x="458" y="128" text-anchor="middle" class="h">② 多卡 Baseboard</text><g fill="#805ad5"><rect x="375" y="170" width="46" height="46" rx="7"/><rect x="430" y="170" width="46" height="46" rx="7"/><rect x="485" y="170" width="46" height="46" rx="7"/><rect x="375" y="230" width="46" height="46" rx="7"/><rect x="430" y="230" width="46" height="46" rx="7"/><rect x="485" y="230" width="46" height="46" rx="7"/></g><path d="M398 216V230M453 216V230M508 216V230M421 193H430M476 193H485M421 253H430M476 253H485" stroke="#db7c20" stroke-width="5"/><text x="458" y="315" text-anchor="middle" class="s">8 GPU + NVSwitch</text><text x="458" y="340" text-anchor="middle" class="s">或 UBB + Infinity Fabric</text><text x="458" y="365" text-anchor="middle" class="s">聚合算力 ≠ 单卡算力</text><path d="M585 245H635" class="arr"/><rect x="645" y="110" width="225" height="270" rx="20" fill="#fff1db" stroke="#db7c20" class="b"/><text x="758" y="148" text-anchor="middle" class="h">③ AI 服务器</text><rect x="690" y="180" width="135" height="105" rx="9" fill="#db7c20"/><circle cx="714" cy="207" r="8" fill="#fff"/><path d="M735 205H800M705 240H810M705 258H810" stroke="#fff" stroke-width="5"/><text x="758" y="325" text-anchor="middle" class="s">DGX / HGX Server</text><text x="758" y="349" text-anchor="middle" class="s">Atlas 800T A3</text><path d="M875 245H925" class="arr"/><rect x="935" y="90" width="220" height="310" rx="20" fill="#e9f8ef" stroke="#2f855a" class="b"/><text x="1045" y="128" text-anchor="middle" class="h">④ 超节点 / 集群</text><g fill="#2f855a"><rect x="972" y="170" width="70" height="45" rx="7"/><rect x="1049" y="170" width="70" height="45" rx="7"/><rect x="972" y="230" width="70" height="45" rx="7"/><rect x="1049" y="230" width="70" height="45" rx="7"/></g><path d="M1042 192H1049M1007 215V230M1084 215V230M1042 252H1049" stroke="#3677d2" stroke-width="5"/><text x="1045" y="315" text-anchor="middle" class="s">NVL72 · SuperPOD</text><text x="1045" y="340" text-anchor="middle" class="s">Atlas 900 A3</text><text x="1045" y="365" text-anchor="middle" class="s">互联拓扑决定扩展效率</text><text x="600" y="465" text-anchor="middle" class="h">比较前记录：产品形态 · 设备数量 · 精度 · Dense/Sparse · 功耗配置</text><text x="600" y="492" text-anchor="middle" class="s">厂商宣传中的“系统 PFLOPS”通常不能直接除以设备数后当作完整单卡规格使用。</text></svg>
