<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">串行执行与计算通信重叠</title><desc id="desc">相同的三段计算和两段通信，串行时全部暴露，重叠后通信隐藏在计算下方，关键路径缩短。</desc><style>.t{font:700 26px system-ui;fill:#182230}.h{font:700 19px system-ui;fill:#24364b}.s{font:15px system-ui;fill:#52606d}.n{font:700 16px system-ui;fill:#fff}.axis{stroke:#718096;stroke-width:2}.comp{fill:#3677d2}.comm{fill:#d14b65}.idle{fill:#dfe5eb}</style><rect width="1200" height="500" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">通信量没有变，暴露在关键路径上的时间变了</text><text x="55" y="105" class="h">串行</text><line x1="150" y1="100" x2="1120" y2="100" class="axis"/><rect x="180" y="120" width="210" height="60" rx="8" class="comp"/><rect x="390" y="120" width="120" height="60" rx="8" class="comm"/><rect x="510" y="120" width="230" height="60" rx="8" class="comp"/><rect x="740" y="120" width="120" height="60" rx="8" class="comm"/><rect x="860" y="120" width="210" height="60" rx="8" class="comp"/><text x="285" y="157" text-anchor="middle" class="n">反向计算 C3</text><text x="450" y="157" text-anchor="middle" class="n">通信 G3</text><text x="625" y="157" text-anchor="middle" class="n">反向计算 C2</text><text x="800" y="157" text-anchor="middle" class="n">通信 G2</text><text x="965" y="157" text-anchor="middle" class="n">反向计算 C1</text><text x="625" y="215" text-anchor="middle" class="s">总时间 = 计算 + 全部暴露通信</text><text x="55" y="285" class="h">重叠</text><line x1="150" y1="280" x2="1120" y2="280" class="axis"/><text x="120" y="327" text-anchor="end" class="s">计算 Stream</text><rect x="180" y="300" width="210" height="55" rx="8" class="comp"/><rect x="390" y="300" width="230" height="55" rx="8" class="comp"/><rect x="620" y="300" width="210" height="55" rx="8" class="comp"/><text x="285" y="334" text-anchor="middle" class="n">反向计算 C3</text><text x="505" y="334" text-anchor="middle" class="n">反向计算 C2</text><text x="725" y="334" text-anchor="middle" class="n">反向计算 C1</text><text x="120" y="402" text-anchor="end" class="s">通信 Stream</text><rect x="180" y="375" width="210" height="55" rx="8" class="idle"/><rect x="390" y="375" width="120" height="55" rx="8" class="comm"/><rect x="510" y="375" width="110" height="55" rx="8" class="idle"/><rect x="620" y="375" width="120" height="55" rx="8" class="comm"/><rect x="740" y="375" width="90" height="55" rx="8" class="idle"/><rect x="830" y="375" width="120" height="55" rx="8" class="comm"/><text x="450" y="409" text-anchor="middle" class="n">G3</text><text x="680" y="409" text-anchor="middle" class="n">G2</text><text x="890" y="409" text-anchor="middle" class="n">G1 暴露</text><line x1="830" y1="290" x2="830" y2="445" stroke="#db7c20" stroke-width="3" stroke-dasharray="7 5"/><text x="600" y="470" text-anchor="middle" class="s">G3、G2 被后续反向计算覆盖；最后无法覆盖的 G1 才直接增加 Step Time。</text></svg>
