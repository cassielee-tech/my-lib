<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">模型代码到设备执行的软件栈</title><desc id="desc">一行矩阵乘法依次经过框架、图编译、运行时、内核和硬件执行，多设备时还经过通信库。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker><style>.t{font:700 26px system-ui;fill:#182230}.h{font:700 18px system-ui;fill:#24364b}.s{font:15px system-ui;fill:#52606d}.code{font:700 17px ui-monospace,monospace;fill:#1d4f91}.box{fill:#fff;stroke:#9aa8b6;stroke-width:2}.blue{fill:#e8f1ff;stroke:#3677d2}.orange{fill:#fff1db;stroke:#db7c20}.green{fill:#e9f8ef;stroke:#2f855a}.purple{fill:#f1eaff;stroke:#805ad5}.arr{stroke:#718096;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="650" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">一行模型代码不会直接变成硬件指令</text><rect x="45" y="90" width="220" height="90" rx="15" class="blue"/><text x="155" y="125" text-anchor="middle" class="h">模型代码</text><text x="155" y="155" text-anchor="middle" class="code">y = x @ weight</text><path d="M270 135H340" class="arr"/><rect x="350" y="90" width="220" height="90" rx="15" class="box"/><text x="460" y="122" text-anchor="middle" class="h">深度学习框架</text><text x="460" y="151" text-anchor="middle" class="s">Tensor · Autograd · Operator</text><path d="M575 135H645" class="arr"/><rect x="655" y="90" width="220" height="90" rx="15" class="purple"/><text x="765" y="122" text-anchor="middle" class="h">图编译 / 算子选择</text><text x="765" y="151" text-anchor="middle" class="s">Fusion · Layout · Kernel</text><path d="M880 135H950" class="arr"/><rect x="960" y="90" width="195" height="90" rx="15" class="orange"/><text x="1058" y="122" text-anchor="middle" class="h">Runtime / 驱动</text><text x="1058" y="151" text-anchor="middle" class="s">Stream · Event · Task</text><path d="M1058 185V245" class="arr"/><rect x="870" y="255" width="285" height="115" rx="17" class="green"/><text x="1013" y="290" text-anchor="middle" class="h">GPU / NPU</text><text x="1013" y="320" text-anchor="middle" class="s">HBM → 片上存储 → 计算单元</text><text x="1013" y="346" text-anchor="middle" class="s">计算结果再写回 HBM</text><path d="M865 312H730" class="arr"/><rect x="465" y="255" width="255" height="115" rx="17" class="blue"/><text x="593" y="290" text-anchor="middle" class="h">Kernel 真正执行</text><text x="593" y="320" text-anchor="middle" class="s">按 Tile 搬运和计算</text><text x="593" y="346" text-anchor="middle" class="s">受计算量与访存量共同限制</text><path d="M592 375V440" class="arr"/><rect x="395" y="450" width="395" height="125" rx="18" class="orange"/><text x="593" y="486" text-anchor="middle" class="h">当数据依赖跨越设备</text><text x="593" y="518" text-anchor="middle" class="s">框架 → ProcessGroup / 适配层 → HCCL</text><text x="593" y="546" text-anchor="middle" class="s">Collective → 算法 → Transport → 互联链路</text><path d="M395 512H275" class="arr"/><rect x="45" y="455" width="220" height="115" rx="17" class="purple"/><text x="155" y="490" text-anchor="middle" class="h">其他 Rank</text><text x="155" y="520" text-anchor="middle" class="s">参数、梯度、激活或 Token</text><text x="155" y="546" text-anchor="middle" class="s">通过链路交换</text><text x="600" y="620" text-anchor="middle" class="s">上层决定“为什么传、传什么”，下层决定“怎样调度、走哪条链路”。</text></svg>
