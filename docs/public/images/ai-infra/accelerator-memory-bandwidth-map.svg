<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">AI 加速器显存容量与 HBM 带宽地图</title><desc id="desc">横轴为单设备显存容量，纵轴为峰值 HBM 带宽，展示 H100、H200、B200、B300、MI300X、MI325X、MI350X、Gaudi 3 和 Atlas 300I A2。</desc><style>.t{font:700 26px system-ui;fill:#182230}.h{font:700 16px system-ui;fill:#24364b}.s{font:14px system-ui;fill:#52606d}.axis{stroke:#718096;stroke-width:2}.grid{stroke:#dfe5eb;stroke-width:1}.nv{fill:#5b9b36;stroke:#37651e;stroke-width:2}.amd{fill:#d14b65;stroke:#8d2940;stroke-width:2}.asc{fill:#3677d2;stroke:#1d4f91;stroke-width:2}.intel{fill:#805ad5;stroke:#553c9a;stroke-width:2}.lab{font:700 14px system-ui;fill:#24364b}</style><rect width="1200" height="680" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">单设备显存容量 × 峰值 HBM 带宽（不是综合性能排名）</text><line x1="120" y1="570" x2="1120" y2="570" class="axis"/><line x1="120" y1="570" x2="120" y2="90" class="axis"/><g class="grid"><line x1="120" y1="510" x2="1120" y2="510"/><line x1="120" y1="450" x2="1120" y2="450"/><line x1="120" y1="390" x2="1120" y2="390"/><line x1="120" y1="330" x2="1120" y2="330"/><line x1="120" y1="270" x2="1120" y2="270"/><line x1="120" y1="210" x2="1120" y2="210"/><line x1="120" y1="150" x2="1120" y2="150"/><line x1="370" y1="90" x2="370" y2="570"/><line x1="620" y1="90" x2="620" y2="570"/><line x1="870" y1="90" x2="870" y2="570"/><line x1="1120" y1="90" x2="1120" y2="570"/></g><g class="s"><text x="105" y="575" text-anchor="end">0</text><text x="105" y="515" text-anchor="end">1</text><text x="105" y="455" text-anchor="end">2</text><text x="105" y="395" text-anchor="end">3</text><text x="105" y="335" text-anchor="end">4</text><text x="105" y="275" text-anchor="end">5</text><text x="105" y="215" text-anchor="end">6</text><text x="105" y="155" text-anchor="end">7</text><text x="105" y="95" text-anchor="end">8 TB/s</text><text x="120" y="598" text-anchor="middle">0</text><text x="370" y="5