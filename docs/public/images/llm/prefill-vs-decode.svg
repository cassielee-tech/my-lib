<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><style>.t{font:700 23px sans-serif;fill:#172033}.s{font:17px sans-serif;fill:#475569}.m{font:18px monospace;fill:#1e293b}</style><rect width="1200" height="570" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">同一个模型，两种很不一样的执行形态</text>
<rect x="45" y="80" width="530" height="420" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="310" y="119" text-anchor="middle" class="t">Prefill：一次处理 S 个 Prompt Token</text><g fill="#93c5fd" stroke="#2563eb"><rect x="90" y="160" width="62" height="62" rx="8"/><rect x="162" y="160" width="62" height="62" rx="8"/><rect x="234" y="160" width="62" height="62" rx="8"/><rect x="306" y="160" width="62" height="62" rx="8"/><rect x="378" y="160" width="62" height="62" rx="8"/><rect x="450" y="160" width="62" height="62" rx="8"/></g><text x="301" y="250" text-anchor="middle" class="m">Input [B, S]</text><rect x="100" y="280" width="410" height="78" rx="13" fill="#fff" stroke="#60a5fa"/><text x="305" y="312" text-anchor="middle" class="s">大矩阵乘法，并行度高</text><text x="305" y="340" text-anchor="middle" class="s">为全部位置写入 K/V → 决定 TTFT</text><text x="310" y="416" text-anchor="middle" class="s">常见倾向：计算密集</text><text x="310" y="452" text-anchor="middle" class="s">Prompt 越长，首 Token 等待通常越久</text>
<rect x="625" y="80" width="530" height="420" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="890" y="119" text-anchor="middle" class="t">Decode：每轮只新增 1 个 Token</text><rect x="670" y="160" width="62" height="62" rx="8" fill="#86efac" stroke="#16a34a"/><text x="820" y="202" class="s">+ 读取 S 个历史 K/V</text><text x="700" y="250" text-anchor="middle" class="m">[B, 1]</text><rect x="680" y="280" width="410" height="78" rx="13" fill="#fff" stroke="#4ade80"/><text x="885" y="312" text-anchor="middle" class="s">小矩阵计算，Token 间串行</text><text x="885" y="340" text-anchor="middle" class="s">反复读权重与 Cache → 决定 TPOT</text><text x="890" y="416" text-anchor="middle" class="s">小 Batch 常见倾向：带宽密集</text><text x="890" y="452" text-anchor="middle" class="s">每一步延迟都会累加到整段回答</text><text x="600" y="540" text-anchor="middle" class="s">“计算密集 / 带宽密集”是常见倾向，不是脱离 Batch、硬件和模型后的绝对结论</text></svg>
