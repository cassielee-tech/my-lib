<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550"><style>.t{font:700 23px sans-serif;fill:#172033}.s{font:17px sans-serif;fill:#475569}.m{font:17px monospace;fill:#1e293b}</style><rect width="1200" height="550" rx="24" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="t">同一种偏好 Pair，两条不同的优化路径</text><rect x="430" y="80" width="340" height="90" rx="15" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="600" y="115" text-anchor="middle" class="t">(Prompt, Chosen, Rejected)</text><text x="600" y="146" text-anchor="middle" class="s">相同的数据起点</text>
<path d="M520 170C400 205 315 215 315 245M680 170C800 205 885 215 885 245" fill="none" stroke="#64748b" stroke-width="3"/><rect x="55" y="235" width="520" height="230" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="315" y="278" text-anchor="middle" class="t">PPO-RLHF</text><text x="315" y="322" text-anchor="middle" class="s">Pair → 训练 Reward Model</text><text x="315" y="360" text-anchor="middle" class="s">Policy 在线生成 → RM 打分</text><text x="315" y="398" text-anchor="middle" class="s">PPO + KL 约束更新 Policy</text><text x="315" y="438" text-anchor="middle" class="m">显式奖励模型 + 强化学习循环</text><rect x="625" y="235" width="520" height="230" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="885" y="278" text-anchor="middle" class="t">DPO</text><text x="885" y="322" text-anchor="middle" class="s">计算 Chosen / Rejected Log Probability</text><text x="885" y="360" text-anchor="middle" class="s">与 Reference Model 的相对偏好比较</text><text x="885" y="398" text-anchor="middle" class="s">直接反向优化分类式目标</text><text x="885" y="438" text-anchor="middle" class="m">不显式训练 RM，不执行 PPO Rollout</text><text x="600" y="515" text-anchor="middle" class="s">DPO 简化了训练系统，但并没有消除参考模型、偏好数据质量和系统评测的重要性</text></svg>
