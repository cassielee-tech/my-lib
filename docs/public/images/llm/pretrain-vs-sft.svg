<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><style>.t{font:700 23px sans-serif;fill:#172033}.s{font:17px sans-serif;fill:#475569}.m{font:17px monospace;fill:#1e293b}</style><rect width="1200" height="540" rx="24" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="t">目标函数都可用交叉熵，但“给什么数据、监督哪些位置”不同</text><rect x="45" y="85" width="530" height="385" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="310" y="125" text-anchor="middle" class="t">继续预训练</text><text x="85" y="170" class="s">领域原始序列：</text><rect x="85" y="200" width="450" height="65" rx="11" fill="#dbeafe"/><text x="310" y="240" text-anchor="middle" class="m">金融报告 / 医疗文献 / 企业代码</text><text x="85" y="310" class="s">常见监督方式：</text><g fill="#2563eb"><circle cx="130" cy="350" r="12"/><circle cx="180" cy="350" r="12"/><circle cx="230" cy="350" r="12"/><circle cx="280" cy="350" r="12"/><circle cx="330" cy="350" r="12"/><circle cx="380" cy="350" r="12"/><circle cx="430" cy="350" r="12"/><circle cx="480" cy="350" r="12"/></g><text x="310" y="400" text-anchor="middle" class="s">大量位置参与下一个 Token Loss</text>
<rect x="625" y="85" width="530" height="385" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="890" y="125" text-anchor="middle" class="t">SFT</text><text x="665" y="170" class="s">明确的对话示范：</text><rect x="665" y="195" width="450" height="42" rx="9" fill="#e2e8f0"/><text x="685" y="222" class="m">User：解释 KV Cache</text><rect x="665" y="247" width="450" height="65" rx="9" fill="#dcfce7"/><text x="685" y="275" class="m">Assistant：KV Cache 保存每层……</text><text x="685" y="299" class="m">它以显存换取避免重复计算。</text><text x="665" y="350" class="s">常见监督方式：</text><g><circle cx="710" cy="390" r="12" fill="#cbd5e1"/><circle cx="760" cy="390" r="12" fill="#cbd5e1"/><circle cx="810" cy="390" r="12" fill="#cbd5e1"/><circle cx="860" cy="390" r="12" fill="#16a34a"/><circle cx="910" cy="390" r="12" fill="#16a34a"/><circle cx="960" cy="390" r="12" fill="#16a34a"/><circle cx="1010" cy="390" r="12" fill="#16a34a"/><circle cx="1060" cy="390" r="12" fill="#16a34a"/></g><text x="890" y="435" text-anchor="middle" class="s">Prompt 可 Mask，重点学习 Assistant Token</text><text x="600" y="510" text-anchor="middle" class="s">灰色表示常见实现中被忽略的 Label；具体是否 Mask 必须以训练代码为准</text></svg>
