<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 23px sans-serif;fill:#172033}.s{font:17px sans-serif;fill:#475569}.b{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.g{fill:#fee2e2;stroke:#dc2626;stroke-width:2}</style></defs>
  <rect width="1200" height="500" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">梯度累积：四次 backward，只做一次参数更新</text>
  <g class="b"><rect x="55" y="105" width="190" height="82" rx="13"/><rect x="295" y="105" width="190" height="82" rx="13"/><rect x="535" y="105" width="190" height="82" rx="13"/><rect x="775" y="105" width="190" height="82" rx="13"/></g>
  <g class="t" font-size="20"><text x="150" y="137" text-anchor="middle">Micro-batch 1</text><text x="390" y="137" text-anchor="middle">Micro-batch 2</text><text x="630" y="137" text-anchor="middle">Micro-batch 3</text><text x="870" y="137" text-anchor="middle">Micro-batch 4</text></g>
  <g class="s"><text x="150" y="166" text-anchor="middle">产生 g₁ / 4</text><text x="390" y="166" text-anchor="middle">累加 g₂ / 4</text><text x="630" y="166" text-anchor="middle">累加 g₃ / 4</text><text x="870" y="166" text-anchor="middle">累加 g₄ / 4</text></g>
  <path d="M150 197V270H1015" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M390 197V270M630 197V270M870 197V270" stroke="#64748b" stroke-width="2"/>
  <rect x="1015" y="230" width="140" height="80" rx="13" class="g"/><text x="1085" y="261" text-anchor="middle" class="t" font-size="20">梯度缓冲</text><text x="1085" y="289" text-anchor="middle" class="s">Σgᵢ / 4</text>
  <path d="M1085 320V370" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/><rect x="960" y="380" width="195" height="65" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1057" y="420" text-anchor="middle" class="t" font-size="19">1 次 optimizer.step()</text>
  <rect x="55" y="350" width="720" height="95" rx="15" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="415" y="385" text-anchor="middle" class="t" font-size="20">期间参数 θ 保持不变</text><text x="415" y="416" text-anchor="middle" class="s">省的是单次激活峰值，不是总计算；若每个 Loss 已取平均，应除以 K</text>
</svg>
