<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 22px sans-serif;fill:#172033}.s{font:16px sans-serif;fill:#475569}.m{font:16px monospace;fill:#1e293b}</style></defs><rect width="1400" height="760" rx="24" fill="#f8fafc"/><text x="700" y="43" text-anchor="middle" class="t">Expert Parallel：Token 去 Expert 所在 Rank，结果再回 Token 原所属 Rank</text>
<rect x="35" y="80" width="610" height="610" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="755" y="80" width="610" height="610" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="340" y="118" text-anchor="middle" class="t">Rank 0：持有 Expert 0 / 1</text><text x="1060" y="118" text-anchor="middle" class="t">Rank 1：持有 Expert 2 / 3</text>
<text x="70" y="165" class="s">本地 Token 与路由结果</text><g fill="#dbeafe" stroke="#2563eb"><rect x="70" y="185" width="115" height="48" rx="8"/><rect x="200" y="185" width="115" height="48" rx="8"/><rect x="330" y="185" width="115" height="48" rx="8"/><rect x="460" y="185" width="115" height="48" rx="8"/></g><text x="127" y="216" text-anchor="middle" class="m">A → E0</text><text x="257" y="216" text-anchor="middle" class="m">B → E3</text><text x="387" y="216" text-anchor="middle" class="m">C → E1</text><text x="517" y="216" text-anchor="middle" class="m">D → E2</text>
<text x="790" y="165" class="s">本地 Token 与路由结果</text><g fill="#dcfce7" stroke="#16a34a"><rect x="790" y="185" width="115" height="48" rx="8"/><rect x="920" y="185" width="115" height="48" rx="8"/><rect x="1050" y="185" width="115" height="48" rx="8"/><rect x="1180" y="185" width="115" height="48" rx="8"/></g><text x="847" y="216" text-anchor="middle" class="m">W → E2</text><text x="977" y="216" text-anchor="middle" class="m">X → E0</text><text x="1107" y="216" text-anchor="middle" class="m">Y → E3</text><text x="1237" y="216" text-anchor="middle" class="m">Z → E1</text>
<text x="700" y="280" text-anchor="middle" class="t" fill="#f97316">① Dispatch Alltoall</text><path d="M520 250C650 300 710 300 880 250" fill="none" stroke="#f97316" stroke-width="4" marker-end="url(#a)"/><path d="M980 260C830 340 620 340 380 260" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/><text x="680" y="326" text-anchor="middle" class="s">R0 发送 B、D；R1 发送 X、Z</text>
<rect x="95" y="365" width="220" height="115" rx="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="360" y="365" width="220" height="115" rx="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="205" y="405" text-anchor="middle" class="t">Expert 0</text><text x="205" y="440" text-anchor="middle" class="m">计算 A、X</text><text x="470" y="405" text-anchor="middle" class="t">Expert 1</text><text x="470" y="440" text-anchor="middle" class="m">计算 C、Z</text><rect x="815" y="365" width="220" height="115" rx="14" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><rect x="1080" y="365" width="220" height="115" rx="14" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><text x="925" y="405" text-anchor="middle" class="t">Expert 2</text><text x="925" y="440" text-anchor="middle" class="m">计算 D、W</text><text x="1190" y="405" text-anchor="middle" class="t">Expert 3</text><text x="1190" y="440" text-anchor="middle" class="m">计算 B、Y</text>
<text x="700" y="535" text-anchor="middle" class="t" fill="#16a34a">② Combine Alltoall</text><path d="M880 500C730 550 650 550 525 500" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/><path d="M380 510C590 590 820 590 1060 500" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="700" y="605" text-anchor="middle" class="s">Expert 输出返回 A/B/C/D 与 W/X/Y/Z 原所属 Rank，再恢复原顺序</text><rect x="250" y="630" width="900" height="75" rx="14" fill="#fff7ed" stroke="#f97316"/><text x="700" y="660" text-anchor="middle" class="s">Dispatch 改变“在哪里计算”；Combine 恢复“结果属于哪个原 Token”</text><text x="700" y="687" text-anchor="middle" class="s">发送的是动态 Token 激活，不是把 Expert 权重在每一层来回搬运</text></svg>
