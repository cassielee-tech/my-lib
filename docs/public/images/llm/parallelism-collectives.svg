<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">五种大模型并行策略的数据分布与通信方式</title>
  <desc id="desc">用设备方框、模型块、数据批次、张量分片、流水线激活、参数分片和专家Token路由，解释DP、TP、PP、FSDP和EP分别如何通信。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:24px;font-weight:600}.name{font-size:19px;font-weight:600}.t{font-size:14px}.s{font-size:12px;fill:#607d8b}.panel{fill:#fafbfc;stroke:#c7d1da;stroke-width:1.5}.dev{fill:#fff;stroke:#607d8b;stroke-width:1.5}.m1{fill:#bbdefb;stroke:#4285b4;stroke-width:1.4}.m2{fill:#c8e6c9;stroke:#43964b;stroke-width:1.4}.m3{fill:#ffe0b2;stroke:#ef8c28;stroke-width:1.4}.m4{fill:#e1bee7;stroke:#8e5aa7;stroke-width:1.4}.token{fill:#fff3e0;stroke:#ef8c28;stroke-width:1.2}.comm{stroke:#d05252;stroke-width:2.5;fill:none;marker-end:url(#r)}.both{stroke:#d05252;stroke-width:2.5;fill:none;marker-start:url(#rs);marker-end:url(#r)}.flow{stroke:#4285b4;stroke-width:2.2;fill:none;marker-end:url(#b)}.dash{stroke:#8e5aa7;stroke-width:2;stroke-dasharray:5 4;fill:none;marker-end:url(#p)}</style><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d05252"/></marker><marker id="rs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#d05252"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4285b4"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8e5aa7"/></marker></defs>
  <text x="600" y="34" text-anchor="middle" class="h">并行不是“用了几张卡”，而是“张量怎样切、切开后怎样拼”</text>

  <!-- DP -->
  <rect x="35" y="62" width="550" height="270" rx="14" class="panel"/><text x="60" y="92" class="name">① 数据并行 DP</text><text x="60" y="116" class="s">模型复制，数据切分；反向后同步梯度</text>
  <rect x="70" y="140" width="205" height="130" rx="10" class="dev"/><text x="82" y="162" class="s">NPU 0</text><rect x="95" y="176" width="65" height="35" class="token"/><text x="127" y="198" text-anchor="middle" class="t">Batch A</text><path d="M160 194H182" class="flow"/><rect x="185" y="174" width="65" height="70" class="m1"/><text x="217" y="204" text-anchor="middle" class="t">完整</text><text x="217" y="224" text-anchor="middle" class="t">模型 W</text><text x="172" y="260" text-anchor="middle" class="s">得到 dW₀</text>
  <rect x="345" y="140" width="205" height="130" rx="10" class="dev"/><text x="357" y="162" class="s">NPU 1</text><rect x="370" y="176" width="65" height="35" class="token"/><text x="402" y="198" text-anchor="middle" class="t">Batch B</text><path d="M435 194H457" class="flow"/><rect x="460" y="174" width="65" height="70" class="m1"/><text x="492" y="204" text-anchor="middle" class="t">完整</text><text x="492" y="224" text-anchor="middle" class="t">模型 W</text><text x="447" y="260" text-anchor="middle" class="s">得到 dW₁</text>
  <path d="M250 285C330 318 400 318 460 285" class="both"/><text x="355" y="306" text-anchor="middle" class="t">AllReduce(dW₀, dW₁)</text>

  <!-- TP -->
  <rect x="615" y="62" width="550" height="270" rx="14" class="panel"/><text x="640" y="92" class="name">② 张量并行 TP</text><text x="640" y="116" class="s">同一层权重切开；局部输出必须重新组合</text>
  <text x="890" y="145" text-anchor="middle" class="t">输入 X 同时送入两个权重分片</text><path d="M890 152L770 180" class="flow"/><path d="M890 152L1010 180" class="flow"/>
  <rect x="660" y="175" width="205" height="105" rx="10" class="dev"/><text x="672" y="197" class="s">NPU 0</text><rect x="705" y="207" width="115" height="47" class="m1"/><text x="762" y="228" text-anchor="middle" class="t">W 左半</text><text x="762" y="246" text-anchor="middle" class="s">局部输出 Y₀</text>
  <rect x="915" y="175" width="205" height="105" rx="10" class="dev"/><text x="927" y="197" class="s">NPU 1</text><rect x="960" y="207" width="115" height="47" class="m2"/><text x="1017" y="228" text-anchor="middle" class="t">W 右半</text><text x="1017" y="246" text-anchor="middle" class="s">局部输出 Y₁</text>
  <path d="M820 292C875 320 930 320 980 292" class="both"/><text x="900" y="307" text-anchor="middle" class="t">AllGather 拼成完整 Y</text>

  <!-- PP -->
  <rect x="35" y="355" width="550" height="270" rx="14" class="panel"/><text x="60" y="385" class="name">③ 流水线并行 PP</text><text x="60" y="409" class="s">不同层放在不同设备；传激活，反向时传梯度</text>
  <rect x="70" y="442" width="200" height="115" rx="10" class="dev"/><text x="82" y="464" class="s">NPU 0 / Stage 0</text><rect x="105" y="478" width="130" height="50" class="m1"/><text x="170" y="508" text-anchor="middle" class="t">Layer 0～11</text>
  <rect x="350" y="442" width="200" height="115" rx="10" class="dev"/><text x="362" y="464" class="s">NPU 1 / Stage 1</text><rect x="385" y="478" width="130" height="50" class="m2"/><text x="450" y="508" text-anchor="middle" class="t">Layer 12～23</text>
  <path d="M235 487H385" class="flow"/><text x="310" y="479" text-anchor="middle" class="t">激活 A →</text><path d="M385 535H235" class="comm"/><text x="310" y="553" text-anchor="middle" class="t">← 梯度 dA</text><text x="310" y="591" text-anchor="middle" class="s">多个 micro-batch 依次进入，让两个 Stage 尽量同时工作</text>

  <!-- FSDP -->
  <rect x="615" y="355" width="550" height="270" rx="14" class="panel"/><text x="640" y="385" class="name">④ ZeRO-3 / FSDP</text><text x="640" y="409" class="s">平时只存参数分片；计算前临时收集，反向后再分片</text>
  <rect x="650" y="442" width="210" height="115" rx="10" class="dev"/><text x="662" y="464" class="s">NPU 0</text><rect x="685" y="481" width="70" height="45" class="m1"/><text x="720" y="509" text-anchor="middle" class="t">W₀</text><rect x="755" y="481" width="70" height="45" fill="none" stroke="#aab7c1" stroke-dasharray="4 3"/><text x="790" y="509" text-anchor="middle" class="s">W₁</text>
  <rect x="920" y="442" width="210" height="115" rx="10" class="dev"/><text x="932" y="464" class="s">NPU 1</text><rect x="955" y="481" width="70" height="45" fill="none" stroke="#aab7c1" stroke-dasharray="4 3"/><text x="990" y="509" text-anchor="middle" class="s">W₀</text><rect x="1025" y="481" width="70" height="45" class="m2"/><text x="1060" y="509" text-anchor="middle" class="t">W₁</text>
  <path d="M825 471C875 438 960 438 1025 471" class="both"/><text x="890" y="447" text-anchor="middle" class="t">AllGather：临时得到完整 W</text><path d="M1025 545C960 585 850 585 755 545" class="both"/><text x="890" y="590" text-anchor="middle" class="t">ReduceScatter：聚合梯度并只保留各自分片</text>

  <!-- EP wide -->
  <rect x="35" y="648" width="1130" height="345" rx="14" class="panel"/><text x="60" y="678" class="name">⑤ 专家并行 EP（MoE）</text><text x="60" y="702" class="s">专家分布在不同设备；Router 决定每个 Token 去哪里，计算后再送回原位置</text>
  <g transform="translate(75 735)"><text x="0" y="0" class="t">原始 Token</text><rect x="0" y="18" width="48" height="35" class="token"/><text x="24" y="41" text-anchor="middle" class="t">t₀</text><rect x="52" y="18" width="48" height="35" class="token"/><text x="76" y="41" text-anchor="middle" class="t">t₁</text><rect x="104" y="18" width="48" height="35" class="token"/><text x="128" y="41" text-anchor="middle" class="t">t₂</text><rect x="156" y="18" width="48" height="35" class="token"/><text x="180" y="41" text-anchor="middle" class="t">t₃</text></g>
  <rect x="350" y="744" width="150" height="70" rx="10" class="m4"/><text x="425" y="773" text-anchor="middle" class="name">Router</text><text x="425" y="796" text-anchor="middle" class="s">为 Token 选择专家</text><path d="M280 778H350" class="flow"/>
  <rect x="620" y="720" width="210" height="110" rx="10" class="dev"/><text x="632" y="742" class="s">NPU 0</text><rect x="660" y="756" width="130" height="50" class="m1"/><text x="725" y="777" text-anchor="middle" class="t">Expert 0</text><text x="725" y="798" text-anchor="middle" class="s">处理 t₀、t₂</text>
  <rect x="900" y="720" width="210" height="110" rx="10" class="dev"/><text x="912" y="742" class="s">NPU 1</text><rect x="940" y="756" width="130" height="50" class="m2"/><text x="1005" y="777" text-anchor="middle" class="t">Expert 1</text><text x="1005" y="798" text-anchor="middle" class="s">处理 t₁、t₃</text>
  <path d="M500 766C550 730 590 745 660 770" class="comm"/><path d="M500 792C640 870 850 870 940 792" class="comm"/><text x="700" y="867" text-anchor="middle" class="t">第一次 AlltoAll：按专家重排 Token</text>
  <path d="M725 830C680 910 540 920 280 830" class="dash"/><path d="M1005 830C850 950 500 950 280 850" class="dash"/><text x="700" y="951" text-anchor="middle" class="t">第二次 AlltoAll：将专家输出送回 Token 原来的设备与顺序</text>
  <text x="600" y="1022" text-anchor="middle" class="s">红色箭头表示跨设备通信；蓝色箭头表示本地前向数据流；虚线表示处理完成后的返回路径</text>
</svg>
