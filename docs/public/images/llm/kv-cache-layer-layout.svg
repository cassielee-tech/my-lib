<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 23px sans-serif;fill:#172033}.s{font:17px sans-serif;fill:#475569}.m{font:17px monospace;fill:#1e293b}.k{fill:#dbeafe;stroke:#2563eb}.v{fill:#dcfce7;stroke:#16a34a}</style></defs><rect width="1200" height="570" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">每一层都有独立的 K Cache 和 V Cache</text>
<g><rect x="55" y="95" width="180" height="70" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="55" y="210" width="180" height="70" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="55" y="325" width="180" height="70" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/></g><text x="145" y="137" text-anchor="middle" class="t">Layer 1</text><text x="145" y="252" text-anchor="middle" class="t">Layer 2</text><text x="145" y="367" text-anchor="middle" class="t">Layer L</text><text x="145" y="309" text-anchor="middle" class="s">⋮</text>
<g stroke-width="2"><rect x="315" y="85" width="370" height="42" rx="8" class="k"/><rect x="315" y="137" width="370" height="42" rx="8" class="v"/><rect x="315" y="200" width="370" height="42" rx="8" class="k"/><rect x="315" y="252" width="370" height="42" rx="8" class="v"/><rect x="315" y="315" width="370" height="42" rx="8" class="k"/><rect x="315" y="367" width="370" height="42" rx="8" class="v"/></g><g class="m"><text x="335" y="112">K: token 1 … token S</text><text x="335" y="164">V: token 1 … token S</text><text x="335" y="227">K: token 1 … token S</text><text x="335" y="279">V: token 1 … token S</text><text x="335" y="342">K: token 1 … token S</text><text x="335" y="394">V: token 1 … token S</text></g><path d="M235 130H305M235 245H305M235 360H305" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="760" y="95" width="380" height="180" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="950" y="132" text-anchor="middle" class="t" font-size="21">逻辑 Shape（单层、单种 Cache）</text><text x="950" y="179" text-anchor="middle" class="m">[B, N_kv, S, D_head]</text><text x="950" y="218" text-anchor="middle" class="s">每生成一个 Token，S 通常增加 1</text><text x="950" y="247" text-anchor="middle" class="s">物理维度顺序可因实现而不同</text><rect x="760" y="315" width="380" height="112" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="950" y="352" text-anchor="middle" class="t" font-size="21">不缓存 Attention 矩阵</text><text x="950" y="386" text-anchor="middle" class="s">保存的是投影后的 K/V 激活</text><text x="950" y="414" text-anchor="middle" class="s">模型参数则是另一类常驻数据</text><text x="600" y="520" text-anchor="middle" class="m">Bytes ≈ 2 × L × B × S × N_kv × D_head × dtype_bytes</text></svg>
