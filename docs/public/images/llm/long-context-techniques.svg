<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">长上下文优化作用位置</title><desc id="desc">RoPE 缩放修改位置，滑动窗口减少注意力连接，FlashAttention 分块减少 HBM 往返，Paged Attention 修改 KV 缓存物理布局。</desc>
  <defs><style>.t{font:700 25px system-ui,sans-serif;fill:#182230}.h{font:700 19px system-ui,sans-serif;fill:#24364b}.s{font:15px system-ui,sans-serif;fill:#52606d}.card{fill:#fff;stroke:#c5ced8;stroke-width:2}.tok{fill:#e8f1ff;stroke:#3677d2}.hot{fill:#fff1db;stroke:#db7c20}.mem{fill:#e9f8ef;stroke:#2f855a}.line{stroke:#718096;stroke-width:2}</style></defs>
  <rect width="1200" height="590" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">“长上下文优化”并不是同一种优化</text>
  <g transform="translate(30 75)"><rect width="270" height="450" rx="18" class="card"/><text x="135" y="35" text-anchor="middle" class="h">① RoPE Scaling</text><text x="135" y="63" text-anchor="middle" class="s">改变位置坐标，不减少连接</text><path d="M35 150H235" class="line"/><g class="tok"><circle cx="45" cy="150" r="13"/><circle cx="85" cy="150" r="13"/><circle cx="125" cy="150" r="13"/><circle cx="165" cy="150" r="13"/><circle cx="205" cy="150" r="13"/></g><text x="135" y="205" text-anchor="middle" class="s">真实位置：0  32K  64K  96K</text><path d="M45 245C100 280 175 280 225 245" fill="none" stroke="#805ad5" stroke-width="4"/><text x="135" y="320" text-anchor="middle" class="h">位置映射 / 频率调整</text><text x="135" y="355" text-anchor="middle" class="s">解决：长度外推</text><text x="135" y="385" text-anchor="middle" class="s">不解决：O(S²) Attention</text></g>
  <g transform="translate(320 75)"><rect width="270" height="450" rx="18" class="card"/><text x="135" y="35" text-anchor="middle" class="h">② Sliding Window</text><text x="135" y="63" text-anchor="middle" class="s">改变“看谁”，减少连接</text><g class="tok"><circle cx="40" cy="140" r="12"/><circle cx="75" cy="140" r="12"/><circle cx="110" cy="140" r="12"/><circle cx="145" cy="140" r="12"/><circle cx="180" cy="140" r="12"/><circle cx="215" cy="140" r="12"/></g><g fill="none" stroke="#db7c20" stroke-width="2"><path d="M110 128Q128 90 145 128"/><path d="M75 128Q110 65 145 128"/><path d="M40 128Q92 42 145 128"/></g><text x="135" y="220" text-anchor="middle" class="s">当前 Token 只看最近 W 个位置</text><text x="135" y="320" text-anchor="middle" class="h">O(S²) → O(SW)</text><text x="135" y="355" text-anchor="middle" class="s">收益：少算 Score</text><text x="135" y="385" text-anchor="middle" class="s">代价：单层看不到全部历史</text></g>
  <g transform="translate(610 75)"><rect width="270" height="450" rx="18" class="card"/><text x="135" y="35" text-anchor="middle" class="h">③ FlashAttention</text><text x="135" y="63" text-anchor="middle" class="s">连接不变，改变数据搬运</text><rect x="30" y="105" width="210" height="55" rx="10" class="hot"/><text x="135" y="138" text-anchor="middle" class="h">HBM：Q / K / V</text><path d="M135 165V205" class="line"/><rect x="55" y="210" width="160" height="90" rx="12" class="tok"/><text x="135" y="245" text-anchor="middle" class="h">片上分块计算</text><text x="135" y="275" text-anchor="middle" class="s">在线 Softmax</text><path d="M135 305V345" class="line"/><text x="135" y="370" text-anchor="middle" class="h">不落完整 S × S 矩阵</text><text x="135" y="405" text-anchor="middle" class="s">数学仍是精确全量 Attention</text></g>
  <g transform="translate(900 75)"><rect width="270" height="450" rx="18" class="card"/><text x="135" y="35" text-anchor="middle" class="h">④ Paged Attention</text><text x="135" y="63" text-anchor="middle" class="s">KV 内容不变，改变物理布局</text><text x="30" y="115" class="s">逻辑页：</text><g class="tok"><rect x="95" y="92" width="38" height="38"/><rect x="137" y="92" width="38" height="38"/><rect x="179" y="92" width="38" height="38"/></g><path d="M114 133L70 235M156 133L156 205M198 133L230 275" class="line"/><text x="30" y="190" class="s">物理块：</text><g class="mem"><rect x="45" y="235" width="50" height="50"/><rect x="105" y="205" width="50" height="50"/><rect x="165" y="305" width="50" height="50"/><rect x="215" y="275" width="50" height="50"/></g><text x="135" y="390" text-anchor="middle" class="h">按需分配，不要求连续</text><text x="135" y="420" text-anchor="middle" class="s">减少预留空间与碎片</text></g>
  <text x="600" y="560" text-anchor="middle" class="s">先判断瓶颈在位置、计算、IO 还是缓存管理，再选择对应方案。</text>
</svg>
