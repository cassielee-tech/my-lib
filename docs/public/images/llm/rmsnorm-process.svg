<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="530" viewBox="0 0 1050 530" role="img" aria-labelledby="title desc">
  <title id="title">RMSNorm 对一个 Token 向量的处理过程</title><desc id="desc">向量先平方求平均并开根号得到RMS，再用每个元素除以RMS统一整体尺度，最后乘可学习缩放参数，方向大体保留而长度被规范。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:23px;font-weight:600}.n{font-size:17px;font-weight:600}.t{font-size:14px}.s{font-size:12px;fill:#607d8b}.in{fill:#e3f2fd;stroke:#4285b4;stroke-width:1.6}.op{fill:#f3e5f5;stroke:#8e5aa7;stroke-width:1.6}.out{fill:#e8f5e9;stroke:#43a047;stroke-width:1.6}.arrow{stroke:#607d8b;stroke-width:2;fill:none;marker-end:url(#a)}.axis{stroke:#78909c;stroke-width:1.3}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs>
  <text x="525" y="34" text-anchor="middle" class="h">RMSNorm：按每个 Token 的隐藏维计算整体尺度，再统一缩放</text>
  <rect x="35" y="95" width="220" height="100" rx="10" class="in"/><text x="145" y="124" text-anchor="middle" class="n">输入 x = [2, -1, 3, -2]</text><text x="145" y="151" text-anchor="middle" class="t">一个 Token，H=4</text><text x="145" y="177" text-anchor="middle" class="s">RMS 较大 → 整体幅度较大</text>
  <path d="M255 145H300" class="arrow"/><rect x="305" y="85" width="300" height="120" rx="10" class="op"/><text x="455" y="114" text-anchor="middle" class="n">计算均方根 RMS</text><text x="455" y="145" text-anchor="middle" class="t">√((2² + (-1)² + 3² + (-2)²) / 4)</text><text x="455" y="174" text-anchor="middle" class="t">= √4.5 ≈ 2.121</text><text x="455" y="195" text-anchor="middle" class="s">实际还会加入 ε 保证数值稳定</text>
  <path d="M605 145H650" class="arrow"/><rect x="655" y="85" width="360" height="120" rx="10" class="out"/><text x="835" y="114" text-anchor="middle" class="n">除以 RMS，再逐维乘 γ</text><text x="835" y="145" text-anchor="middle" class="t">x / RMS ≈ [0.943, -0.471, 1.414, -0.943]</text><text x="835" y="174" text-anchor="middle" class="t">输出 = (x / RMS) ⊙ γ</text><text x="835" y="195" text-anchor="middle" class="s">γ: [H]，是可训练参数</text>
  <g transform="translate(80 280)"><line x1="0" y1="150" x2="380" y2="150" class="axis"/><line x1="190" y1="10" x2="190" y2="250" class="axis"/><path d="M190 150L310 55" stroke="#4285b4" stroke-width="5" marker-end="url(#a)"/><text x="324" y="51" class="n">原向量：长度较大</text><path d="M190 150L248 104" stroke="#43a047" stroke-width="5" marker-end="url(#a)"/><text x="266" y="111" class="n">归一化后：方向近似不变</text></g>
  <g transform="translate(570 300)"><rect width="400" height="130" rx="11" fill="#f7f9fb" stroke="#78909c"/><text x="200" y="30" text-anchor="middle" class="n">RMSNorm 与 LayerNorm 的关键区别</text><text x="25" y="63" class="t">RMSNorm：不减均值，主要按均方根缩放</text><text x="25" y="91" class="t">LayerNorm：先减均值，再按方差缩放</text><text x="25" y="116" class="s">两者都通常沿最后一个 hidden 维独立处理每个 Token</text></g>
  <text x="525" y="506" text-anchor="middle" class="s">“方向近似不变”指未考虑逐维 γ 时的整体缩放；学习到的 γ 会对不同维度进行不同调整</text>
</svg>
