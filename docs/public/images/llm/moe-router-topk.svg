<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 22px sans-serif;fill:#172033}.s{font:16px sans-serif;fill:#475569}.m{font:17px monospace;fill:#1e293b}</style></defs><rect width="1200" height="590" rx="24" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="t">Router 对每个 Token 独立打分，同一层也会走不同路径</text><g><rect x="45" y="95" width="135" height="58" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="45" y="180" width="135" height="58" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="45" y="265" width="135" height="58" rx="10" fill="#dbeafe" stroke="#2563eb"/></g><text x="112" y="131" text-anchor="middle" class="t">Token A</text><text x="112" y="216" text-anchor="middle" class="t">Token B</text><text x="112" y="301" text-anchor="middle" class="t">Token C</text><rect x="240" y="155" width="170" height="105" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="325" y="194" text-anchor="middle" class="t">Router</text><text x="325" y="225" text-anchor="middle" class="m">softmax(Wᵣx)</text><path d="M180 124C215 124 210 185 230 190M180 209H230M180 294C215 294 210 235 230 230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<g><rect x="500" y="80" width="150" height="70" rx="11" fill="#dcfce7" stroke="#16a34a"/><rect x="500" y="170" width="150" height="70" rx="11" fill="#dcfce7" stroke="#16a34a"/><rect x="500" y="260" width="150" height="70" rx="11" fill="#dcfce7" stroke="#16a34a"/><rect x="500" y="350" width="150" height="70" rx="11" fill="#dcfce7" stroke="#16a34a"/></g><text x="575" y="123" text-anchor="middle" class="t">Expert 0</text><text x="575" y="213" text-anchor="middle" class="t">Expert 1</text><text x="575" y="303" text-anchor="middle" class="t">Expert 2</text><text x="575" y="393" text-anchor="middle" class="t">Expert 3</text><path d="M410 190C455 190 455 115 490 115M410 205C455 205 455 295 490 295M410 205C455 205 455 205 490 205M410 220C455 220 455 385 490 385" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/>
<rect x="760" y="95" width="380" height="300" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="950" y="134" text-anchor="middle" class="t">Top-2 路由示例</text><text x="800" y="185" class="m">A → E0 (0.7), E2 (0.3)</text><text x="800" y="230" class="m">B → E1 (0.6), E3 (0.4)</text><text x="800" y="275" class="m">C → E1 (0.8), E2 (0.2)</text><path d="M795 305H1105" stroke="#cbd5e1"/><text x="950" y="343" text-anchor="middle" class="m">y_A = 0.7·E0(A) + 0.3·E2(A)</text><text x="950" y="375" text-anchor="middle" class="s">每个 Token 输出仍恢复为一个 [H] 向量</text><rect x="190" y="465" width="820" height="70" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text x="600" y="495" text-anchor="middle" class="s">Expert ID 是动态计算路径，不是人工规定的固定领域标签</text><text x="600" y="522" text-anchor="middle" class="s">同一个 Token 到下一层时会重新路由，可能选择完全不同的 Expert</text></svg>
