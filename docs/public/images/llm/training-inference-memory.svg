<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">训练与推理显存构成</title><desc id="desc">推理保存权重和缓存，训练还保存梯度、优化器状态和大量激活。</desc><style>.t{font:700 26px system-ui;fill:#182230}.h{font:700 21px system-ui;fill:#24364b}.s{font:16px system-ui;fill:#52606d}.w{fill:#3677d2}.g{fill:#805ad5}.m{fill:#db7c20}.a{fill:#2f855a}.k{fill:#d14b65}.n{font:700 17px system-ui;fill:#fff}</style><rect width="1200" height="510" rx="24" fill="#f8fafc"/><text x="600" y="45" text-anchor="middle" class="t">同一个 7.5B 模型：训练显存远不止一份权重</text><text x="300" y="90" text-anchor="middle" class="h">BF16 推理</text><rect x="75" y="125" width="450" height="95" rx="15" class="w"/><text x="300" y="180" text-anchor="middle" class="n">BF16 权重：约 15 GB</text><rect x="75" y="235" width="280" height="72" rx="14" class="k"/><text x="215" y="278" text-anchor="middle" class="n">KV Cache：随请求增长</text><rect x="365" y="235" width="160" height="72" rx="14" fill="#718096"/><text x="445" y="278" text-anchor="middle" class="n">Workspace</text><text x="300" y="355" text-anchor="middle" class="s">不保存梯度和 Adam 状态</text><text x="900" y="90" text-anchor="middle" class="h">混合精度 AdamW 训练</text><rect x="675" y="125" width="112" height="175" rx="12" class="w"/><rect x="790" y="125" width="112" height="175" rx="12" class="g"/><rect x="905" y="125" width="112" height="175" rx="12" class="m"/><rect x="1020" y="125" width="112" height="175" rx="12" class="a"/><text x="731" y="180" text-anchor="middle" class="n">参数</text><text x="731" y="215" text-anchor="middle" class="n">2 B/P</text><text x="846" y="180" text-anchor="middle" class="n">梯度</text><text x="846" y="215" text-anchor="middle" class="n">2 B/P</text><text x="961" y="170" text-anchor="middle" class="n">Master</text><text x="961" y="197" text-anchor="middle" class="n">Weight</text><text x="961" y="230" text-anchor="middle" class="n">4 B/P</text><text x="1076" y="170" text-anchor="middle" class="n">Adam</text><text x="1076" y="197" text-anchor="middle" class="n">m + v</text><text x="1076" y="230" text-anchor="middle" class="n">8 B/P</text><rect x="675" y="320" width="457" height="65" rx="14" class="k"/><text x="904" y="360" text-anchor="middle" class="n">激活 + 临时 Buffer + 通信 Bucket（额外）</text><text x="900" y="430" text-anchor="middle" class="h">模型状态：16 Byte/参数 ≈ 120 GB</text><text x="900" y="460" text-anchor="middle" class="s">具体实现可能不同，且 120 GB 尚未包含激活</text></svg>
