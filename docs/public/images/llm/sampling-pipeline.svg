<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 22px sans-serif;fill:#172033}.s{font:16px sans-serif;fill:#475569}.b{fill:#fff;stroke:#64748b;stroke-width:2}</style></defs><rect width="1200" height="550" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">采样不是重新运行模型，而是处理最后一维词表 Logits</text>
<g class="b"><rect x="45" y="105" width="190" height="100" rx="14"/><rect x="285" y="105" width="190" height="100" rx="14"/><rect x="525" y="105" width="190" height="100" rx="14"/><rect x="765" y="105" width="190" height="100" rx="14"/><rect x="1005" y="105" width="150" height="100" rx="14"/></g><text x="140" y="143" text-anchor="middle" class="t">Logits</text><text x="140" y="174" text-anchor="middle" class="s">词表中每项一个分数</text><text x="380" y="143" text-anchor="middle" class="t">Temperature</text><text x="380" y="174" text-anchor="middle" class="s">改变尖锐程度</text><text x="620" y="143" text-anchor="middle" class="t">Top-k</text><text x="620" y="174" text-anchor="middle" class="s">保留固定 k 个</text><text x="860" y="143" text-anchor="middle" class="t">Top-p</text><text x="860" y="174" text-anchor="middle" class="s">保留累计概率集合</text><text x="1080" y="143" text-anchor="middle" class="t">随机抽样</text><text x="1080" y="174" text-anchor="middle" class="s">得到 1 个 Token</text><path d="M235 155H275M475 155H515M715 155H755M955 155H995" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="80" y="280" class="s">原始概率</text><g fill="#94a3b8"><rect x="190" y="248" width="52" height="32"/><rect x="252" y="222" width="52" height="58"/><rect x="314" y="185" width="52" height="95"/><rect x="376" y="260" width="52" height="20"/><rect x="438" y="238" width="52" height="42"/></g><text x="620" y="280" class="s">过滤后</text><g><rect x="750" y="248" width="52" height="32" fill="#cbd5e1"/><rect x="812" y="222" width="52" height="58" fill="#2563eb"/><rect x="874" y="185" width="52" height="95" fill="#2563eb"/><rect x="936" y="260" width="52" height="20" fill="#cbd5e1"/><rect x="998" y="238" width="52" height="42" fill="#2563eb"/></g><path d="M520 230H600" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="80" y="355" width="1040" height="120" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="600" y="391" text-anchor="middle" class="t">三者解决的问题不同</text><text x="600" y="425" text-anchor="middle" class="s">Temperature 调整相对概率；Top-k 限制候选数量；Top-p 根据模型确定程度动态决定候选集合</text><text x="600" y="455" text-anchor="middle" class="s">Greedy 则跳过随机抽样，直接选择最大 Logit 对应的 Token</text></svg>
