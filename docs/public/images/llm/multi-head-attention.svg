<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">多头注意力如何切分隐藏维度并重新组合</title><desc id="desc">输入隐藏维度H经过QKV投影后分成多个head，每个head独立计算不同注意力矩阵，输出沿head维拼接回H并经过输出投影。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:23px;font-weight:600}.n{font-size:17px;font-weight:600}.t{font-size:14px}.s{font-size:12px;fill:#607d8b}.x{fill:#e3f2fd;stroke:#4285b4;stroke-width:1.6}.h1{fill:#f3e5f5;stroke:#8e5aa7;stroke-width:1.5}.h2{fill:#fff3e0;stroke:#ef8c28;stroke-width:1.5}.h3{fill:#e8f5e9;stroke:#43a047;stroke-width:1.5}.h4{fill:#ffebee;stroke:#d05252;stroke-width:1.5}.out{fill:#f7f9fb;stroke:#78909c;stroke-width:1.6}.arrow{stroke:#607d8b;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs>
  <text x="550" y="34" text-anchor="middle" class="h">Multi-Head Attention：不是复制完整 Attention，而是切分特征维度</text>
  <rect x="45" y="90" width="190" height="95" rx="10" class="x"/><text x="140" y="121" text-anchor="middle" class="n">输入 X</text><text x="140" y="148" text-anchor="middle" class="t">[B, S, H=512]</text><text x="140" y="170" text-anchor="middle" class="s">每个 Token 512 维</text><path d="M235 137H290" class="arrow"/>
  <rect x="300" y="85" width="210" height="105" rx="10" class="out"/><text x="405" y="115" text-anchor="middle" class="n">QKV 线性投影并 reshape</text><text x="405" y="142" text-anchor="middle" class="t">[B,S,H] → [B,heads,S,D]</text><text x="405" y="169" text-anchor="middle" class="s">heads=4，D=H/heads=128</text>
  <path d="M510 137C550 137 545 235 590 235M510 137C550 137 545 315 590 315M510 137C550 137 545 395 590 395M510 137C550 137 545 475 590 475" class="arrow"/>
  <g transform="translate(600 200)"><rect width="225" height="65" rx="9" class="h1"/><text x="112" y="26" text-anchor="middle" class="n">Head 0</text><text x="112" y="49" text-anchor="middle" class="t">Q₀K₀ᵀ → A₀V₀　[S,128]</text><rect y="80" width="225" height="65" rx="9" class="h2"/><text x="112" y="106" text-anchor="middle" class="n">Head 1</text><text x="112" y="129" text-anchor="middle" class="t">Q₁K₁ᵀ → A₁V₁　[S,128]</text><rect y="160" width="225" height="65" rx="9" class="h3"/><text x="112" y="186" text-anchor="middle" class="n">Head 2</text><text x="112" y="209" text-anchor="middle" class="t">Q₂K₂ᵀ → A₂V₂　[S,128]</text><rect y="240" width="225" height="65" rx="9" class="h4"/><text x="112" y="266" text-anchor="middle" class="n">Head 3</text><text x="112" y="289" text-anchor="middle" class="t">Q₃K₃ᵀ → A₃V₃　[S,128]</text></g>
  <path d="M825 232C875 232 870 350 900 350M825 312C875 312 870 350 900 350M825 392C875 392 870 350 900 350M825 472C875 472 870 350 900 350" class="arrow"/><rect x="905" y="290" width="160" height="120" rx="10" class="out"/><text x="985" y="320" text-anchor="middle" class="n">Concat</text><text x="985" y="348" text-anchor="middle" class="t">4 × 128 = 512</text><text x="985" y="375" text-anchor="middle" class="n">再乘 Wᴼ</text><text x="985" y="398" text-anchor="middle" class="t">输出 [B,S,H]</text>
  <g transform="translate(85 510)"><rect width="930" height="62" rx="10" class="out"/><text x="465" y="26" text-anchor="middle" class="t">不同 Head 有独立的投影参数，可在不同特征子空间形成不同注意力模式</text><text x="465" y="48" text-anchor="middle" class="s">但不能保证每个 Head 都有清晰固定的人类语义；多头数量增加时，单头维度通常相应减小</text></g>
</svg>
