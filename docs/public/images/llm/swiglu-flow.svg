<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="610" viewBox="0 0 1050 610" role="img" aria-labelledby="title desc">
  <title id="title">SwiGLU MLP 的双分支门控数据流</title><desc id="desc">每个Token向量同时经过Gate和Up两个线性投影扩展到中间维，Gate分支经过SiLU形成门值，与Up分支逐元素相乘，再经Down投影回隐藏维。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:23px;font-weight:600}.n{font-size:17px;font-weight:600}.t{font-size:14px}.s{font-size:12px;fill:#607d8b}.x{fill:#e3f2fd;stroke:#4285b4;stroke-width:1.6}.gate{fill:#f3e5f5;stroke:#8e5aa7;stroke-width:1.6}.up{fill:#fff3e0;stroke:#ef8c28;stroke-width:1.6}.mul{fill:#ffebee;stroke:#d05252;stroke-width:1.6}.down{fill:#e8f5e9;stroke:#43a047;stroke-width:1.6}.arrow{stroke:#607d8b;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs>
  <text x="525" y="34" text-anchor="middle" class="h">SwiGLU：一条分支产生内容，另一条分支学习“让哪些特征通过”</text>
  <rect x="55" y="245" width="190" height="85" rx="10" class="x"/><text x="150" y="276" text-anchor="middle" class="n">Token 向量 x</text><text x="150" y="304" text-anchor="middle" class="t">[B,S,H]</text>
  <path d="M245 287C300 287 295 165 350 165M245 287C300 287 295 395 350 395" class="arrow"/>
  <rect x="360" y="105" width="250" height="120" rx="10" class="gate"/><text x="485" y="135" text-anchor="middle" class="n">Gate 分支</text><text x="485" y="164" text-anchor="middle" class="t">g = xW_gate　[H→I]</text><text x="485" y="192" text-anchor="middle" class="t">SiLU(g) = g·sigmoid(g)</text><text x="485" y="214" text-anchor="middle" class="s">产生连续门控值</text>
  <rect x="360" y="335" width="250" height="120" rx="10" class="up"/><text x="485" y="365" text-anchor="middle" class="n">Up 分支</text><text x="485" y="394" text-anchor="middle" class="t">u = xW_up　[H→I]</text><text x="485" y="422" text-anchor="middle" class="t">产生候选内容特征</text><text x="485" y="444" text-anchor="middle" class="s">I 通常大于 H</text>
  <path d="M610 165C665 165 660 270 705 270M610 395C665 395 660 305 705 305" class="arrow"/><circle cx="735" cy="287" r="34" class="mul"/><text x="735" y="295" text-anchor="middle" class="h">⊙</text><text x="735" y="345" text-anchor="middle" class="s">逐元素门控 [I]</text>
  <path d="M769 287H815" class="arrow"/><rect x="825" y="225" width="190" height="125" rx="10" class="down"/><text x="920" y="255" text-anchor="middle" class="n">Down 投影</text><text x="920" y="283" text-anchor="middle" class="t">W_down [I→H]</text><text x="920" y="311" text-anchor="middle" class="t">输出 [B,S,H]</text><text x="920" y="335" text-anchor="middle" class="s">恢复残差所需 shape</text>
  <g transform="translate(180 505)"><rect width="690" height="70" rx="10" fill="#f7f9fb" stroke="#78909c"/><text x="345" y="27" text-anchor="middle" class="n">MLP 在每个 Token 上独立执行</text><text x="345" y="52" text-anchor="middle" class="s">它混合 hidden 特征，不直接混合 sequence 位置；Token 间的信息交换主要由 Attention 完成</text></g>
</svg>
