<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">文本经过 Tokenizer 变成模型输入的过程</title>
  <desc id="desc">中文文本先规范化，再切成子词 Token，映射为整数 ID，添加特殊 Token，最后通过 Padding 组成规则的批次张量。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:23px;font-weight:600}.n{font-size:17px;font-weight:600}.t{font-size:14px}.s{font-size:12px;fill:#607d8b}.box{fill:#f7f9fb;stroke:#78909c;stroke-width:1.6}.text{fill:#e3f2fd;stroke:#4285b4;stroke-width:1.6}.token{fill:#fff3e0;stroke:#ef8c28;stroke-width:1.4}.id{fill:#e8f5e9;stroke:#43a047;stroke-width:1.4}.special{fill:#f3e5f5;stroke:#8e5aa7;stroke-width:1.4}.pad{fill:#eceff1;stroke:#78909c;stroke-width:1.4}.arrow{stroke:#607d8b;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs>
  <text x="550" y="34" text-anchor="middle" class="h">Tokenizer：把开放的文本空间映射到有限的整数词表</text>
  <g transform="translate(35 78)"><rect width="175" height="128" rx="12" class="box"/><text x="87" y="28" text-anchor="middle" class="n">① 原始文本</text><rect x="18" y="48" width="139" height="50" rx="7" class="text"/><text x="87" y="78" text-anchor="middle" class="t">我喜欢 AI！</text><text x="87" y="118" text-anchor="middle" class="s">字符串 / Unicode</text></g>
  <path d="M210 142H245" class="arrow"/>
  <g transform="translate(250 78)"><rect width="180" height="128" rx="12" class="box"/><text x="90" y="28" text-anchor="middle" class="n">② 规范化</text><rect x="20" y="48" width="140" height="50" rx="7" class="text"/><text x="90" y="78" text-anchor="middle" class="t">我喜欢 AI!</text><text x="90" y="118" text-anchor="middle" class="s">Unicode、空格、大小写等</text></g>
  <path d="M430 142H465" class="arrow"/>
  <g transform="translate(470 78)"><rect width="220" height="128" rx="12" class="box"/><text x="110" y="28" text-anchor="middle" class="n">③ 切分 Token</text><rect x="15" y="52" width="40" height="37" rx="6" class="token"/><text x="35" y="76" text-anchor="middle" class="t">我</text><rect x="59" y="52" width="53" height="37" rx="6" class="token"/><text x="85" y="76" text-anchor="middle" class="t">喜欢</text><rect x="116" y="52" width="43" height="37" rx="6" class="token"/><text x="137" y="76" text-anchor="middle" class="t">AI</text><rect x="163" y="52" width="38" height="37" rx="6" class="token"/><text x="182" y="76" text-anchor="middle" class="t">!</text><text x="110" y="118" text-anchor="middle" class="s">Token 边界由词表算法决定</text></g>
  <path d="M690 142H725" class="arrow"/>
  <g transform="translate(730 78)"><rect width="150" height="128" rx="12" class="box"/><text x="75" y="28" text-anchor="middle" class="n">④ 映射 ID</text><rect x="15" y="52" width="120" height="37" rx="6" class="id"/><text x="75" y="76" text-anchor="middle" class="t">[42, 815, 9, 7]</text><text x="75" y="118" text-anchor="middle" class="s">查 vocabulary 表</text></g>
  <path d="M880 142H915" class="arrow"/>
  <g transform="translate(920 78)"><rect width="145" height="128" rx="12" class="box"/><text x="72" y="28" text-anchor="middle" class="n">⑤ 特殊 Token</text><rect x="12" y="49" width="121" height="43" rx="6" class="special"/><text x="72" y="68" text-anchor="middle" class="t">[BOS] ... [EOS]</text><text x="72" y="85" text-anchor="middle" class="s">边界、填充等语义</text><text x="72" y="118" text-anchor="middle" class="s">模型约定的一部分</text></g>

  <text x="550" y="254" text-anchor="middle" class="n">多条文本长度不同，Padding 后才能组成矩形 Batch</text>
  <g transform="translate(150 285)"><text x="0" y="25" class="t">文本 A</text><rect x="70" y="0" width="70" height="42" rx="5" class="id"/><text x="105" y="26" text-anchor="middle" class="t">[BOS]</text><rect x="144" y="0" width="58" height="42" rx="5" class="id"/><text x="173" y="26" text-anchor="middle" class="t">我</text><rect x="206" y="0" width="65" height="42" rx="5" class="id"/><text x="238" y="26" text-anchor="middle" class="t">喜欢</text><rect x="275" y="0" width="58" height="42" rx="5" class="id"/><text x="304" y="26" text-anchor="middle" class="t">AI</text><rect x="337" y="0" width="70" height="42" rx="5" class="id"/><text x="372" y="26" text-anchor="middle" class="t">[EOS]</text>
  <text x="0" y="90" class="t">文本 B</text><rect x="70" y="65" width="70" height="42" rx="5" class="id"/><text x="105" y="91" text-anchor="middle" class="t">[BOS]</text><rect x="144" y="65" width="58" height="42" rx="5" class="id"/><text x="173" y="91" text-anchor="middle" class="t">你好</text><rect x="206" y="65" width="70" height="42" rx="5" class="id"/><text x="241" y="91" text-anchor="middle" class="t">[EOS]</text><rect x="280" y="65" width="58" height="42" rx="5" class="pad"/><text x="309" y="91" text-anchor="middle" class="t">[PAD]</text><rect x="342" y="65" width="58" height="42" rx="5" class="pad"/><text x="371" y="91" text-anchor="middle" class="t">[PAD]</text></g>
  <path d="M585 338H670" class="arrow"/>
  <g transform="translate(690 288)"><rect width="260" height="115" rx="10" class="box"/><text x="130" y="28" text-anchor="middle" class="n">input_ids: [B, S] = [2, 5]</text><text x="130" y="57" text-anchor="middle" class="t">[[1, 42, 815, 9, 2],</text><text x="130" y="80" text-anchor="middle" class="t"> [1, 73, 2, 0, 0]]</text><text x="130" y="105" text-anchor="middle" class="s">整数张量，尚未包含语义向量</text></g>
  <text x="550" y="467" text-anchor="middle" class="s">具体 Token、ID 和特殊符号因模型而异；Tokenizer 必须与模型训练时使用的版本匹配</text>
</svg>
