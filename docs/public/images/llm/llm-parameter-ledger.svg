<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Stack-7.5B 参数账本</title><desc id="desc">总参数由词嵌入、三十二层注意力和前馈网络组成，前馈网络占比最大。</desc><style>.t{font:700 26px system-ui;fill:#182230}.h{font:700 19px system-ui;fill:#24364b}.s{font:16px system-ui;fill:#52606d}.n{font:700 23px system-ui;fill:#fff}.box{stroke-width:2}.arr{stroke:#718096;stroke-width:3;fill:none}</style><rect width="1200" height="520" rx="24" fill="#f8fafc"/><text x="600" y="45" text-anchor="middle" class="t">Stack-7.5B：参数主要在 32 层 SwiGLU FFN</text><rect x="55" y="95" width="225" height="130" rx="18" fill="#3677d2"/><text x="168" y="145" text-anchor="middle" class="n">Embedding</text><text x="168" y="180" text-anchor="middle" class="n">524.3M</text><text x="168" y="208" text-anchor="middle" class="n">V × D</text><path d="M285 160H345" class="arr"/><rect x="355" y="80" width="490" height="305" rx="20" fill="#fff" stroke="#9aa8b6" class="box"/><text x="600" y="118" text-anchor="middle" class="h">Decoder Block × 32</text><rect x="395" y="145" width="185" height="155" rx="16" fill="#805ad5"/><text x="488" y="190" text-anchor="middle" class="n">Attention</text><text x="488" y="228" text-anchor="middle" class="n">41.94M / 层</text><text x="488" y="262" text-anchor="middle" class="n">Q + K + V + O</text><rect x="620" y="145" width="185" height="155" rx="16" fill="#db7c20"/><text x="713" y="190" text-anchor="middle" class="n">SwiGLU FFN</text><text x="713" y="228" text-anchor="middle" class="n">176.16M / 层</text><text x="713" y="262" text-anchor="middle" class="n">3 × D × F</text><text x="600" y="345" text-anchor="middle" class="h">218.10M / 层 × 32 ≈ 6.98B</text><path d="M850 160H910" class="arr"/><rect x="920" y="95" width="225" height="130" rx="18" fill="#2f855a"/><text x="1033" y="143" text-anchor="middle" class="n">LM Head</text><text x="1033" y="180" text-anchor="middle" class="n">共享 Embedding</text><text x="1033" y="208" text-anchor="middle" class="n">+ 0 参数</text><rect x="285" y="420" width="630" height="65" rx="16" fill="#e9f8ef" stroke="#2f855a"/><text x="600" y="460" text-anchor="middle" class="t">总计：524.3M + 6.98B ≈ 7.50B 参数</text></svg>
