<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 22px sans-serif;fill:#172033}.s{font:16px sans-serif;fill:#475569}.b{fill:#fff;stroke:#64748b;stroke-width:2}</style></defs><rect width="1200" height="600" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">经典 RLHF：先学习打分，再让 Policy 通过试错提高奖励</text><rect x="45" y="95" width="210" height="100" rx="14" class="b"/><text x="150" y="132" text-anchor="middle" class="t">人工示范</text><text x="150" y="164" text-anchor="middle" class="s">Prompt → 好回答</text><path d="M255 145H315" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="325" y="95" width="190" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="420" y="132" text-anchor="middle" class="t">SFT Model</text><text x="420" y="164" text-anchor="middle" class="s">初始 Policy</text>
<rect x="45" y="270" width="210" height="110" rx="14" class="b"/><text x="150" y="307" text-anchor="middle" class="t">偏好比较</text><text x="150" y="339" text-anchor="middle" class="s">Chosen ＞ Rejected</text><path d="M255 325H315" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="325" y="270" width="190" height="110" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="420" y="307" text-anchor="middle" class="t">Reward Model</text><text x="420" y="339" text-anchor="middle" class="s">回答 → 标量分数</text>
<rect x="650" y="155" width="210" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="755" y="192" text-anchor="middle" class="t">Policy 生成回答</text><text x="755" y="224" text-anchor="middle" class="s">在线 Rollout</text><path d="M515 145C580 145 580 195 640 195" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="650" y="325" width="210" height="100" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="755" y="362" text-anchor="middle" class="t">奖励 + KL 约束</text><text x="755" y="394" text-anchor="middle" class="s">RM 打分，参考模型限偏移</text><path d="M515 325H640M755 255V315" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="970" y="240" width="185" height="110" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1062" y="277" text-anchor="middle" class="t">PPO 更新</text><text x="1062" y="309" text-anchor="middle" class="s">提高高奖励回答概率</text><path d="M860 375C920 375 915 315 960 305" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M1062 230V125H755V145" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/><text x="910" y="105" text-anchor="middle" class="s">生成—评分—更新循环</text><rect x="260" y="485" width="680" height="70" rx="14" fill="#fff" stroke="#94a3b8"/><text x="600" y="515" text-anchor="middle" class="s">工程上可能同时维护 Policy、Reference、Reward、Value 等模型</text><text x="600" y="541" text-anchor="middle" class="s">并持续生成训练样本，因此资源与调度复杂</text></svg>
