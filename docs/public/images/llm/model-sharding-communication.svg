<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">切分维度决定集合通信</title><desc id="desc">批次、矩阵、层、序列和专家五种切分分别引出梯度聚合、输出聚合、点对点传递、键值交换和令牌路由。</desc><style>.t{font:700 25px system-ui;fill:#182230}.h{font:700 18px system-ui;fill:#fff}.s{font:15px system-ui;fill:#52606d}.c{fill:#fff;stroke:#c5ced8;stroke-width:2}.tag{font:700 16px system-ui;fill:#24364b}</style><rect width="1200" height="560" rx="24" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="t">切分什么，就要为被拆开的数据依赖选择通信</text><g transform="translate(25 80)"><rect width="220" height="410" rx="17" class="c"/><rect width="220" height="66" rx="17" fill="#3677d2"/><text x="110" y="40" text-anchor="middle" class="h">DP：切 Batch</text><text x="110" y="108" text-anchor="middle" class="tag">不同样本</text><text x="110" y="143" text-anchor="middle" class="s">Rank 0：Batch A</text><text x="110" y="171" text-anchor="middle" class="s">Rank 1：Batch B</text><text x="110" y="225" text-anchor="middle" class="tag">产生不同本地梯度</text><text x="110" y="280" text-anchor="middle" class="h" fill="#3677d2">AllReduce</text><text x="110" y="315" text-anchor="middle" class="s">相同参数的梯度求和</text><text x="110" y="365" text-anchor="middle" class="tag">结果：副本保持一致</text></g><g transform="translate(258 80)"><rect width="220" height="410" rx="17" class="c"/><rect width="220" height="66" rx="17" fill="#805ad5"/><text x="110" y="40" text-anchor="middle" class="h">TP：切矩阵/Head</text><text x="110" y="108" text-anchor="middle" class="tag">同一层被拆开</text><text x="110" y="143" text-anchor="middle" class="s">Rank 0：W 的一部分</text><text x="110" y="171" text-anchor="middle" class="s">Rank 1：W 的另一部分</text><text x="110" y="225" text-anchor="middle" class="tag">只得到局部层输出</text><text x="110" y="280" text-anchor="middle" class="h" fill="#805ad5">AG / AR / RS</text><text x="110" y="315" text-anchor="middle" class="s">拼接、求和或归约分片</text><text x="110" y="365" text-anchor="middle" class="tag">结果：下一层所需布局</text></g><g transform="translate(491 80)"><rect width="220" height="410" rx="17" class="c"/><rect width="220" height="66" rx="17" fill="#2f855a"/><text x="110" y="40" text-anchor="middle" class="h">PP：切 Layer</text><text x="110" y="108" text-anchor="middle" class="tag">相邻 Stage</text><text x="110" y="143" text-anchor="middle" class="s">Stage 0：Layer 0–7</text><text x="110" y="171" text-anchor="middle" class="s">Stage 1：Layer 8–15</text><text x="110" y="225" text-anchor="middle" class="tag">边界激活不在下一卡</text><text x="110" y="280" text-anchor="middle" class="h" fill="#2f855a">P2P Send / Recv</text><text x="110" y="315" text-anchor="middle" class="s">前向激活、反向梯度</text><text x="110" y="365" text-anchor="middle" class="tag">结果：流水线前进</text></g><g transform="translate(724 80)"><rect width="220" height="410" rx="17" class="c"/><rect width="220" height="66" rx="17" fill="#db7c20"/><text x="110" y="40" text-anchor="middle" class="h">CP：切 Sequence</text><text x="110" y="108" text-anchor="middle" class="tag">每卡只有一段 Token</text><text x="110" y="143" text-anchor="middle" class="s">Rank 0：Token 0…S/2</text><text x="110" y="171" text-anchor="middle" class="s">Rank 1：Token S/2…S</text><text x="110" y="225" text-anchor="middle" class="tag">全局 Attention 缺 K/V</text><text x="110" y="280" text-anchor="middle" class="h" fill="#db7c20">AG / A2A / Ring</text><text x="110" y="315" text-anchor="middle" class="s">交换 K/V 或中间结果</text><text x="110" y="365" text-anchor="middle" class="tag">结果：获得全局上下文</text></g><g transform="translate(957 80)"><rect width="220" height="410" rx="17" class="c"/><rect width="220" height="66" rx="17" fill="#d14b65"/><text x="110" y="40" text-anchor="middle" class="h">EP：切 Expert</text><text x="110" y="108" text-anchor="middle" class="tag">目标 Expert 在其他卡</text><text x="110" y="143" text-anchor="middle" class="s">Token A → Expert 3</text><text x="110" y="171" text-anchor="middle" class="s">Token B → Expert 0</text><text x="110" y="225" text-anchor="middle" class="tag">Token 必须按路由重排</text><text x="110" y="280" text-anchor="middle" class="h" fill="#d14b65">Alltoall × 2</text><text x="110" y="315" text-anchor="middle" class="s">Dispatch 再 Combine</text><text x="110" y="365" text-anchor="middle" class="tag">结果：送达并恢复所有权</text></g><text x="600" y="535" text-anchor="middle" class="s">AG = AllGather · AR = AllReduce · RS = ReduceScatter · A2A = Alltoall</text></svg>
