<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 23px sans-serif;fill:#172033}.s{font:17px sans-serif;fill:#475569}.b{fill:#fff;stroke:#64748b;stroke-width:2}.on{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.off{fill:#e2e8f0;stroke:#94a3b8;stroke-width:2}</style></defs><rect width="1200" height="560" rx="24" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="t">参数容量与单 Token 计算量不再必须一起增长</text><rect x="45" y="85" width="500" height="400" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="295" y="125" text-anchor="middle" class="t">Dense FFN</text><rect x="85" y="190" width="125" height="65" rx="12" class="b"/><text x="147" y="230" text-anchor="middle" class="t">Token x</text><path d="M210 222H275" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="285" y="165" width="200" height="115" rx="14" class="on"/><text x="385" y="210" text-anchor="middle" class="t">唯一 FFN</text><text x="385" y="244" text-anchor="middle" class="s">所有 Token 共用</text><text x="295" y="345" text-anchor="middle" class="s">扩大 FFN 参数</text><text x="295" y="380" text-anchor="middle" class="s">→ 每个 Token 都多算</text><text x="295" y="438" text-anchor="middle" class="t" font-size="20">总参数 = 激活参数</text>
<rect x="655" y="85" width="500" height="400" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="905" y="125" text-anchor="middle" class="t">Sparse MoE</text><rect x="690" y="190" width="110" height="65" rx="12" class="b"/><text x="745" y="230" text-anchor="middle" class="t">Token x</text><rect x="835" y="185" width="105" height="75" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="887" y="230" text-anchor="middle" class="t">Router</text><path d="M800 222H825" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><g><rect x="990" y="135" width="115" height="60" rx="10" class="off"/><rect x="990" y="210" width="115" height="60" rx="10" class="on"/><rect x="990" y="285" width="115" height="60" rx="10" class="off"/><rect x="990" y="360" width="115" height="60" rx="10" class="on"/></g><text x="1047" y="172" text-anchor="middle" class="s">Expert 0</text><text x="1047" y="247" text-anchor="middle" class="s">Expert 1 ✓</text><text x="1047" y="322" text-anchor="middle" class="s">Expert 2</text><text x="1047" y="397" text-anchor="middle" class="s">Expert 3 ✓</text><path d="M940 222C965 222 960 240 980 240M940 222C960 222 960 390 980 390" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/><text x="805" y="345" text-anchor="middle" class="s">保存 4 套 Expert</text><text x="805" y="380" text-anchor="middle" class="s">本 Token 只执行 2 套</text><text x="905" y="455" text-anchor="middle" class="t" font-size="20">总参数 ＞ 激活参数</text><text x="600" y="530" text-anchor="middle" class="s">灰色 Expert 本轮不计算，但其权重仍然需要存放在设备或设备集群中</text></svg>
