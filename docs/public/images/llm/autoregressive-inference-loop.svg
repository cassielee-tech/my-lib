<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 23px sans-serif;fill:#172033}.s{font:17px sans-serif;fill:#475569}.b{fill:#fff;stroke:#64748b;stroke-width:2}.p{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.d{fill:#dcfce7;stroke:#16a34a;stroke-width:2}</style></defs><rect width="1200" height="540" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">一次处理 Prompt，随后每轮只产生一个新 Token</text>
<rect x="45" y="105" width="260" height="76" rx="14" class="b"/><text x="175" y="136" text-anchor="middle" class="t">Prompt Tokens</text><text x="175" y="164" text-anchor="middle" class="s">天空 / 为什么 / 是 / 蓝色</text><path d="M305 143H380" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="390" y="92" width="230" height="102" rx="15" class="p"/><text x="505" y="130" text-anchor="middle" class="t">Prefill</text><text x="505" y="158" text-anchor="middle" class="s">处理全部 Prompt</text><text x="505" y="181" text-anchor="middle" class="s">并建立 KV Cache</text><path d="M620 143H695" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="705" y="105" width="160" height="76" rx="14" class="d"/><text x="785" y="137" text-anchor="middle" class="t">采样</text><text x="785" y="165" text-anchor="middle" class="s">得到“因”</text>
<path d="M785 181V245" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="675" y="255" width="220" height="92" rx="15" class="d"/><text x="785" y="291" text-anchor="middle" class="t">Decode 一步</text><text x="785" y="320" text-anchor="middle" class="s">输入最新 Token“因”</text><path d="M895 301H970" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="980" y="264" width="160" height="76" rx="14" class="d"/><text x="1060" y="296" text-anchor="middle" class="t">采样</text><text x="1060" y="324" text-anchor="middle" class="s">得到“为”</text><path d="M1060 340V420H785V357" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/><text x="930" y="449" text-anchor="middle" class="s">把新 Token 追加到上下文，循环直到停止</text>
<rect x="45" y="270" width="480" height="130" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="285" y="307" text-anchor="middle" class="t" font-size="21">Token 之间存在串行依赖</text><text x="285" y="339" text-anchor="middle" class="s">不知道“因”，就无法构造下一轮输入并生成“为”</text><text x="285" y="371" text-anchor="middle" class="s">因此一段答案不能像分类结果一样一次直接得到</text></svg>
