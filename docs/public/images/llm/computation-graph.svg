<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">线性回归的计算图</title><desc id="desc">输入 x 和参数 w 经过乘法与偏置加法得到预测，再与目标计算平方损失。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:22px;font-weight:600}.t{font-size:17px}.s{font-size:14px;fill:#546e7a}.data{fill:#e3f2fd;stroke:#4285b4;stroke-width:2}.param{fill:#fff3e0;stroke:#ef8c28;stroke-width:2}.op{fill:#f3e5f5;stroke:#8e5aa7;stroke-width:2}.loss{fill:#ffebee;stroke:#d05252;stroke-width:2}.edge{stroke:#607d8b;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs>
  <text x="480" y="35" text-anchor="middle" class="h">前向传播构建计算图</text>
  <rect x="45" y="80" width="100" height="58" rx="10" class="data"/><text x="95" y="115" text-anchor="middle" class="t">输入 x</text>
  <rect x="45" y="180" width="100" height="58" rx="10" class="param"/><text x="95" y="215" text-anchor="middle" class="t">参数 w</text>
  <rect x="210" y="125" width="90" height="70" rx="35" class="op"/><text x="255" y="167" text-anchor="middle" class="h">×</text>
  <rect x="215" y="260" width="100" height="58" rx="10" class="param"/><text x="265" y="295" text-anchor="middle" class="t">偏置 b</text>
  <rect x="385" y="160" width="90" height="70" rx="35" class="op"/><text x="430" y="202" text-anchor="middle" class="h">+</text>
  <rect x="545" y="166" width="120" height="58" rx="10" class="data"/><text x="605" y="202" text-anchor="middle" class="t">预测 ŷ</text>
  <rect x="545" y="285" width="120" height="58" rx="10" class="data"/><text x="605" y="321" text-anchor="middle" class="t">目标 y</text>
  <rect x="745" y="195" width="150" height="75" rx="12" class="loss"/><text x="820" y="226" text-anchor="middle" class="t">平方损失 L</text><text x="820" y="250" text-anchor="middle" class="s">(ŷ-y)²</text>
  <path d="M145 109L212 143M145 209L212 176M300 160L385 188M315 289L406 229M475 195H545M665 195L745 220M665 314L745 250" class="edge"/>
  <text x="480" y="392" text-anchor="middle" class="s">节点保存数值与运算关系，反向传播会沿图的反方向应用链式法则</text>
</svg>
