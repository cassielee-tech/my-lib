<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Scaled Dot-Product Attention 的矩阵形状变化</title><desc id="desc">输入X经过三个线性投影得到QKV，Q乘K转置形成序列长度乘序列长度的分数矩阵，缩放遮罩和Softmax后再乘V得到输出。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:23px;font-weight:600}.n{font-size:17px;font-weight:600}.t{font-size:14px}.s{font-size:12px;fill:#607d8b}.x{fill:#e3f2fd;stroke:#4285b4;stroke-width:1.6}.q{fill:#f3e5f5;stroke:#8e5aa7;stroke-width:1.6}.k{fill:#fff3e0;stroke:#ef8c28;stroke-width:1.6}.v{fill:#e8f5e9;stroke:#43a047;stroke-width:1.6}.score{fill:#ffebee;stroke:#d05252;stroke-width:1.6}.op{fill:#f7f9fb;stroke:#78909c;stroke-width:1.5}.arrow{stroke:#607d8b;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs>
  <text x="550" y="34" text-anchor="middle" class="h">单头 Attention：先生成 S×S 关系矩阵，再按关系混合 Value</text>
  <rect x="45" y="85" width="180" height="80" rx="10" class="x"/><text x="135" y="115" text-anchor="middle" class="n">输入 X</text><text x="135" y="143" text-anchor="middle" class="t">[B, S, H]</text>
  <path d="M225 125H275" class="arrow"/>
  <g transform="translate(285 63)"><rect width="170" height="70" rx="9" class="q"/><text x="85" y="28" text-anchor="middle" class="n">Q = XWQ</text><text x="85" y="53" text-anchor="middle" class="t">[B, S, D]</text><rect y="87" width="170" height="70" rx="9" class="k"/><text x="85" y="115" text-anchor="middle" class="n">K = XWK</text><text x="85" y="140" text-anchor="middle" class="t">[B, S, D]</text><rect y="174" width="170" height="70" rx="9" class="v"/><text x="85" y="202" text-anchor="middle" class="n">V = XWV</text><text x="85" y="227" text-anchor="middle" class="t">[B, S, Dv]</text></g>
  <path d="M455 98C510 98 510 180 550 180M455 185H550" class="arrow"/><rect x="560" y="135" width="200" height="90" rx="10" class="score"/><text x="660" y="166" text-anchor="middle" class="n">QKᵀ</text><text x="660" y="192" text-anchor="middle" class="t">[B,S,D] × [B,D,S]</text><text x="660" y="213" text-anchor="middle" class="t">→ [B, S, S]</text>
  <path d="M760 180H800" class="arrow"/><rect x="810" y="135" width="245" height="90" rx="10" class="op"/><text x="932" y="160" text-anchor="middle" class="n">÷ √D → Mask → Softmax</text><text x="932" y="187" text-anchor="middle" class="t">Attention 权重 A</text><text x="932" y="211" text-anchor="middle" class="t">[B, S, S]，每行和为 1</text>
  <path d="M932 225V300H690" class="arrow"/><path d="M455 272C530 272 545 335 610 335" class="arrow"/><rect x="610" y="295" width="230" height="85" rx="10" class="v"/><text x="725" y="325" text-anchor="middle" class="n">O = A × V</text><text x="725" y="351" text-anchor="middle" class="t">[B,S,S] × [B,S,Dv]</text><text x="725" y="372" text-anchor="middle" class="t">→ [B, S, Dv]</text>
  <g transform="translate(105 435)"><rect width="890" height="125" rx="12" class="op"/><text x="445" y="28" text-anchor="middle" class="n">读 Shape 的关键</text><text x="35" y="59" class="t">① Q 的每一行代表一个“查询位置”</text><text x="35" y="87" class="t">② Kᵀ 的每一列代表一个“被查询位置”</text><text x="35" y="111" class="t">③ 所以 QKᵀ[i,j] 表示位置 i 对位置 j 的匹配分数</text><text x="490" y="59" class="t">④ 每行 Softmax：位置 i 如何分配注意力</text><text x="490" y="87" class="t">⑤ A×V：用这一行权重汇总所有 Value</text><text x="490" y="111" class="t">⑥ 输出仍有 S 个位置，每个位置一个新向量</text></g>
  <text x="550" y="603" text-anchor="middle" class="s">S×S 是标准 Attention 长序列成本的来源；实现可避免完整保存该矩阵，但数学语义不变</text>
</svg>
