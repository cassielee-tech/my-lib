<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker><style>.t{font:700 24px sans-serif;fill:#172033}.s{font:18px sans-serif;fill:#475569}.m{font:20px monospace;fill:#1e293b}</style></defs>
  <rect width="1100" height="560" rx="24" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" class="t">同一二维平面中，点积看到的是两次旋转的角度差</text>
  <g transform="translate(275 285)"><circle r="175" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><path d="M-190 0H190M0-190V190" stroke="#94a3b8"/><path d="M0 0L130-70" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><text x="130" y="-82" class="s">原始内容向量</text><path d="M0 0L75-135" stroke="#16a34a" stroke-width="6" marker-end="url(#a)"/><text x="16" y="-155" class="s">位置 m：mθ</text><path d="M0 0L-24-151" stroke="#f97316" stroke-width="6" marker-end="url(#a)"/><text x="-145" y="-160" class="s">位置 n：nθ</text><path d="M57-102 A117 117 0 0 0 -18-116" fill="none" stroke="#7c3aed" stroke-width="4"/><text x="18" y="-116" class="m">(n-m)θ</text></g>
  <g transform="translate(535 110)"><rect width="500" height="350" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="250" y="45" text-anchor="middle" class="t" font-size="21">旋转后的点积</text><text x="38" y="100" class="m">q′ₘ = R(mθ)q</text><text x="38" y="145" class="m">k′ₙ = R(nθ)k</text><path d="M35 175H465" stroke="#cbd5e1"/><text x="38" y="220" class="m">q′ₘᵀk′ₙ = qᵀR((n-m)θ)k</text><rect x="35" y="260" width="430" height="62" rx="12" fill="#ede9fe"/><text x="250" y="286" text-anchor="middle" class="s">m、n 同时加 c，角度差不变</text><text x="250" y="312" text-anchor="middle" class="m">(n+c)-(m+c)=n-m</text></g>
  <text x="550" y="520" text-anchor="middle" class="s">绝对位置决定各自旋转多少；Q 与 K 做点积时，公共旋转被抵消，只留下相对距离</text>
</svg>
