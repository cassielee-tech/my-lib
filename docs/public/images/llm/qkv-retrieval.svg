<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Query Key Value 如何完成上下文检索</title><desc id="desc">句子中的当前Token用Query与各位置Key计算匹配分数，Softmax得到权重，再对各位置Value加权求和形成上下文向量。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:23px;font-weight:600}.n{font-size:17px;font-weight:600}.t{font-size:14px}.s{font-size:12px;fill:#607d8b}.tok{fill:#e3f2fd;stroke:#4285b4;stroke-width:1.5}.query{fill:#f3e5f5;stroke:#8e5aa7;stroke-width:1.7}.key{fill:#fff3e0;stroke:#ef8c28;stroke-width:1.5}.value{fill:#e8f5e9;stroke:#43a047;stroke-width:1.5}.score{fill:#ffebee;stroke:#d05252;stroke-width:1.5}.arrow{stroke:#607d8b;stroke-width:2;fill:none;marker-end:url(#a)}.match{stroke:#8e5aa7;stroke-width:2;fill:none;marker-end:url(#p)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8e5aa7"/></marker></defs>
  <text x="550" y="34" text-anchor="middle" class="h">Attention = 用 Query 找相关位置，再聚合这些位置的 Value</text>
  <text x="55" y="91" class="n">输入序列</text><g transform="translate(190 62)"><rect width="130" height="55" rx="7" class="tok"/><text x="65" y="34" text-anchor="middle" class="t">小明</text><rect x="145" width="130" height="55" rx="7" class="tok"/><text x="210" y="34" text-anchor="middle" class="t">把书</text><rect x="290" width="130" height="55" rx="7" class="tok"/><text x="355" y="34" text-anchor="middle" class="t">放在桌上</text><rect x="435" width="130" height="55" rx="7" class="tok"/><text x="500" y="34" text-anchor="middle" class="t">因为</text><rect x="580" width="130" height="55" rx="7" class="query"/><text x="645" y="34" text-anchor="middle" class="t">它很重</text></g>
  <path d="M835 117V162" class="arrow"/><rect x="755" y="165" width="220" height="65" rx="9" class="query"/><text x="865" y="191" text-anchor="middle" class="n">当前位置的 Query</text><text x="865" y="214" text-anchor="middle" class="s">“我需要找谁与‘它’相关？”</text>
  <text x="55" y="287" class="n">每个位置提供 Key</text><g transform="translate(190 255)"><rect width="130" height="54" rx="7" class="key"/><text x="65" y="33" text-anchor="middle" class="t">K₀ 小明</text><rect x="145" width="130" height="54" rx="7" class="key"/><text x="210" y="33" text-anchor="middle" class="t">K₁ 书</text><rect x="290" width="130" height="54" rx="7" class="key"/><text x="355" y="33" text-anchor="middle" class="t">K₂ 桌</text><rect x="435" width="130" height="54" rx="7" class="key"/><text x="500" y="33" text-anchor="middle" class="t">K₃ 因为</text><rect x="580" width="130" height="54" rx="7" class="key"/><text x="645" y="33" text-anchor="middle" class="t">K₄ 它</text></g>
  <path d="M805 230C720 250 690 260 655 274M805 230C650 230 560 245 500 274M805 230C560 210 390 230 355 274M805 230C470 190 270 220 210 274M805 230C380 170 210 205 65 274" class="match"/>
  <text x="55" y="380" class="n">匹配分数 → Softmax 权重</text><g transform="translate(190 345)"><rect width="130" height="60" rx="7" class="score"/><text x="65" y="25" text-anchor="middle" class="t">0.05</text><text x="65" y="46" text-anchor="middle" class="s">小明</text><rect x="145" width="130" height="60" rx="7" class="score"/><text x="210" y="25" text-anchor="middle" class="n">0.65</text><text x="210" y="46" text-anchor="middle" class="s">书</text><rect x="290" width="130" height="60" rx="7" class="score"/><text x="355" y="25" text-anchor="middle" class="t">0.15</text><text x="355" y="46" text-anchor="middle" class="s">桌</text><rect x="435" width="130" height="60" rx="7" class="score"/><text x="500" y="25" text-anchor="middle" class="t">0.03</text><text x="500" y="46" text-anchor="middle" class="s">因为</text><rect x="580" width="130" height="60" rx="7" class="score"/><text x="645" y="25" text-anchor="middle" class="t">0.12</text><text x="645" y="46" text-anchor="middle" class="s">它</text></g>
  <text x="55" y="475" class="n">按权重聚合 Value</text><g transform="translate(190 440)"><rect width="130" height="55" rx="7" class="value"/><text x="65" y="33" text-anchor="middle" class="t">V₀ × 0.05</text><rect x="145" width="130" height="55" rx="7" class="value"/><text x="210" y="33" text-anchor="middle" class="t">V₁ × 0.65</text><rect x="290" width="130" height="55" rx="7" class="value"/><text x="355" y="33" text-anchor="middle" class="t">V₂ × 0.15</text><rect x="435" width="130" height="55" rx="7" class="value"/><text x="500" y="33" text-anchor="middle" class="t">V₃ × 0.03</text><rect x="580" width="130" height="55" rx="7" class="value"/><text x="645" y="33" text-anchor="middle" class="t">V₄ × 0.12</text></g><path d="M900 467H970" class="arrow"/><rect x="870" y="520" width="195" height="65" rx="9" class="value"/><text x="967" y="546" text-anchor="middle" class="n">上下文向量 O</text><text x="967" y="568" text-anchor="middle" class="s">更突出“书”的信息</text><path d="M835 467C890 470 920 490 950 520" class="arrow"/>
  <text x="550" y="609" text-anchor="middle" class="s">图中语义仅用于直觉说明；真实 Q/K/V 是训练得到的浮点向量，注意力权重不保证等同于人类可解释关系</text>
</svg>
