<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
  <title id="title">Decoder-only 语言模型的错位预测目标</title>
  <desc id="desc">输入序列每个位置只能看到当前位置及之前的Token，并预测下一个Token。输入和标签错开一位，一条长度五的序列提供四个训练目标。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:23px;font-weight:600}.n{font-size:17px;font-weight:600}.t{font-size:14px}.s{font-size:12px;fill:#607d8b}.in{fill:#e3f2fd;stroke:#4285b4;stroke-width:1.6}.target{fill:#e8f5e9;stroke:#43a047;stroke-width:1.6}.mask{fill:#f3e5f5;stroke:#8e5aa7;stroke-width:1.4}.cell{fill:#fff;stroke:#aab7c1;stroke-width:1}.visible{fill:#d1c4e9;stroke:#8e5aa7;stroke-width:1}.arrow{stroke:#607d8b;stroke-width:2;fill:none;marker-end:url(#a)}.predict{stroke:#43a047;stroke-width:2.2;fill:none;marker-end:url(#g)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#43a047"/></marker></defs>
  <text x="550" y="34" text-anchor="middle" class="h">Causal Language Modeling：当前位置根据左侧上下文预测下一个 Token</text>
  <text x="70" y="102" class="n">完整训练序列</text>
  <g transform="translate(265 70)"><rect width="110" height="56" rx="7" class="in"/><text x="55" y="34" text-anchor="middle" class="t">[BOS]</text><rect x="120" width="110" height="56" rx="7" class="in"/><text x="175" y="34" text-anchor="middle" class="t">我</text><rect x="240" width="110" height="56" rx="7" class="in"/><text x="295" y="34" text-anchor="middle" class="t">喜欢</text><rect x="360" width="110" height="56" rx="7" class="in"/><text x="415" y="34" text-anchor="middle" class="t">AI</text><rect x="480" width="110" height="56" rx="7" class="in"/><text x="535" y="34" text-anchor="middle" class="t">[EOS]</text></g>
  <text x="70" y="190" class="n">模型输入</text><g transform="translate(265 156)"><rect width="110" height="56" rx="7" class="in"/><text x="55" y="34" text-anchor="middle" class="t">[BOS]</text><rect x="120" width="110" height="56" rx="7" class="in"/><text x="175" y="34" text-anchor="middle" class="t">我</text><rect x="240" width="110" height="56" rx="7" class="in"/><text x="295" y="34" text-anchor="middle" class="t">喜欢</text><rect x="360" width="110" height="56" rx="7" class="in"/><text x="415" y="34" text-anchor="middle" class="t">AI</text></g>
  <text x="70" y="280" class="n">监督标签</text><g transform="translate(385 246)"><rect width="110" height="56" rx="7" class="target"/><text x="55" y="34" text-anchor="middle" class="t">我</text><rect x="120" width="110" height="56" rx="7" class="target"/><text x="175" y="34" text-anchor="middle" class="t">喜欢</text><rect x="240" width="110" height="56" rx="7" class="target"/><text x="295" y="34" text-anchor="middle" class="t">AI</text><rect x="360" width="110" height="56" rx="7" class="target"/><text x="415" y="34" text-anchor="middle" class="t">[EOS]</text></g>
  <path d="M320 212C320 238 400 225 440 246M440 212C440 238 520 225 560 246M560 212C560 238 640 225 680 246M680 212C680 238 760 225 800 246" class="predict"/>
  <text x="550" y="330" text-anchor="middle" class="s">同一序列同时产生 4 个训练位置；每个箭头都是一次“下一个 Token 分类”</text>

  <text x="70" y="390" class="n">因果遮罩</text><text x="70" y="414" class="s">第 i 行表示位置 i 能看到哪些输入位置</text>
  <g transform="translate(350 360)"><text x="-20" y="31" text-anchor="middle" class="s">0</text><text x="-20" y="71" text-anchor="middle" class="s">1</text><text x="-20" y="111" text-anchor="middle" class="s">2</text><text x="-20" y="151" text-anchor="middle" class="s">3</text><text x="20" y="-8" text-anchor="middle" class="s">0</text><text x="60" y="-8" text-anchor="middle" class="s">1</text><text x="100" y="-8" text-anchor="middle" class="s">2</text><text x="140" y="-8" text-anchor="middle" class="s">3</text>
    <rect width="40" height="40" class="visible"/><rect x="40" width="40" height="40" class="cell"/><rect x="80" width="40" height="40" class="cell"/><rect x="120" width="40" height="40" class="cell"/>
    <rect y="40" width="40" height="40" class="visible"/><rect x="40" y="40" width="40" height="40" class="visible"/><rect x="80" y="40" width="40" height="40" class="cell"/><rect x="120" y="40" width="40" height="40" class="cell"/>
    <rect y="80" width="40" height="40" class="visible"/><rect x="40" y="80" width="40" height="40" class="visible"/><rect x="80" y="80" width="40" height="40" class="visible"/><rect x="120" y="80" width="40" height="40" class="cell"/>
    <rect y="120" width="40" height="40" class="visible"/><rect x="40" y="120" width="40" height="40" class="visible"/><rect x="80" y="120" width="40" height="40" class="visible"/><rect x="120" y="120" width="40" height="40" class="visible"/>
  </g>
  <g transform="translate(610 374)"><rect width="410" height="116" rx="10" class="mask"/><text x="205" y="28" text-anchor="middle" class="n">为什么不能偷看右侧？</text><text x="205" y="56" text-anchor="middle" class="t">训练时标签已经出现在完整文本中。</text><text x="205" y="79" text-anchor="middle" class="t">遮住未来位置，才能让训练条件与生成时一致：</text><text x="205" y="102" text-anchor="middle" class="t">只根据已经出现的 Token 预测下一个 Token。</text></g>
</svg>
