<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">隐藏向量经过输出投影、Softmax和交叉熵形成Loss</title>
  <desc id="desc">一个位置的隐藏向量通过词表输出矩阵得到每个Token的logit，Softmax转为概率，交叉熵只关注正确Token的概率并计算负对数损失。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:23px;font-weight:600}.n{font-size:17px;font-weight:600}.t{font-size:14px}.s{font-size:12px;fill:#607d8b}.hidden{fill:#e3f2fd;stroke:#4285b4;stroke-width:1.6}.linear{fill:#fff3e0;stroke:#ef8c28;stroke-width:1.6}.prob{fill:#e8f5e9;stroke:#43a047;stroke-width:1.6}.loss{fill:#ffebee;stroke:#d05252;stroke-width:1.6}.barbg{fill:#eceff1}.bar{fill:#7cb987}.correct{fill:#43a047}.arrow{stroke:#607d8b;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs>
  <text x="550" y="34" text-anchor="middle" class="h">每个位置都在整个词表上做一次分类</text>
  <g transform="translate(35 100)"><rect width="190" height="125" rx="11" class="hidden"/><text x="95" y="31" text-anchor="middle" class="n">隐藏向量 h</text><text x="95" y="62" text-anchor="middle" class="t">shape: [H]</text><text x="95" y="90" text-anchor="middle" class="s">已融合左侧上下文</text><text x="95" y="110" text-anchor="middle" class="s">例如：“[BOS] 我”</text></g>
  <path d="M225 162H275" class="arrow"/>
  <g transform="translate(280 100)"><rect width="220" height="125" rx="11" class="linear"/><text x="110" y="31" text-anchor="middle" class="n">输出投影 hWᵀ</text><text x="110" y="59" text-anchor="middle" class="t">W: [V, H]</text><text x="110" y="84" text-anchor="middle" class="t">logits: [V]</text><text x="110" y="108" text-anchor="middle" class="s">每个词表 Token 得到一个原始分数</text></g>
  <path d="M500 162H550" class="arrow"/>
  <g transform="translate(555 72)"><rect width="280" height="220" rx="11" class="prob"/><text x="140" y="31" text-anchor="middle" class="n">Softmax → 概率分布</text><text x="20" y="68" class="t">我</text><rect x="65" y="54" width="175" height="20" rx="3" class="barbg"/><rect x="65" y="54" width="28" height="20" rx="3" class="bar"/><text x="252" y="69" class="t">0.08</text><text x="20" y="104" class="t">喜欢</text><rect x="65" y="90" width="175" height="20" rx="3" class="barbg"/><rect x="65" y="90" width="126" height="20" rx="3" class="correct"/><text x="252" y="105" class="t">0.72</text><text x="20" y="140" class="t">AI</text><rect x="65" y="126" width="175" height="20" rx="3" class="barbg"/><rect x="65" y="126" width="21" height="20" rx="3" class="bar"/><text x="252" y="141" class="t">0.06</text><text x="20" y="176" class="t">其他</text><rect x="65" y="162" width="175" height="20" rx="3" class="barbg"/><rect x="65" y="162" width="24" height="20" rx="3" class="bar"/><text x="252" y="177" class="t">0.14</text><text x="140" y="207" text-anchor="middle" class="s">所有 V 个概率之和为 1</text></g>
  <path d="M835 182H885" class="arrow"/>
  <g transform="translate(890 100)"><rect width="175" height="125" rx="11" class="loss"/><text x="87" y="29" text-anchor="middle" class="n">正确标签</text><text x="87" y="55" text-anchor="middle" class="t">“喜欢”</text><text x="87" y="82" text-anchor="middle" class="n">Loss</text><text x="87" y="108" text-anchor="middle" class="t">−log(0.72)</text></g>

  <g transform="translate(110 345)"><text x="0" y="0" class="n">正确 Token 概率越高，Loss 越小</text><line x1="0" y1="155" x2="820" y2="155" stroke="#78909c" stroke-width="1.5"/><line x1="0" y1="35" x2="0" y2="155" stroke="#78909c" stroke-width="1.5"/><text x="0" y="178" text-anchor="middle" class="s">0</text><text x="205" y="178" text-anchor="middle" class="s">0.25</text><text x="410" y="178" text-anchor="middle" class="s">0.50</text><text x="615" y="178" text-anchor="middle" class="s">0.75</text><text x="820" y="178" text-anchor="middle" class="s">1.00</text><text x="410" y="202" text-anchor="middle" class="s">正确 Token 的预测概率 p</text><text x="-12" y="43" text-anchor="end" class="s">Loss 高</text><text x="-12" y="155" text-anchor="end" class="s">0</text><path d="M8 42C35 80 100 113 205 128S520 148 812 153" fill="none" stroke="#d05252" stroke-width="3"/><circle cx="590" cy="146" r="6" fill="#43a047"/><text x="590" y="130" text-anchor="middle" class="t">p=0.72</text></g>
  <text x="550" y="588" text-anchor="middle" class="s">训练代码通常直接把 logits 交给 CrossEntropyLoss；它会用数值稳定的方式合并 LogSoftmax 与 NLLLoss，无需手动 Softmax</text>
</svg>
