<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">从标量到大模型三维张量</title>
  <desc id="desc">依次展示标量、向量、矩阵以及形状为批次、序列长度、隐藏维度的三维张量。</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:22px;font-weight:600}.t{font-size:17px}.s{font-size:14px;fill:#546e7a}.box{fill:#eef6ff;stroke:#4f86c6;stroke-width:2}.cell{fill:#dceeff;stroke:#4f86c6;stroke-width:1.5}.accent{fill:#e8f5e9;stroke:#43a047;stroke-width:2}.arrow{stroke:#78909c;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#78909c"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" class="h">张量只是带形状的多维数据</text>
  <rect x="45" y="120" width="90" height="70" rx="10" class="box"/><text x="90" y="162" text-anchor="middle" class="t">3.14</text><text x="90" y="222" text-anchor="middle" class="t">标量</text><text x="90" y="246" text-anchor="middle" class="s">shape: []</text>
  <path d="M150 155H205" class="arrow"/>
  <g transform="translate(225 115)"><rect width="46" height="38" class="cell"/><rect y="38" width="46" height="38" class="cell"/><rect y="76" width="46" height="38" class="cell"/><rect y="114" width="46" height="38" class="cell"/></g><text x="248" y="292" text-anchor="middle" class="t">向量</text><text x="248" y="316" text-anchor="middle" class="s">shape: [4]</text>
  <path d="M292 155H347" class="arrow"/>
  <g transform="translate(367 110)"><rect width="150" height="120" rx="6" class="box"/><path d="M417 110V230M467 110V230M367 150H517M367 190H517" stroke="#4f86c6" stroke-width="1.5"/></g><text x="442" y="270" text-anchor="middle" class="t">矩阵</text><text x="442" y="294" text-anchor="middle" class="s">shape: [3, 3]</text>
  <path d="M535 155H590" class="arrow"/>
  <g transform="translate(610 92)"><rect x="42" y="0" width="210" height="126" rx="7" class="cell" opacity=".55"/><rect x="21" y="18" width="210" height="126" rx="7" class="cell" opacity=".75"/><rect x="0" y="36" width="210" height="126" rx="7" class="accent"/><path d="M70 128H150M110 88V168" stroke="#43a047" stroke-width="1.5" opacity=".55"/></g><text x="726" y="285" text-anchor="middle" class="t">大模型常见三维张量</text><text x="726" y="309" text-anchor="middle" class="s">[batch, sequence, hidden]</text>
</svg>
