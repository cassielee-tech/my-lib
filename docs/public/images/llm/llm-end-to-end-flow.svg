<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">大模型端到端数据流</title><desc id="desc">文本经过分词和嵌入进入多层解码器，训练分支计算损失和反向传播，推理分支采样并更新缓存。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker><style>.t{font:700 25px system-ui;fill:#182230}.h{font:700 17px system-ui;fill:#24364b}.s{font:15px system-ui;fill:#52606d}.b{fill:#fff;stroke:#9aa8b6;stroke-width:2}.core{fill:#e8f1ff;stroke:#3677d2;stroke-width:2}.train{fill:#f1eaff;stroke:#805ad5;stroke-width:2}.infer{fill:#e9f8ef;stroke:#2f855a;stroke-width:2}.arr{stroke:#718096;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="500" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">同一套 Decoder，训练和推理在输出端分叉</text><g class="b"><rect x="35" y="145" width="125" height="70" rx="13"/><rect x="200" y="145" width="125" height="70" rx="13"/><rect x="365" y="145" width="125" height="70" rx="13"/></g><text x="98" y="187" text-anchor="middle" class="h">文本</text><text x="263" y="177" text-anchor="middle" class="h">Tokenizer</text><text x="263" y="200" text-anchor="middle" class="s">[B,S]</text><text x="428" y="177" text-anchor="middle" class="h">Embedding</text><text x="428" y="200" text-anchor="middle" class="s">[B,S,D]</text><path d="M160 180H195M325 180H360" class="arr"/><rect x="535" y="105" width="290" height="150" rx="18" class="core"/><text x="680" y="138" text-anchor="middle" class="h">Decoder Block × 32</text><text x="680" y="170" text-anchor="middle" class="s">RMSNorm → GQA → Residual</text><text x="680" y="200" text-anchor="middle" class="s">RMSNorm → SwiGLU → Residual</text><text x="680" y="230" text-anchor="middle" class="s">GEMM · RoPE · Softmax · Elementwise</text><path d="M490 180H530" class="arr"/><rect x="870" y="145" width="140" height="70" rx="13" class="b"/><text x="940" y="177" text-anchor="middle" class="h">LM Head</text><text x="940" y="200" text-anchor="middle" class="s">[B,S,V]</text><path d="M825 180H865" class="arr"/><path d="M940 220V290H780" class="arr"/><path d="M940 220V290H1090" class="arr"/><rect x="610" y="300" width="205" height="105" rx="15" class="train"/><text x="713" y="332" text-anchor="middle" class="h">训练</text><text x="713" y="360" text-anchor="middle" class="s">Cross Entropy → Loss</text><text x="713" y="386" text-anchor="middle" class="s">Backward → 梯度 → AdamW</text><rect x="975" y="300" width="190" height="105" rx="15" class="infer"/><text x="1070" y="332" text-anchor="middle" class="h">推理</text><text x="1070" y="360" text-anchor="middle" class="s">采样下一个 Token</text><text x="1070" y="386" text-anchor="middle" class="s">追加 K/V → 继续 Decode</text><path d="M610 355C470 355 440 280 535 230" class="arr"/><text x="450" y="350" class="s">梯度沿计算图反向传播</text></svg>
