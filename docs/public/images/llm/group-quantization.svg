<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">分组量化过程</title><desc id="desc">两组不同范围的浮点权重分别计算缩放比例，映射到相同的四位整数范围，再近似恢复。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#718096"/></marker><style>.t{font:700 25px system-ui,sans-serif;fill:#182230}.h{font:700 18px system-ui,sans-serif;fill:#24364b}.s{font:16px system-ui,sans-serif;fill:#52606d}.box{fill:#fff;stroke:#9aa8b6;stroke-width:2}.g1{fill:#e8f1ff;stroke:#3677d2}.g2{fill:#f1eaff;stroke:#805ad5}.q{fill:#e9f8ef;stroke:#2f855a}.arr{stroke:#718096;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="480" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">Group-wise INT4：局部范围各用一把“尺子”</text>
  <text x="155" y="93" text-anchor="middle" class="h">浮点权重（8 × 16 bit）</text><text x="505" y="93" text-anchor="middle" class="h">每组计算 Scale</text><text x="840" y="93" text-anchor="middle" class="h">INT4 权重（8 × 4 bit）</text><text x="1080" y="93" text-anchor="middle" class="h">近似反量化</text>
  <rect x="45" y="120" width="230" height="100" rx="14" class="g1"/><text x="160" y="154" text-anchor="middle" class="s">Group A：小范围</text><text x="160" y="190" text-anchor="middle" class="h">−0.7  −0.2  0.3  0.6</text>
  <rect x="45" y="260" width="230" height="100" rx="14" class="g2"/><text x="160" y="294" text-anchor="middle" class="s">Group B：大范围</text><text x="160" y="330" text-anchor="middle" class="h">−6.3  −2.1  2.8  5.6</text>
  <path d="M280 170H385" class="arr"/><path d="M280 310H385" class="arr"/>
  <rect x="395" y="125" width="220" height="90" rx="14" class="box"/><text x="505" y="160" text-anchor="middle" class="s">最大值约 0.7</text><text x="505" y="190" text-anchor="middle" class="h">sₐ = 0.7 ÷ 7 = 0.1</text>
  <rect x="395" y="265" width="220" height="90" rx="14" class="box"/><text x="505" y="300" text-anchor="middle" class="s">最大值约 6.3</text><text x="505" y="330" text-anchor="middle" class="h">sᵦ = 6.3 ÷ 7 = 0.9</text>
  <path d="M620 170H710" class="arr"/><path d="M620 310H710" class="arr"/>
  <rect x="720" y="125" width="240" height="90" rx="14" class="q"/><text x="840" y="158" text-anchor="middle" class="s">q = round(x ÷ sₐ)</text><text x="840" y="190" text-anchor="middle" class="h">−7  −2  3  6</text>
  <rect x="720" y="265" width="240" height="90" rx="14" class="q"/><text x="840" y="298" text-anchor="middle" class="s">q = round(x ÷ sᵦ)</text><text x="840" y="330" text-anchor="middle" class="h">−7  −2  3  6</text>
  <path d="M965 170H1010" class="arr"/><path d="M965 310H1010" class="arr"/>
  <text x="1080" y="160" text-anchor="middle" class="s">ŝ = sₐ × q</text><text x="1080" y="190" text-anchor="middle" class="h">−0.7 −0.2 0.3 0.6</text><text x="1080" y="300" text-anchor="middle" class="s">ŝ = sᵦ × q</text><text x="1080" y="330" text-anchor="middle" class="h">−6.3 −1.8 2.7 5.4</text>
  <text x="600" y="425" text-anchor="middle" class="s">整数编码相同，但每组 Scale 不同；恢复值会出现取整误差，低位存储还要额外保存 Scale。</text>
</svg>
