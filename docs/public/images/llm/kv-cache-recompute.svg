<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><style>.t{font:700 23px sans-serif;fill:#172033}.s{font:17px sans-serif;fill:#475569}.old{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.hit{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.new{fill:#dbeafe;stroke:#2563eb;stroke-width:2}</style><rect width="1200" height="590" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">KV Cache 用显存换掉逐轮重复计算</text>
<text x="65" y="100" class="t">不使用 Cache</text><text x="65" y="145" class="s">第 1 轮</text><g class="old"><rect x="180" y="118" width="90" height="52" rx="9"/><rect x="280" y="118" width="90" height="52" rx="9"/><rect x="380" y="118" width="90" height="52" rx="9"/></g><text x="225" y="151" text-anchor="middle" class="s">A 重算</text><text x="325" y="151" text-anchor="middle" class="s">B 重算</text><text x="425" y="151" text-anchor="middle" class="s">C 重算</text><text x="65" y="215" class="s">第 2 轮</text><g class="old"><rect x="180" y="188" width="90" height="52" rx="9"/><rect x="280" y="188" width="90" height="52" rx="9"/><rect x="380" y="188" width="90" height="52" rx="9"/><rect x="480" y="188" width="90" height="52" rx="9"/></g><text x="225" y="221" text-anchor="middle" class="s">A 重算</text><text x="325" y="221" text-anchor="middle" class="s">B 重算</text><text x="425" y="221" text-anchor="middle" class="s">C 重算</text><text x="525" y="221" text-anchor="middle" class="s">D 重算</text><text x="750" y="181" class="s">历史 Token 每轮再次经过全部层</text>
<path d="M50 285H1150" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/><text x="65" y="335" class="t">使用 KV Cache</text><text x="65" y="385" class="s">Prefill</text><g class="new"><rect x="180" y="355" width="90" height="52" rx="9"/><rect x="280" y="355" width="90" height="52" rx="9"/><rect x="380" y="355" width="90" height="52" rx="9"/></g><text x="225" y="388" text-anchor="middle" class="s">K/V A</text><text x="325" y="388" text-anchor="middle" class="s">K/V B</text><text x="425" y="388" text-anchor="middle" class="s">K/V C</text><text x="65" y="462" class="s">Decode D</text><g class="hit"><rect x="180" y="432" width="90" height="52" rx="9"/><rect x="280" y="432" width="90" height="52" rx="9"/><rect x="380" y="432" width="90" height="52" rx="9"/></g><rect x="480" y="432" width="90" height="52" rx="9" class="new"/><text x="225" y="465" text-anchor="middle" class="s">读 A</text><text x="325" y="465" text-anchor="middle" class="s">读 B</text><text x="425" y="465" text-anchor="middle" class="s">读 C</text><text x="525" y="465" text-anchor="middle" class="s">只算 D</text><text x="750" y="422" class="s">历史 K/V 直接读取</text><text x="750" y="458" class="s">但 Cache 随序列增长并占用显存</text><text x="600" y="548" text-anchor="middle" class="s">节省的是历史投影和层计算；当前 Q 仍需读取可见历史 K/V</text></svg>
