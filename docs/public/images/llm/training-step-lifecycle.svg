<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 24px sans-serif;fill:#172033}.s{font:17px sans-serif;fill:#475569}.b{fill:#fff;stroke:#64748b;stroke-width:2}.f{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.g{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.u{fill:#dcfce7;stroke:#16a34a;stroke-width:2}</style></defs>
  <rect width="1200" height="600" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">一次 Optimizer Step：四类数据在不同阶段出现</text>
  <g class="b"><rect x="45" y="105" width="145" height="64" rx="12"/><rect x="245" y="105" width="145" height="64" rx="12"/></g><text x="117" y="144" text-anchor="middle" class="t">Token / Label</text><text x="317" y="144" text-anchor="middle" class="t">模型参数 θ</text>
  <rect x="455" y="90" width="190" height="95" rx="14" class="f"/><text x="550" y="130" text-anchor="middle" class="t">前向传播</text><text x="550" y="159" text-anchor="middle" class="s">保存反向所需激活</text>
  <rect x="720" y="105" width="145" height="64" rx="12" class="f"/><text x="792" y="145" text-anchor="middle" class="t">Loss</text>
  <path d="M190 137H445M390 137H445M645 137H710" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
  <rect x="720" y="260" width="190" height="92" rx="14" class="g"/><text x="815" y="299" text-anchor="middle" class="t">反向传播</text><text x="815" y="329" text-anchor="middle" class="s">沿计算图求导</text><path d="M792 169V250" stroke="#dc2626" stroke-width="3" marker-end="url(#a)"/>
  <rect x="455" y="274" width="190" height="64" rx="12" class="g"/><text x="550" y="313" text-anchor="middle" class="t">参数梯度 ∇θL</text><path d="M710 306H655" stroke="#dc2626" stroke-width="3" marker-end="url(#a)"/>
  <rect x="220" y="260" width="170" height="92" rx="14" class="u"/><text x="305" y="299" text-anchor="middle" class="t">AdamW</text><text x="305" y="329" text-anchor="middle" class="s">读取 m、v 状态</text><path d="M445 306H400" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/>
  <rect x="45" y="274" width="125" height="64" rx="12" class="u"/><text x="107" y="313" text-anchor="middle" class="t">新参数 θ′</text><path d="M210 306H180" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/>
  <path d="M107 348V435C107 480 317 482 317 179" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/><text x="310" y="465" text-anchor="middle" class="s">下一步前向使用更新后的参数</text>
  <rect x="720" y="430" width="400" height="100" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="920" y="466" text-anchor="middle" class="t" font-size="21">关键边界</text><text x="920" y="497" text-anchor="middle" class="s">backward 只产生梯度；optimizer.step 才改变参数</text>
</svg>
