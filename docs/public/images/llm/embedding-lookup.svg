<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
  <title id="title">Token ID 通过 Embedding 查表变成向量</title>
  <desc id="desc">输入ID在形状为词表大小乘隐藏维度的Embedding权重表中选择对应行，三个ID得到三个隐藏向量，再与位置向量相加。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:23px;font-weight:600}.n{font-size:17px;font-weight:600}.t{font-size:14px}.s{font-size:12px;fill:#607d8b}.table{fill:#f7f9fb;stroke:#78909c;stroke-width:1.6}.row{fill:#e3f2fd;stroke:#4285b4;stroke-width:1.2}.hit{fill:#ffe0b2;stroke:#ef8c28;stroke-width:2}.out{fill:#e8f5e9;stroke:#43a047;stroke-width:1.6}.pos{fill:#f3e5f5;stroke:#8e5aa7;stroke-width:1.6}.arrow{stroke:#607d8b;stroke-width:2;fill:none;marker-end:url(#a)}.lookup{stroke:#ef8c28;stroke-width:2.2;fill:none;marker-end:url(#o)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef8c28"/></marker></defs>
  <text x="550" y="34" text-anchor="middle" class="h">Embedding 不是理解 ID 的大小，而是用 ID 选择参数表中的一行</text>
  <g transform="translate(45 95)"><text x="100" y="0" text-anchor="middle" class="n">input_ids [S]</text><rect x="20" y="25" width="55" height="45" rx="6" class="hit"/><text x="47" y="53" text-anchor="middle" class="t">42</text><rect x="79" y="25" width="55" height="45" rx="6" class="hit"/><text x="106" y="53" text-anchor="middle" class="t">815</text><rect x="138" y="25" width="55" height="45" rx="6" class="hit"/><text x="165" y="53" text-anchor="middle" class="t">9</text><text x="106" y="95" text-anchor="middle" class="s">“我”“喜欢”“AI”</text></g>
  <path d="M245 143H305" class="arrow"/>
  <g transform="translate(315 70)"><text x="205" y="0" text-anchor="middle" class="n">Embedding 权重 E [V, H]</text><rect x="40" y="20" width="330" height="285" rx="8" class="table"/><text x="15" y="48" text-anchor="middle" class="s">ID</text>
    <text x="15" y="73" text-anchor="middle" class="s">0</text><rect x="55" y="50" width="300" height="30" class="row"/><text x="205" y="70" text-anchor="middle" class="s">e₀ = [0.12, -0.31, ..., 0.08]</text>
    <text x="15" y="108" text-anchor="middle" class="s">1</text><rect x="55" y="85" width="300" height="30" class="row"/><text x="205" y="105" text-anchor="middle" class="s">e₁ = [-0.04, 0.22, ..., 0.17]</text>
    <text x="15" y="143" text-anchor="middle" class="s">⋮</text><text x="205" y="143" text-anchor="middle" class="s">⋮</text>
    <text x="15" y="178" text-anchor="middle" class="t">9</text><rect x="55" y="155" width="300" height="35" class="hit"/><text x="205" y="178" text-anchor="middle" class="t">e₉：Token “AI” 的向量</text>
    <text x="15" y="218" text-anchor="middle" class="t">42</text><rect x="55" y="195" width="300" height="35" class="hit"/><text x="205" y="218" text-anchor="middle" class="t">e₄₂：Token “我” 的向量</text>
    <text x="15" y="258" text-anchor="middle" class="t">815</text><rect x="55" y="235" width="300" height="35" class="hit"/><text x="205" y="258" text-anchor="middle" class="t">e₈₁₅：Token “喜欢” 的向量</text>
    <text x="15" y="295" text-anchor="middle" class="s">V-1</text><rect x="55" y="275" width="300" height="20" class="row"/>
  </g>
  <path d="M685 143H735" class="arrow"/>
  <g transform="translate(750 95)"><text x="145" y="0" text-anchor="middle" class="n">Token Embedding [S, H]</text><rect x="10" y="25" width="270" height="46" rx="6" class="out"/><text x="145" y="53" text-anchor="middle" class="t">e₄₂ = [··· H 个浮点数 ···]</text><rect x="10" y="77" width="270" height="46" rx="6" class="out"/><text x="145" y="105" text-anchor="middle" class="t">e₈₁₅ = [··· H 个浮点数 ···]</text><rect x="10" y="129" width="270" height="46" rx="6" class="out"/><text x="145" y="157" text-anchor="middle" class="t">e₉ = [··· H 个浮点数 ···]</text></g>
  <path d="M895 280V345" class="arrow"/>
  <g transform="translate(670 350)"><rect width="220" height="105" rx="9" class="out"/><text x="110" y="28" text-anchor="middle" class="n">Token 向量</text><text x="110" y="56" text-anchor="middle" class="t">“是什么”</text><text x="110" y="82" text-anchor="middle" class="s">由 Token ID 查表得到</text><text x="245" y="60" class="h">+</text><rect x="285" width="220" height="105" rx="9" class="pos"/><text x="395" y="28" text-anchor="middle" class="n">位置向量</text><text x="395" y="56" text-anchor="middle" class="t">“在哪里”</text><text x="395" y="82" text-anchor="middle" class="s">由 position 0,1,2 得到</text><path d="M110 105V145H395V105" fill="none" class="arrow"/><rect x="145" y="145" width="320" height="62" rx="9" class="table"/><text x="305" y="172" text-anchor="middle" class="n">输入 Transformer [S, H]</text><text x="305" y="193" text-anchor="middle" class="s">每个位置都有一个 H 维向量</text></g>
  <text x="550" y="548" text-anchor="middle" class="s">E 是可训练参数；ID 本身没有连续数值含义，ID 815 并不比 ID 42“更大”或“更相似”</text>
</svg>
