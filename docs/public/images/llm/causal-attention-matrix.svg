<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">因果遮罩如何改变注意力分数</title><desc id="desc">四个Token的注意力分数矩阵中，上三角未来位置被替换为负无穷，Softmax后这些位置权重变成零，每一行只在可见的左侧位置间归一化。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:23px;font-weight:600}.n{font-size:17px;font-weight:600}.t{font-size:13px}.s{font-size:12px;fill:#607d8b}.cell{fill:#e3f2fd;stroke:#78909c;stroke-width:1}.masked{fill:#ffcdd2;stroke:#d05252;stroke-width:1}.weight{fill:#c8e6c9;stroke:#43a047;stroke-width:1}.zero{fill:#eceff1;stroke:#aab7c1;stroke-width:1}.arrow{stroke:#607d8b;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs>
  <text x="550" y="34" text-anchor="middle" class="h">Causal Mask：在 Softmax 之前把未来位置设为 −∞</text>
  <text x="215" y="82" text-anchor="middle" class="n">原始分数 QKᵀ / √D</text><text x="548" y="82" text-anchor="middle" class="n">加入 Causal Mask</text><text x="887" y="82" text-anchor="middle" class="n">逐行 Softmax</text>
  <g transform="translate(75 120)"><text x="-8" y="28" text-anchor="end" class="s">[BOS]</text><text x="-8" y="78" text-anchor="end" class="s">我</text><text x="-8" y="128" text-anchor="end" class="s">喜欢</text><text x="-8" y="178" text-anchor="end" class="s">AI</text><g class="t" text-anchor="middle"><rect width="65" height="50" class="cell"/><text x="32" y="30">1.2</text><rect x="65" width="65" height="50" class="cell"/><text x="97" y="30">0.8</text><rect x="130" width="65" height="50" class="cell"/><text x="162" y="30">2.1</text><rect x="195" width="65" height="50" class="cell"/><text x="227" y="30">0.4</text><rect y="50" width="65" height="50" class="cell"/><text x="32" y="80">0.7</text><rect x="65" y="50" width="65" height="50" class="cell"/><text x="97" y="80">1.5</text><rect x="130" y="50" width="65" height="50" class="cell"/><text x="162" y="80">0.2</text><rect x="195" y="50" width="65" height="50" class="cell"/><text x="227" y="80">0.9</text><rect y="100" width="65" height="50" class="cell"/><text x="32" y="130">0.3</text><rect x="65" y="100" width="65" height="50" class="cell"/><text x="97" y="130">1.8</text><rect x="130" y="100" width="65" height="50" class="cell"/><text x="162" y="130">1.1</text><rect x="195" y="100" width="65" height="50" class="cell"/><text x="227" y="130">1.4</text><rect y="150" width="65" height="50" class="cell"/><text x="32" y="180">0.5</text><rect x="65" y="150" width="65" height="50" class="cell"/><text x="97" y="180">2.0</text><rect x="130" y="150" width="65" height="50" class="cell"/><text x="162" y="180">0.9</text><rect x="195" y="150" width="65" height="50" class="cell"/><text x="227" y="180">1.3</text></g></g>
  <path d="M350 220H405" class="arrow"/>
  <g transform="translate(420 120)" class="t" text-anchor="middle"><rect width="65" height="50" class="cell"/><text x="32" y="30">1.2</text><rect x="65" width="65" height="50" class="masked"/><text x="97" y="30">−∞</text><rect x="130" width="65" height="50" class="masked"/><text x="162" y="30">−∞</text><rect x="195" width="65" height="50" class="masked"/><text x="227" y="30">−∞</text><rect y="50" width="65" height="50" class="cell"/><text x="32" y="80">0.7</text><rect x="65" y="50" width="65" height="50" class="cell"/><text x="97" y="80">1.5</text><rect x="130" y="50" width="65" height="50" class="masked"/><text x="162" y="80">−∞</text><rect x="195" y="50" width="65" height="50" class="masked"/><text x="227" y="80">−∞</text><rect y="100" width="65" height="50" class="cell"/><text x="32" y="130">0.3</text><rect x="65" y="100" width="65" height="50" class="cell"/><text x="97" y="130">1.8</text><rect x="130" y="100" width="65" height="50" class="cell"/><text x="162" y="130">1.1</text><rect x="195" y="100" width="65" height="50" class="masked"/><text x="227" y="130">−∞</text><rect y="150" width="65" height="50" class="cell"/><text x="32" y="180">0.5</text><rect x="65" y="150" width="65" height="50" class="cell"/><text x="97" y="180">2.0</text><rect x="130" y="150" width="65" height="50" class="cell"/><text x="162" y="180">0.9</text><rect x="195" y="150" width="65" height="50" class="cell"/><text x="227" y="180">1.3</text></g>
  <path d="M680 220H735" class="arrow"/>
  <g transform="translate(750 120)" class="t" text-anchor="middle"><rect width="65" height="50" class="weight"/><text x="32" y="30">1.00</text><rect x="65" width="65" height="50" class="zero"/><text x="97" y="30">0</text><rect x="130" width="65" height="50" class="zero"/><text x="162" y="30">0</text><rect x="195" width="65" height="50" class="zero"/><text x="227" y="30">0</text><rect y="50" width="65" height="50" class="weight"/><text x="32" y="80">0.31</text><rect x="65" y="50" width="65" height="50" class="weight"/><text x="97" y="80">0.69</text><rect x="130" y="50" width="65" height="50" class="zero"/><text x="162" y="80">0</text><rect x="195" y="50" width="65" height="50" class="zero"/><text x="227" y="80">0</text><rect y="100" width="65" height="50" class="weight"/><text x="32" y="130">0.13</text><rect x="65" y="100" width="65" height="50" class="weight"/><text x="97" y="130">0.59</text><rect x="130" y="100" width="65" height="50" class="weight"/><text x="162" y="130">0.29</text><rect x="195" y="100" width="65" height="50" class="zero"/><text x="227" y="130">0</text><rect y="150" width="65" height="50" class="weight"/><text x="32" y="180">0.10</text><rect x="65" y="150" width="65" height="50" class="weight"/><text x="97" y="180">0.44</text><rect x="130" y="150" width="65" height="50" class="weight"/><text x="162" y="180">0.15</text><rect x="195" y="150" width="65" height="50" class="weight"/><text x="227" y="180">0.30</text></g>
  <g transform="translate(150 380)"><rect width="800" height="115" rx="11" fill="#f7f9fb" stroke="#78909c"/><text x="400" y="29" text-anchor="middle" class="n">读矩阵的方法</text><text x="30" y="59" class="t">行 = 当前正在更新的 Query 位置</text><text x="30" y="86" class="t">列 = 它准备读取的 Key / Value 位置</text><text x="430" y="59" class="t">上三角 = 未来位置，训练时已经存在但不能偷看</text><text x="430" y="86" class="t">每行权重和为 1；不同的行可见范围不同</text></g><text x="550" y="540" text-anchor="middle" class="s">实际实现常用一个大负数近似 −∞；完全被遮罩的行需要特别处理以避免数值问题</text>
</svg>
