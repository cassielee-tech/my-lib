<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="760" viewBox="0 0 1050 760" role="img" aria-labelledby="title desc">
  <title id="title">Pre-Norm Decoder Block 的完整数据流</title><desc id="desc">输入沿残差主路前进，分支先经过RMSNorm和Causal Self-Attention后加回主路，再经过第二个RMSNorm与SwiGLU MLP后再次加回，所有主要张量shape保持不变。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:23px;font-weight:600}.n{font-size:17px;font-weight:600}.t{font-size:14px}.s{font-size:12px;fill:#607d8b}.x{fill:#e3f2fd;stroke:#4285b4;stroke-width:1.7}.norm{fill:#f3e5f5;stroke:#8e5aa7;stroke-width:1.6}.attn{fill:#fff3e0;stroke:#ef8c28;stroke-width:1.6}.mlp{fill:#e8f5e9;stroke:#43a047;stroke-width:1.6}.add{fill:#ffebee;stroke:#d05252;stroke-width:1.7}.arrow{stroke:#607d8b;stroke-width:2.2;fill:none;marker-end:url(#a)}.res{stroke:#4285b4;stroke-width:3;fill:none;marker-end:url(#b)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4285b4"/></marker></defs>
  <text x="525" y="34" text-anchor="middle" class="h">Pre-Norm Decoder Block：两条变换分支，配两次残差相加</text>
  <rect x="390" y="65" width="270" height="65" rx="10" class="x"/><text x="525" y="91" text-anchor="middle" class="n">输入 x</text><text x="525" y="115" text-anchor="middle" class="t">[B, S, H]</text>
  <path d="M525 130V170" class="arrow"/><rect x="390" y="172" width="270" height="65" rx="10" class="norm"/><text x="525" y="199" text-anchor="middle" class="n">RMSNorm 1</text><text x="525" y="222" text-anchor="middle" class="t">稳定尺度，shape 不变</text>
  <path d="M525 237V277" class="arrow"/><rect x="350" y="279" width="350" height="82" rx="10" class="attn"/><text x="525" y="307" text-anchor="middle" class="n">Causal Self-Attention</text><text x="525" y="331" text-anchor="middle" class="t">让每个位置读取左侧上下文</text><text x="525" y="351" text-anchor="middle" class="s">QKV → Masked Attention → Output Projection</text>
  <path d="M525 361V404" class="arrow"/><circle cx="525" cy="430" r="27" class="add"/><text x="525" y="437" text-anchor="middle" class="h">+</text>
  <path d="M390 97H245V430H498" class="res"/><text x="230" y="270" text-anchor="end" class="n">残差主路</text><text x="230" y="293" text-anchor="end" class="s">原始 x 直接绕过 Attention</text>
  <path d="M525 457V497" class="arrow"/><rect x="390" y="499" width="270" height="65" rx="10" class="norm"/><text x="525" y="526" text-anchor="middle" class="n">RMSNorm 2</text><text x="525" y="549" text-anchor="middle" class="t">再次规范输入尺度</text>
  <path d="M525 564V604" class="arrow"/><rect x="350" y="606" width="350" height="82" rx="10" class="mlp"/><text x="525" y="634" text-anchor="middle" class="n">SwiGLU MLP</text><text x="525" y="658" text-anchor="middle" class="t">逐 Token 扩维、门控、降维</text><text x="525" y="678" text-anchor="middle" class="s">不混合不同 Token 位置</text>
  <path d="M700 647H810V430H552" class="res" opacity="0"/>
  <path d="M525 688V716" class="arrow"/><circle cx="525" cy="728" r="27" class="add"/><text x="525" y="735" text-anchor="middle" class="h">+</text>
  <path d="M552 430H815V728H552" class="res"/><text x="835" y="563" class="n">第二条残差主路</text><text x="835" y="586" class="s">Attention 后的状态绕过 MLP</text>
  <text x="195" y="700" text-anchor="middle" class="n">Block 输出仍为 [B,S,H]</text><text x="195" y="724" text-anchor="middle" class="s">因此可以连续堆叠很多层</text>
</svg>
