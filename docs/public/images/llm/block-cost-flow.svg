<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="590" viewBox="0 0 1050 590" role="img" aria-labelledby="title desc">
  <title id="title">Decoder Block 参数与计算成本来自哪些矩阵乘法</title><desc id="desc">Attention包含QKVO四个H乘H矩阵，SwiGLU包含两个H乘I扩维矩阵和一个I乘H降维矩阵；以H4096和I11008为例，MLP参数约为Attention两倍。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#263238}.h{font-size:23px;font-weight:600}.n{font-size:17px;font-weight:600}.t{font-size:14px}.s{font-size:12px;fill:#607d8b}.attn{fill:#fff3e0;stroke:#ef8c28;stroke-width:1.6}.mlp{fill:#e8f5e9;stroke:#43a047;stroke-width:1.6}.norm{fill:#f3e5f5;stroke:#8e5aa7;stroke-width:1.6}.bar1{fill:#efb060}.bar2{fill:#72b87a}.arrow{stroke:#607d8b;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs>
  <text x="525" y="34" text-anchor="middle" class="h">一层参数主要在 Linear 权重中：Attention 四块，SwiGLU 三块</text>
  <g transform="translate(45 75)"><rect width="460" height="245" rx="12" class="attn"/><text x="230" y="31" text-anchor="middle" class="n">Attention 参数（标准 MHA）</text><rect x="30" y="60" width="85" height="85" rx="7" fill="#ffe0b2" stroke="#ef8c28"/><text x="72" y="95" text-anchor="middle" class="t">WQ</text><text x="72" y="119" text-anchor="middle" class="s">H×H</text><rect x="135" y="60" width="85" height="85" rx="7" fill="#ffe0b2" stroke="#ef8c28"/><text x="177" y="95" text-anchor="middle" class="t">WK</text><text x="177" y="119" text-anchor="middle" class="s">H×H</text><rect x="240" y="60" width="85" height="85" rx="7" fill="#ffe0b2" stroke="#ef8c28"/><text x="282" y="95" text-anchor="middle" class="t">WV</text><text x="282" y="119" text-anchor="middle" class="s">H×H</text><rect x="345" y="60" width="85" height="85" rx="7" fill="#ffe0b2" stroke="#ef8c28"/><text x="387" y="95" text-anchor="middle" class="t">WO</text><text x="387" y="119" text-anchor="middle" class="s">H×H</text><text x="230" y="180" text-anchor="middle" class="n">合计 ≈ 4H²</text><text x="230" y="207" text-anchor="middle" class="t">H=4096 → 67,108,864 参数</text><text x="230" y="230" text-anchor="middle" class="s">GQA/MQA 的 K/V 参数会更少</text></g>
  <g transform="translate(545 75)"><rect width="460" height="245" rx="12" class="mlp"/><text x="230" y="31" text-anchor="middle" class="n">SwiGLU MLP 参数</text><rect x="40" y="60" width="105" height="85" rx="7" fill="#c8e6c9" stroke="#43a047"/><text x="92" y="95" text-anchor="middle" class="t">W_gate</text><text x="92" y="119" text-anchor="middle" class="s">H×I</text><rect x="177" y="60" width="105" height="85" rx="7" fill="#c8e6c9" stroke="#43a047"/><text x="229" y="95" text-anchor="middle" class="t">W_up</text><text x="229" y="119" text-anchor="middle" class="s">H×I</text><rect x="314" y="60" width="105" height="85" rx="7" fill="#c8e6c9" stroke="#43a047"/><text x="366" y="95" text-anchor="middle" class="t">W_down</text><text x="366" y="119" text-anchor="middle" class="s">I×H</text><text x="230" y="180" text-anchor="middle" class="n">合计 ≈ 3HI</text><text x="230" y="207" text-anchor="middle" class="t">H=4096, I=11008 → 135,266,304 参数</text><text x="230" y="230" text-anchor="middle" class="s">约为本例 Attention 参数的 2.02 倍</text></g>
  <g transform="translate(90 380)"><text x="0" y="0" class="n">本例单层参数构成（忽略 bias）</text><text x="0" y="40" class="t">Attention</text><rect x="100" y="20" width="245" height="30" class="bar1"/><text x="355" y="41" class="t">67.1M</text><text x="0" y="90" class="t">SwiGLU</text><rect x="100" y="70" width="495" height="30" class="bar2"/><text x="605" y="91" class="t">135.3M</text><text x="0" y="140" class="t">2×RMSNorm</text><rect x="100" y="120" width="3" height="30" fill="#8e5aa7"/><text x="115" y="141" class="t">8,192（图上几乎不可见）</text></g>
  <g transform="translate(735 375)"><rect width="265" height="150" rx="10" fill="#f7f9fb" stroke="#78909c"/><text x="132" y="29" text-anchor="middle" class="n">但参数量 ≠ 运行成本</text><text x="20" y="60" class="t">Attention 还有 S² 关系计算</text><text x="20" y="88" class="t">训练还要保存反向所需激活</text><text x="20" y="116" class="t">实际瓶颈受 B、S、H、I 和硬件影响</text><text x="20" y="140" class="s">必须结合 Profile 判断</text></g>
  <text x="525" y="570" text-anchor="middle" class="s">本图用于 Llama 风格 MHA + SwiGLU 的估算；不同模型可能采用 GQA、不同 intermediate size、bias 或其他 MLP 结构</text>
</svg>
