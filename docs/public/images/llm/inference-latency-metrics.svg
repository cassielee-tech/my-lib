<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><style>.t{font:700 23px sans-serif;fill:#172033}.s{font:17px sans-serif;fill:#475569}</style><rect width="1200" height="480" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">用户等待时间要拆开看，优化目标才不会混淆</text><path d="M90 250H1110" stroke="#64748b" stroke-width="4"/><g fill="#64748b"><circle cx="90" cy="250" r="9"/><circle cx="450" cy="250" r="9"/><circle cx="650" cy="250" r="9"/><circle cx="850" cy="250" r="9"/><circle cx="1050" cy="250" r="9"/></g><text x="90" y="290" text-anchor="middle" class="s">请求到达</text><text x="450" y="290" text-anchor="middle" class="s">Token 1</text><text x="650" y="290" text-anchor="middle" class="s">Token 2</text><text x="850" y="290" text-anchor="middle" class="s">Token 3</text><text x="1050" y="290" text-anchor="middle" class="s">完成</text><path d="M90 185V215H450V185" fill="none" stroke="#2563eb" stroke-width="4"/><text x="270" y="168" text-anchor="middle" class="t" fill="#2563eb">TTFT</text><text x="270" y="120" text-anchor="middle" class="s">排队 + Prefill + 首次采样</text><path d="M450 330V360H650V330M650 330V360H850V330" fill="none" stroke="#16a34a" stroke-width="4"/><text x="650" y="400" text-anchor="middle" class="t" fill="#16a34a">TPOT / ITL</text><text x="650" y="430" text-anchor="middle" class="s">相邻输出 Token 的 Decode 间隔</text><path d="M90 75V95H1050V75" fill="none" stroke="#f97316" stroke-width="4"/><text x="570" y="72" text-anchor="middle" class="t" fill="#f97316">端到端延迟：从请求到完整回答结束</text></svg>
