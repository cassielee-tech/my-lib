<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 23px sans-serif;fill:#172033}.s{font:17px sans-serif;fill:#475569}.m{font:18px monospace;fill:#1e293b}</style></defs><rect width="1200" height="590" rx="24" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="t">LoRA 不缩小 Base Model，而是限制可训练的权重增量</text><rect x="45" y="90" width="500" height="410" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="295" y="130" text-anchor="middle" class="t">Full Fine-Tuning</text><rect x="145" y="175" width="300" height="230" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="295" y="280" text-anchor="middle" class="t">W ∈ Rᵈˣᵏ</text><text x="295" y="318" text-anchor="middle" class="s">整个矩阵参与训练</text><text x="295" y="446" text-anchor="middle" class="m">trainable = d × k</text>
<rect x="655" y="90" width="500" height="410" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="905" y="130" text-anchor="middle" class="t">LoRA</text><rect x="700" y="175" width="210" height="230" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><text x="805" y="270" text-anchor="middle" class="t">W₀</text><text x="805" y="305" text-anchor="middle" class="s">冻结，不更新</text><text x="945" y="290" class="t">+</text><rect x="995" y="175" width="45" height="230" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1017" y="425" text-anchor="middle" class="s">B</text><rect x="1050" y="260" width="65" height="45" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1082" y="250" text-anchor="middle" class="s">A</text><path d="M1040 290H1045" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/><text x="905" y="462" text-anchor="middle" class="m">trainable = r(d + k)</text><text x="600" y="548" text-anchor="middle" class="m">W′ = W₀ + (α/r)BA，且 r ≪ min(d,k)</text></svg>
