<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650" role="img" aria-labelledby="title desc">
  <title id="title">HCCL AllReduce 源码调用链</title>
  <desc id="desc">从框架调用经过公开 API、算子入口、Selector、Executor 和 Template，最终通过动态符号边界调用 HCOMM；旁侧展示两个注册表和资源回退路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/></marker>
    <style>
      .title{font:700 27px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#172033}.h{font:700 18px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#24364b}.s{font:14px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#526174}.tag{font:700 13px system-ui,-apple-system,"PingFang SC",sans-serif}.box{stroke-width:2}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.lookup{stroke:#7c3aed;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#purpleArrow)}
    </style>
  </defs>
  <rect width="1320" height="650" rx="26" fill="#f8fafc"/>
  <text x="660" y="43" text-anchor="middle" class="title">一次 AllReduce 怎样从 API 走到设备通信</text>

  <rect x="55" y="105" width="165" height="90" rx="17" fill="#eef2ff" stroke="#6366f1" class="box"/>
  <text x="138" y="140" text-anchor="middle" class="h">AI 框架</text>
  <text x="138" y="166" text-anchor="middle" class="s">分布式训练调用</text>

  <rect x="260" y="105" width="165" height="90" rx="17" fill="#eef2ff" stroke="#6366f1" class="box"/>
  <text x="343" y="137" text-anchor="middle" class="h">公开 API</text>
  <text x="343" y="164" text-anchor="middle" class="s">HcclAllReduce</text>

  <rect x="465" y="105" width="180" height="90" rx="17" fill="#e8f5ff" stroke="#0284c7" class="box"/>
  <text x="555" y="137" text-anchor="middle" class="h">算子入口</text>
  <text x="555" y="164" text-anchor="middle" class="s">校验 + OpParam</text>

  <rect x="685" y="105" width="165" height="90" rx="17" fill="#e8fbfb" stroke="#0891b2" class="box"/>
  <text x="768" y="137" text-anchor="middle" class="h">Selector</text>
  <text x="768" y="164" text-anchor="middle" class="s">输出 algName</text>

  <rect x="890" y="105" width="165" height="90" rx="17" fill="#fff6e7" stroke="#e87924" class="box"/>
  <text x="973" y="137" text-anchor="middle" class="h">Executor</text>
  <text x="973" y="164" text-anchor="middle" class="s">CalcRes + Orchestrate</text>

  <rect x="1095" y="105" width="170" height="90" rx="17" fill="#eafaf0" stroke="#22a06b" class="box"/>
  <text x="1180" y="137" text-anchor="middle" class="h">Template</text>
  <text x="1180" y="164" text-anchor="middle" class="s">搬运 · 归约 · 同步</text>

  <path d="M220 150H255M425 150H460M645 150H680M850 150H885M1055 150H1090" class="flow"/>

  <rect x="1045" y="275" width="270" height="95" rx="18" fill="#f1f5f9" stroke="#64748b" class="box"/>
  <text x="1180" y="310" text-anchor="middle" class="h">HCOMM 动态符号边界</text>
  <text x="1180" y="337" text-anchor="middle" class="s">src/common/hcomm_dlsym</text>
  <path d="M1180 195V270" class="flow"/>

  <rect x="1045" y="430" width="270" height="105" rx="18" fill="#e2e8f0" stroke="#475569" class="box"/>
  <text x="1180" y="466" text-anchor="middle" class="h">通信资源与设备执行</text>
  <text x="1180" y="493" text-anchor="middle" class="s">Buffer · Channel · Notify · Link</text>
  <text x="1180" y="517" text-anchor="middle" class="s">本地归约与物理传输</text>
  <path d="M1180 370V425" class="flow"/>

  <rect x="600" y="285" width="335" height="88" rx="18" fill="#f3e8ff" stroke="#7c3aed" class="box"/>
  <text x="768" y="317" text-anchor="middle" class="h">SelectorRegistry</text>
  <text x="768" y="344" text-anchor="middle" class="s">opType → Selector（含优先级）</text>
  <path d="M768 280V200" class="lookup"/>

  <rect x="600" y="430" width="335" height="88" rx="18" fill="#f3e8ff" stroke="#7c3aed" class="box"/>
  <text x="768" y="462" text-anchor="middle" class="h">ExecutorRegistry</text>
  <text x="768" y="489" text-anchor="middle" class="s">(opType, algName) → Executor</text>
  <path d="M935 454C1000 420 1005 285 974 200" class="lookup"/>

  <rect x="65" y="285" width="430" height="233" rx="20" fill="#fff" stroke="#cbd5e1" class="box"/>
  <text x="280" y="322" text-anchor="middle" class="h">OpParam：贯穿调用链的任务单</text>
  <text x="100" y="362" class="s">• 操作：AllReduce</text>
  <text x="100" y="391" class="s">• 数据：Buffer / count / dataType</text>
  <text x="100" y="420" class="s">• 语义：reduceOp / inplace / order</text>
  <text x="100" y="449" class="s">• 上下文：comm / rank / stream / topology</text>
  <text x="100" y="478" class="s">• 选择结果：engine / algName / algTag</text>
  <path d="M495 400C555 380 575 230 555 200" class="flow"/>

  <path d="M972 200C972 575 715 585 685 505" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/>
  <text x="870" y="575" class="tag" fill="#b91c1c">资源不可用或执行失败：进入回退路径并缓存结果</text>

  <rect x="300" y="590" width="720" height="36" rx="18" fill="#eafaf0"/>
  <text x="660" y="614" text-anchor="middle" class="tag" fill="#166534">读源码时始终追踪三件事：算法选择、资源准备、数据与同步关系</text>
</svg>
