<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title2 desc2">
  <title id="title2">RA socket 建链模型：白名单与 hccpTag 镜像匹配</title>
  <desc id="desc2">Server 端 socketHandle 监听并登记白名单条目，Client 端携带 hccpTag 发起连接，RA 层按来源 IP 与 tag 匹配建立连接；底部展示 hccpTag 的镜像生成规则与混版本兼容性含义。</desc>
  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <marker id="blueArrow2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0284c7"/></marker>
    <style>
      .title{font:700 27px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#172033}
      .h{font:700 17px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#24364b}
      .s{font:13.5px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#526174}
      .mono{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#334155}
      .tag{font:700 12.5px system-ui,-apple-system,"PingFang SC",sans-serif}
      .box{stroke-width:2}
      .flow{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow2)}
      .bflow{stroke:#0284c7;stroke-width:2.4;fill:none;marker-end:url(#blueArrow2)}
    </style>
  </defs>
  <rect width="1320" height="760" rx="26" fill="#f8fafc"/>
  <text x="660" y="45" text-anchor="middle" class="title">RA socket 建链模型：白名单 + hccpTag 匹配</text>

  <!-- Server 端 -->
  <rect x="70" y="90" width="380" height="42" rx="21" fill="#eef2ff" stroke="#6366f1" class="box"/>
  <text x="260" y="117" text-anchor="middle" class="tag" fill="#4f46e5">Server 端（推导或显式 SERVER）</text>

  <rect x="95" y="158" width="330" height="76" rx="14" fill="#eef2ff" stroke="#6366f1" class="box"/>
  <text x="260" y="186" text-anchor="middle" class="h">socketHandle</text>
  <text x="260" y="210" text-anchor="middle" class="s">HrtRaSocketInit · 设备网卡上下文</text>
  <text x="260" y="227" text-anchor="middle" class="s">SocketHandleManager 按 (devPhyId,协议,IP) 去重</text>

  <rect x="95" y="260" width="330" height="62" rx="14" fill="#eef2ff" stroke="#6366f1" class="box"/>
  <text x="260" y="286" text-anchor="middle" class="h">serverSocket_ → Listen(port)</text>
  <text x="260" y="308" text-anchor="middle" class="s">在设备网络（HDC 模式）上启动监听</text>

  <rect x="95" y="348" width="330" height="76" rx="14" fill="#fff6e7" stroke="#e87924" class="box"/>
  <text x="260" y="374" text-anchor="middle" class="h">白名单登记</text>
  <text x="260" y="396" text-anchor="middle" class="mono">AddWhiteList(remoteIp, hccpTag, connLimit=1)</text>
  <text x="260" y="414" text-anchor="middle" class="s">RA 层不接受任意连接，只收白名单内的</text>

  <rect x="95" y="454" width="330" height="62" rx="14" fill="#eef2ff" stroke="#6366f1" class="box"/>
  <text x="260" y="480" text-anchor="middle" class="h">GetOneSocket(SERVER)</text>
  <text x="260" y="502" text-anchor="middle" class="s">等待一条 tag 匹配的连接（accept 语义）</text>

  <line x1="260" y1="234" x2="260" y2="256" class="flow"/>
  <line x1="260" y1="322" x2="260" y2="344" class="flow"/>
  <line x1="260" y1="424" x2="260" y2="450" class="flow"/>

  <!-- RA 层 -->
  <rect x="500" y="158" width="320" height="358" rx="18" fill="#e8f5ff" stroke="#0284c7" stroke-width="2.5" class="box"/>
  <text x="660" y="192" text-anchor="middle" class="h" fill="#0369a1">RA 层（hccp · HDC 设备网络）</text>

  <rect x="525" y="215" width="270" height="110" rx="12" fill="#ffffff" stroke="#0284c7" class="box"/>
  <text x="660" y="243" text-anchor="middle" class="h">匹配规则</text>
  <text x="660" y="267" text-anchor="middle" class="mono">来源 IP ∈ 白名单</text>
  <text x="660" y="287" text-anchor="middle" class="mono">且 tag 逐字符相等</text>
  <text x="660" y="310" text-anchor="middle" class="s">→ 建立一条 fd 连接</text>

  <rect x="525" y="345" width="270" height="70" rx="12" fill="#ffffff" stroke="#0284c7" class="box"/>
  <text x="660" y="372" text-anchor="middle" class="h">端口</text>
  <text x="660" y="396" text-anchor="middle" class="s">Client 连接的目标 = Server 监听的 port</text>
  <text x="660" y="413" text-anchor="middle" class="s">双方通过 channelDesc_.port 约定</text>

  <text x="660" y="460" text-anchor="middle" class="s">监听在设备网卡 RA 层完成</text>
  <text x="660" y="480" text-anchor="middle" class="s">主机侧 netstat / ss 看不到 → 只能靠 plog 判定</text>

  <line x1="425" y1="485" x2="523" y2="400" class="flow"/>
  <text x="452" y="470" class="tag" fill="#4f46e5">等待匹配</text>

  <!-- Client 端 -->
  <rect x="870" y="90" width="380" height="42" rx="21" fill="#e8fbfb" stroke="#0891b2" class="box"/>
  <text x="1060" y="117" text-anchor="middle" class="tag" fill="#0e7490">Client 端（推导或显式 CLIENT）</text>

  <rect x="895" y="158" width="330" height="62" rx="14" fill="#e8fbfb" stroke="#0891b2" class="box"/>
  <text x="1060" y="184" text-anchor="middle" class="h">socketHandle</text>
  <text x="1060" y="206" text-anchor="middle" class="s">同一套 SocketHandleManager 去重缓存</text>

  <rect x="895" y="260" width="330" height="76" rx="14" fill="#e8fbfb" stroke="#0891b2" class="box"/>
  <text x="1060" y="286" text-anchor="middle" class="h">working socket → ConnectAsync</text>
  <text x="1060" y="310" text-anchor="middle" class="mono">ConnectAsync(remoteIp, port, tag)</text>
  <text x="1060" y="328" text-anchor="middle" class="s">向对端监听端口发起连接，携带本端 tag</text>

  <rect x="895" y="366" width="330" height="62" rx="14" fill="#e8fbfb" stroke="#0891b2" class="box"/>
  <text x="1060" y="392" text-anchor="middle" class="h">GetAsyncStatus 轮询</text>
  <text x="1060" y="414" text-anchor="middle" class="s">CONNECTING → OK（拿到 fdHandle）</text>

  <line x1="1060" y1="220" x2="1060" y2="256" class="flow"/>
  <line x1="1060" y1="336" x2="1060" y2="362" class="flow"/>
  <line x1="895" y1="300" x2="823" y2="280" class="bflow"/>
  <text x="826" y="266" class="tag" fill="#0369a1">发起连接</text>

  <!-- hccpTag 镜像 -->
  <rect x="70" y="548" width="1180" height="182" rx="16" fill="#fdf4ff" stroke="#a21caf" class="box"/>
  <text x="100" y="580" class="tag" fill="#86198f">hccpTag 的镜像生成（wire 契约）</text>

  <rect x="100" y="600" width="540" height="66" rx="12" fill="#ffffff" stroke="#a21caf" class="box"/>
  <text x="128" y="627" class="s">Server 侧生成（本端视角）</text>
  <text x="128" y="650" class="mono">tag_本端IP_对端IP_端口</text>

  <rect x="680" y="600" width="540" height="66" rx="12" fill="#ffffff" stroke="#a21caf" class="box"/>
  <text x="708" y="627" class="s">Client 侧生成（本端视角，IP 顺序互换）</text>
  <text x="708" y="650" class="mono">tag_对端IP_本端IP_端口 = 同一串字符</text>

  <line x1="644" y1="633" x2="676" y2="633" class="flow"/>
  <text x="100" y="700" class="s">示例：verify_ep0_10.0.0.1_10.0.0.2_61001（两侧逐字符相等，RA 层才能匹配成功）</text>
  <text x="100" y="720" class="s" fill="#b91c1c">⚠ 格式一旦变化（如增删端口后缀），新旧版本混跑集群的两侧 tag 不再相等 → 建链失败——改 hccpTag 格式必须声明混版本兼容策略。</text>
</svg>
