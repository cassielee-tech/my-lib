<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800" role="img" aria-labelledby="title3 desc3">
  <title id="title3">三种模式的建链行为（修复后）</title>
  <desc id="desc3">修复后三种使用模式的两端行为：RESERVED 自动模式 port 为 0 时仅推导 SERVER 端以默认端口 60001 监听且沿用旧 tag 格式；RESERVED 加端口模式端口生效；显式 role 模式角色覆盖地址推导。底部给出两端一致性约束。</desc>
  <defs>
    <marker id="arrow3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <marker id="blueArrow3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0284c7"/></marker>
    <style>
      .title{font:700 27px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#172033}
      .h{font:700 16.5px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#24364b}
      .s{font:13px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#526174}
      .mono{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#334155}
      .tag{font:700 12.5px system-ui,-apple-system,"PingFang SC",sans-serif}
      .box{stroke-width:2}
      .flow{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow3)}
      .bflow{stroke:#0284c7;stroke-width:2.2;fill:none;marker-end:url(#blueArrow3)}
    </style>
  </defs>
  <rect width="1320" height="800" rx="26" fill="#f8fafc"/>
  <text x="660" y="45" text-anchor="middle" class="title">三种模式的建链行为（修复后）</text>
  <text x="660" y="76" text-anchor="middle" class="s">角色推导单一来源：SocketConfig 构造内按地址比较（IP 相等时按 rank），消费方用 GetRole() 读取，永不复制推导逻辑</text>

  <!-- 列1：RESERVED + port=0 -->
  <rect x="60" y="100" width="380" height="46" rx="23" fill="#eef2ff" stroke="#6366f1" class="box"/>
  <text x="250" y="129" text-anchor="middle" class="tag" fill="#4f46e5">模式① RESERVED · port=0（存量默认）</text>

  <rect x="85" y="172" width="330" height="120" rx="14" fill="#eef2ff" stroke="#6366f1" class="box"/>
  <text x="250" y="200" text-anchor="middle" class="h">节点 A · 推导为 SERVER（地址较小）</text>
  <rect x="110" y="216" width="90" height="26" rx="13" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="155" y="234" text-anchor="middle" class="tag" fill="#15803d">监听</text>
  <text x="250" y="252" text-anchor="middle" class="mono">Listen(60001)</text>
  <text x="250" y="272" text-anchor="middle" class="s">旧构造 · tag 无端口后缀（wire 兼容）</text>

  <rect x="85" y="316" width="330" height="120" rx="14" fill="#e8fbfb" stroke="#0891b2" class="box"/>
  <text x="250" y="344" text-anchor="middle" class="h">节点 B · 推导为 CLIENT（地址较大）</text>
  <rect x="110" y="360" width="90" height="26" rx="13" fill="#e0f2fe" stroke="#0284c7" class="box"/>
  <text x="155" y="378" text-anchor="middle" class="tag" fill="#0369a1">连接</text>
  <text x="250" y="398" text-anchor="middle" class="mono">ConnectAsync(对端, 60001)</text>
  <text x="250" y="418" text-anchor="middle" class="s">不创建监听（与旧版唯一行为差异）</text>

  <line x1="250" y1="292" x2="250" y2="314" class="bflow"/>

  <rect x="85" y="460" width="330" height="66" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="7 6" class="box"/>
  <text x="250" y="486" text-anchor="middle" class="s" fill="#15803d">存量调用方零影响的根基：端口、角色推导、</text>
  <text x="250" y="506" text-anchor="middle" class="s" fill="#15803d">tag 格式均与旧版本完全一致</text>

  <!-- 列2：RESERVED + port -->
  <rect x="470" y="100" width="380" height="46" rx="23" fill="#fff6e7" stroke="#e87924" class="box"/>
  <text x="660" y="129" text-anchor="middle" class="tag" fill="#b45309">模式② RESERVED · port=N（仅传端口）</text>

  <rect x="495" y="172" width="330" height="120" rx="14" fill="#fff6e7" stroke="#e87924" class="box"/>
  <text x="660" y="200" text-anchor="middle" class="h">节点 A · 推导为 SERVER</text>
  <rect x="520" y="216" width="90" height="26" rx="13" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="565" y="234" text-anchor="middle" class="tag" fill="#15803d">监听</text>
  <text x="660" y="252" text-anchor="middle" class="mono">Listen(N)</text>
  <text x="660" y="272" text-anchor="middle" class="s">新构造 · tag 带端口后缀</text>

  <rect x="495" y="316" width="330" height="120" rx="14" fill="#e8fbfb" stroke="#0891b2" class="box"/>
  <text x="660" y="344" text-anchor="middle" class="h">节点 B · 推导为 CLIENT</text>
  <rect x="520" y="360" width="90" height="26" rx="13" fill="#e0f2fe" stroke="#0284c7" class="box"/>
  <text x="565" y="378" text-anchor="middle" class="tag" fill="#0369a1">连接</text>
  <text x="660" y="398" text-anchor="middle" class="mono">ConnectAsync(对端, N)</text>
  <text x="660" y="418" text-anchor="middle" class="s">角色仍自动推导 · 两端须传相同 N</text>

  <line x1="660" y1="292" x2="660" y2="314" class="bflow"/>

  <rect x="495" y="460" width="330" height="66" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="7 6" class="box"/>
  <text x="660" y="486" text-anchor="middle" class="s" fill="#15803d">检视意见补充场景：想要自动角色、</text>
  <text x="660" y="506" text-anchor="middle" class="s" fill="#15803d">又想按 endpoint 分配端口的调用方</text>

  <!-- 列3：显式 role -->
  <rect x="880" y="100" width="380" height="46" rx="23" fill="#fef2f2" stroke="#dc2626" class="box"/>
  <text x="1070" y="129" text-anchor="middle" class="tag" fill="#b91c1c">模式③ 显式 role=SERVER/CLIENT · port=N</text>

  <rect x="905" y="172" width="330" height="120" rx="14" fill="#fef2f2" stroke="#dc2626" class="box"/>
  <text x="1070" y="200" text-anchor="middle" class="h">节点 A · role=SERVER（显式指定）</text>
  <rect x="930" y="216" width="90" height="26" rx="13" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="975" y="234" text-anchor="middle" class="tag" fill="#15803d">监听</text>
  <text x="1070" y="252" text-anchor="middle" class="mono">Listen(N)</text>
  <text x="1070" y="272" text-anchor="middle" class="s">isServer 构造 · noRankId=false</text>

  <rect x="905" y="316" width="330" height="120" rx="14" fill="#e8fbfb" stroke="#0891b2" class="box"/>
  <text x="1070" y="344" text-anchor="middle" class="h">节点 B · role=CLIENT（显式指定）</text>
  <rect x="930" y="360" width="90" height="26" rx="13" fill="#e0f2fe" stroke="#0284c7" class="box"/>
  <text x="975" y="378" text-anchor="middle" class="tag" fill="#0369a1">连接</text>
  <text x="1070" y="398" text-anchor="middle" class="mono">ConnectAsync(对端, N)</text>
  <text x="1070" y="418" text-anchor="middle" class="s">角色覆盖地址推导 · 不监听</text>

  <line x1="1070" y1="292" x2="1070" y2="314" class="bflow"/>

  <rect x="905" y="460" width="330" height="66" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="7 6" class="box"/>
  <text x="1070" y="486" text-anchor="middle" class="s" fill="#15803d">issue #966 的修复主场景：多 endpoint</text>
  <text x="1070" y="506" text-anchor="middle" class="s" fill="#15803d">各配不同端口，不再抢绑 60001</text>

  <!-- 底部约束 -->
  <rect x="60" y="560" width="1200" height="120" rx="16" fill="#fffbeb" stroke="#d97706" class="box"/>
  <text x="90" y="592" class="tag" fill="#b45309">两端一致性约束（写进 PR 描述的使用契约）</text>
  <text x="90" y="620" class="s">· 同一链路两端必须使用相同模式：同为 RESERVED 自动，或同为显式 role；</text>
  <text x="90" y="644" class="s">· 显式模式两端 role 须相反（SERVER ↔ CLIENT），端口配置一致；</text>
  <text x="90" y="668" class="s" fill="#b91c1c">· 混用示例（一端显式 SERVER、一端 RESERVED 不传 port）：CLIENT 端连 60001 而 SERVER 端监听 61001，建链超时——是预期约束行为，不是缺陷。</text>

  <text x="660" y="730" text-anchor="middle" class="s">isRecvFirst（建链后谁先收）由最终角色决定：CLIENT 先收——三种模式共用该规则</text>
</svg>
