<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">模型计算与分布式通信在 CANN 中的概念路径</title>
  <desc id="desc">模型经由 PyTorch 和 torch_npu 进入 CANN 执行栈，计算算子由 Ascend C 在 NPU AI Core 上执行，集合通信由 HCCL 在多个 NPU 之间完成。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 26px system-ui,-apple-system,sans-serif;fill:#172033}.label{font:700 18px system-ui,-apple-system,sans-serif;fill:#23324a}.small{font:15px system-ui,-apple-system,sans-serif;fill:#526174}.lane{font:700 16px system-ui,-apple-system,sans-serif}.box{stroke-width:2}.arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#f8fafc"/>
  <text x="600" y="45" text-anchor="middle" class="title">同一个模型，两条落到 NPU 的执行路径</text>

  <rect x="430" y="76" width="340" height="68" rx="16" fill="#eef2ff" stroke="#6366f1" class="box"/>
  <text x="600" y="105" text-anchor="middle" class="label">PyTorch 模型 / 分布式训练程序</text>
  <text x="600" y="129" text-anchor="middle" class="small">张量计算 + 并行策略</text>

  <path d="M600 144V180H310V207" class="arrow"/>
  <path d="M600 144V180H890V207" class="arrow"/>

  <text x="55" y="190" class="lane" fill="#2563eb">计算路径</text>
  <rect x="135" y="208" width="350" height="66" rx="15" fill="#eaf2ff" stroke="#3b82f6" class="box"/>
  <text x="310" y="236" text-anchor="middle" class="label">torch_npu / 框架适配</text>
  <text x="310" y="259" text-anchor="middle" class="small">把框架操作映射到昇腾执行能力</text>
  <path d="M310 274V307" class="arrow"/>
  <rect x="135" y="309" width="350" height="78" rx="15" fill="#eaf2ff" stroke="#3b82f6" class="box"/>
  <text x="310" y="339" text-anchor="middle" class="label">CANN 执行栈</text>
  <text x="310" y="364" text-anchor="middle" class="small">图与算子 · 编译 · Runtime · 任务下发</text>
  <path d="M310 387V420" class="arrow"/>
  <rect x="135" y="422" width="350" height="78" rx="15" fill="#e6f7f3" stroke="#0f9f82" class="box"/>
  <text x="310" y="452" text-anchor="middle" class="label">Ascend C Kernel</text>
  <text x="310" y="477" text-anchor="middle" class="small">Tiling · 搬运 · Vector/Cube 计算 · 流水线</text>

  <text x="718" y="190" class="lane" fill="#9333ea">通信路径</text>
  <rect x="715" y="208" width="350" height="66" rx="15" fill="#f4ecff" stroke="#9333ea" class="box"/>
  <text x="890" y="236" text-anchor="middle" class="label">torch.distributed / 集合通信调用</text>
  <text x="890" y="259" text-anchor="middle" class="small">AllReduce · AllGather · ReduceScatter · Alltoall</text>
  <path d="M890 274V307" class="arrow"/>
  <rect x="715" y="309" width="350" height="78" rx="15" fill="#f4ecff" stroke="#9333ea" class="box"/>
  <text x="890" y="339" text-anchor="middle" class="label">HCCL</text>
  <text x="890" y="364" text-anchor="middle" class="small">通信域 · 拓扑 · 算法 · Executor · Transport</text>
  <path d="M890 387V420" class="arrow"/>
  <rect x="715" y="422" width="350" height="78" rx="15" fill="#fff2e5" stroke="#e87924" class="box"/>
  <text x="890" y="452" text-anchor="middle" class="label">设备互联与网络</text>
  <text x="890" y="477" text-anchor="middle" class="small">多个 NPU 之间搬运和规约数据</text>

  <path d="M485 461H710" stroke="#a0aec0" stroke-width="2" stroke-dasharray="7 7" fill="none"/>
  <text x="600" y="448" text-anchor="middle" class="small">Stream / Event / 同步</text>

  <path d="M310 500V535H600" class="arrow"/>
  <path d="M890 500V535H600" class="arrow"/>
  <rect x="390" y="537" width="420" height="78" rx="17" fill="#eafaf0" stroke="#22a06b" class="box"/>
  <text x="600" y="568" text-anchor="middle" class="label">昇腾 NPU</text>
  <text x="600" y="594" text-anchor="middle" class="small">AI Core 完成计算，设备链路完成数据交换</text>
</svg>
