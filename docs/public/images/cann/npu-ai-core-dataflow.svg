<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Core 中 Vector 与 Cube 的典型数据流</title>
  <desc id="desc">数据从 Global Memory 经搬运单元进入片上 Local Memory，分别由 Vector 或 Cube 计算，再写回 Global Memory；Scalar 向搬运和计算单元发出控制指令。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <marker id="control-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/></marker>
    <style>
      .title{font:700 26px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#172033}.heading{font:700 19px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#26364d}.text{font:15px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#526174}.label{font:700 14px system-ui,-apple-system,"PingFang SC",sans-serif}.box{stroke-width:2}.flow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.control{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#control-arrow)}
    </style>
  </defs>
  <rect width="1280" height="720" rx="26" fill="#f8fafc"/>
  <text x="640" y="43" text-anchor="middle" class="title">AI Core 不只是“算”：搬入 → 计算 → 搬出</text>

  <rect x="45" y="82" width="1190" height="555" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="75" y="116" class="heading">AI Core 的硬件抽象</text>

  <!-- Scalar control -->
  <rect x="455" y="132" width="370" height="86" rx="17" fill="#f3e8ff" stroke="#7c3aed" class="box"/>
  <text x="640" y="166" text-anchor="middle" class="heading">Scalar：控制与指令发射</text>
  <text x="640" y="193" text-anchor="middle" class="text">地址计算 · Tile 循环 · 搬运/计算/同步指令</text>
  <path d="M550 218C460 250 350 250 270 293" class="control"/>
  <path d="M640 218V293" class="control"/>
  <path d="M730 218C820 250 930 250 1010 293" class="control"/>
  <text x="866" y="246" class="label" fill="#7c3aed">蓝紫虚线：指令与同步</text>

  <!-- Global memory left and right -->
  <rect x="76" y="300" width="175" height="230" rx="19" fill="#e9eef5" stroke="#64748b" class="box"/>
  <text x="164" y="345" text-anchor="middle" class="heading">Global Memory</text>
  <text x="164" y="374" text-anchor="middle" class="text">设备全局内存</text>
  <text x="164" y="404" text-anchor="middle" class="text">容量较大</text>
  <text x="164" y="430" text-anchor="middle" class="text">离计算单元较远</text>
  <text x="164" y="476" text-anchor="middle" class="label" fill="#475569">输入张量</text>

  <rect x="1029" y="300" width="175" height="230" rx="19" fill="#e9eef5" stroke="#64748b" class="box"/>
  <text x="1116" y="345" text-anchor="middle" class="heading">Global Memory</text>
  <text x="1116" y="374" text-anchor="middle" class="text">设备全局内存</text>
  <text x="1116" y="430" text-anchor="middle" class="label" fill="#475569">输出张量</text>

  <!-- central two lanes -->
  <rect x="302" y="282" width="676" height="132" rx="19" fill="#edf8ff" stroke="#0284c7" class="box"/>
  <text x="329" y="311" class="label" fill="#0369a1">VECTOR 路径</text>
  <rect x="335" y="329" width="120" height="56" rx="12" fill="#fff" stroke="#38bdf8" class="box"/>
  <text x="395" y="363" text-anchor="middle" class="heading">MTE2</text>
  <rect x="493" y="329" width="120" height="56" rx="12" fill="#fff" stroke="#38bdf8" class="box"/>
  <text x="553" y="363" text-anchor="middle" class="heading">UB</text>
  <rect x="651" y="329" width="134" height="56" rx="12" fill="#dff7ef" stroke="#0f9f82" class="box"/>
  <text x="718" y="363" text-anchor="middle" class="heading">Vector</text>
  <rect x="823" y="329" width="120" height="56" rx="12" fill="#fff" stroke="#38bdf8" class="box"/>
  <text x="883" y="363" text-anchor="middle" class="heading">MTE3</text>
  <path d="M251 357H330M455 357H488M613 357H646M785 357H818M943 357H1024" class="flow"/>

  <rect x="282" y="442" width="716" height="145" rx="19" fill="#fff6e7" stroke="#e87924" class="box"/>
  <text x="329" y="471" class="label" fill="#c45b12">CUBE 路径</text>
  <rect x="312" y="491" width="86" height="56" rx="12" fill="#fff" stroke="#f59e0b" class="box"/>
  <text x="355" y="525" text-anchor="middle" class="heading">L1</text>
  <rect x="430" y="491" width="128" height="56" rx="12" fill="#fff" stroke="#f59e0b" class="box"/>
  <text x="494" y="515" text-anchor="middle" class="heading">L0A / L0B</text>
  <text x="494" y="537" text-anchor="middle" class="text">左右输入</text>
  <rect x="590" y="491" width="104" height="56" rx="12" fill="#ffead5" stroke="#e87924" class="box"/>
  <text x="642" y="525" text-anchor="middle" class="heading">Cube</text>
  <rect x="726" y="491" width="105" height="56" rx="12" fill="#fff" stroke="#f59e0b" class="box"/>
  <text x="779" y="515" text-anchor="middle" class="heading">L0C</text>
  <text x="779" y="537" text-anchor="middle" class="text">累加结果</text>
  <rect x="863" y="491" width="104" height="56" rx="12" fill="#fff" stroke="#f59e0b" class="box"/>
  <text x="915" y="525" text-anchor="middle" class="heading">FixPipe</text>
  <path d="M251 519H307M398 519H425M558 519H585M694 519H721M831 519H858M967 519H1024" class="flow"/>

  <!-- legend / key insight -->
  <rect x="160" y="661" width="960" height="38" rx="19" fill="#eafaf0"/>
  <text x="640" y="686" text-anchor="middle" class="label" fill="#166534">关键：计算单元只有持续拿到数据才有高利用率；所以算子优化同时也是数据搬运与流水优化。</text>
</svg>
