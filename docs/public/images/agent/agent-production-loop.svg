<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">生产级 Agent 请求闭环</title><desc id="desc">请求经过入口治理、上下文组装、模型决策、可信宿主校验和工具执行，工具结果写回状态并再次决策，最终输出和全链路记录。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker><style>.t{font:700 26px system-ui;fill:#182230}.h{font:700 17px system-ui;fill:#24364b}.s{font:15px system-ui;fill:#52606d}.b{stroke-width:2}.arr{stroke:#718096;stroke-width:2.5;fill:none;marker-end:url(#a)}.loop{stroke:#805ad5;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="610" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">模型只负责建议动作，可信宿主负责验证、授权与执行</text><rect x="35" y="110" width="155" height="85" rx="15" fill="#e8f1ff" stroke="#3677d2" class="b"/><text x="113" y="145" text-anchor="middle" class="h">用户请求</text><text x="113" y="172" text-anchor="middle" class="s">Goal + Identity</text><path d="M195 152H235" class="arr"/><rect x="245" y="95" width="185" height="115" rx="15" fill="#fff" stroke="#9aa8b6" class="b"/><text x="338" y="128" text-anchor="middle" class="h">入口治理</text><text x="338" y="156" text-anchor="middle" class="s">认证 · 配额 · 风险</text><text x="338" y="183" text-anchor="middle" class="s">超时 · Trace ID</text><path d="M435 152H475" class="arr"/><rect x="485" y="95" width="190" height="115" rx="15" fill="#e9f8ef" stroke="#2f855a" class="b"/><text x="580" y="128" text-anchor="middle" class="h">上下文组装</text><text x="580" y="156" text-anchor="middle" class="s">State · Memory</text><text x="580" y="183" text-anchor="middle" class="s">RAG · Tool Schema</text><path d="M680 152H720" class="arr"/><rect x="730" y="95" width="190" height="115" rx="15" fill="#f1eaff" stroke="#805ad5" class="b"/><text x="825" y="128" text-anchor="middle" class="h">模型决策</text><text x="825" y="156" text-anchor="middle" class="s">最终回答</text><text x="825" y="183" text-anchor="middle" class="s">或结构化 Tool Call</text><path d="M925 152H965" class="arr"/><rect x="975" y="95" width="190" height="115" rx="15" fill="#fff1db" stroke="#db7c20" class="b"/><text x="1070" y="128" text-anchor="middle" class="h">可信宿主校验</text><text x="1070" y="156" text-anchor="middle" class="s">Schema · 权限</text><text x="1070" y="183" text-anchor="middle" class="s">业务规则 · 审批</text><path d="M1070 215V280" class="arr"/><rect x="940" y="290" width="225" height="110" rx="16" fill="#ffe8ed" stroke="#d14b65" class="b"/><text x="1053" y="323" text-anchor="middle" class="h">Sandbox / 外部工具</text><text x="1053" y="352" text-anchor="middle" class="s">API · DB · 文件 · 命令</text><text x="1053" y="378" text-anchor="middle" class="s">幂等 · 超时 · 资源限制</text><path d="M935 345H780" class="arr"/><rect x="560" y="290" width="210" height="110" rx="16" fill="#e8f1ff" stroke="#3677d2" class="b"/><text x="665" y="323" text-anchor="middle" class="h">结果写回 State</text><text x="665" y="352" text-anchor="middle" class="s">Tool Result · Error</text><text x="665" y="378" text-anchor="middle" class="s">Retry Count · Checkpoint</text><path d="M665 285C665 245 825 255 825 215" class="loop"/><text x="742" y="255" text-anchor="middle" class="s">观察结果，再次决策</text><path d="M730 210C665 235 460 235 430 285" class="arr"/><rect x="245" y="290" width="185" height="110" rx="16" fill="#e9f8ef" stroke="#2f855a" class="b"/><text x="338" y="323" text-anchor="middle" class="h">最终交付</text><text x="338" y="352" text-anchor="middle" class="s">答案 · 文件 · 变更</text><text x="338" y="378" text-anchor="middle" class="s">来源 · 执行摘要</text><rect x="115" y="475" width="970" height="80" rx="17" fill="#182230"/><text x="600" y="508" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="18" fill="#fff">全链路治理</text><text x="600" y="535" text-anchor="middle" font-family="system-ui" font-size="15" fill="#dfe5eb">Trace · Eval · Token/Cost · Audit · Alert · Version · Privacy</text><path d="M338 405V470M665 405V470M1053 405V470" stroke="#718096" stroke-width="2" stroke-dasharray="6 5"/><text x="600" y="588" text-anchor="middle" class="s">失败不是一段文本：系统必须区分模型错误、校验失败、工具失败、超时和需要人工决策。</text></svg>
