<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">AI Agent 工程化五层知识树</title><desc id="desc">Agent 工程由模型基座、数据记忆、控制流、动作工具和生产治理五层组成，生产治理横跨其他四层。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker><style>.t{font:700 26px system-ui;fill:#182230}.h{font:700 18px system-ui;fill:#24364b}.s{font:15px system-ui;fill:#52606d}.b{stroke-width:2}.arr{stroke:#718096;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="650" rx="24" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">生产级 Agent = 能力闭环 + 治理闭环</text><rect x="445" y="80" width="310" height="80" rx="18" fill="#182230"/><text x="600" y="115" text-anchor="middle" font-family="system-ui" font-size="21" font-weight="700" fill="#fff">用户目标与任务状态</text><text x="600" y="141" text-anchor="middle" font-family="system-ui" font-size="15" fill="#dfe5eb">Goal · State · Budget · Identity</text><path d="M600 165V210" class="arr"/><g><rect x="35" y="225" width="210" height="235" rx="18" fill="#e8f1ff" stroke="#3677d2" class="b"/><text x="140" y="260" text-anchor="middle" class="h">① 模型基础设施</text><text x="140" y="296" text-anchor="middle" class="s">API Gateway</text><text x="140" y="326" text-anchor="middle" class="s">模型路由与降级</text><text x="140" y="356" text-anchor="middle" class="s">推理引擎与缓存</text><text x="140" y="386" text-anchor="middle" class="s">流式输出与取消</text><text x="140" y="428" text-anchor="middle" class="s">提供稳定模型能力</text><rect x="265" y="225" width="210" height="235" rx="18" fill="#e9f8ef" stroke="#2f855a" class="b"/><text x="370" y="260" text-anchor="middle" class="h">② 数据与记忆</text><text x="370" y="296" text-anchor="middle" class="s">会话与工作记忆</text><text x="370" y="326" text-anchor="middle" class="s">知识清洗与切片</text><text x="370" y="356" text-anchor="middle" class="s">Hybrid Search / RRF</text><text x="370" y="386" text-anchor="middle" class="s">Rerank / GraphRAG</text><text x="370" y="428" text-anchor="middle" class="s">提供可信上下文</text><rect x="495" y="225" width="210" height="235" rx="18" fill="#f1eaff" stroke="#805ad5" class="b"/><text x="600" y="260" text-anchor="middle" class="h">③ 控制流编排</text><text x="600" y="296" text-anchor="middle" class="s">Structured Output</text><text x="600" y="326" text-anchor="middle" class="s">State Machine</text><text x="600" y="356" text-anchor="middle" class="s">Checkpoint / Resume</text><text x="600" y="386" text-anchor="middle" class="s">Supervisor / Critic</text><text x="600" y="428" text-anchor="middle" class="s">决定下一步动作</text><rect x="725" y="225" width="210" height="235" rx="18" fill="#fff1db" stroke="#db7c20" class="b"/><text x="830" y="260" text-anchor="middle" class="h">④ 动作与工具</text><text x="830" y="296" text-anchor="middle" class="s">Function Calling</text><text x="830" y="326" text-anchor="middle" class="s">MCP Client / Server</text><text x="830" y="356" text-anchor="middle" class="s">Schema 与权限校验</text><text x="830" y="386" text-anchor="middle" class="s">Sandbox / HITL</text><text x="830" y="428" text-anchor="middle" class="s">安全改变外部状态</text></g><path d="M245 342H260M475 342H490M705 342H720" class="arr"/><rect x="955" y="205" width="210" height="275" rx="18" fill="#ffe8ed" stroke="#d14b65" class="b"/><text x="1060" y="240" text-anchor="middle" class="h">⑤ 生产治理</text><text x="1060" y="278" text-anchor="middle" class="s">Trace 与 Metrics</text><text x="1060" y="308" text-anchor="middle" class="s">Offline / Online Eval</text><text x="1060" y="338" text-anchor="middle" class="s">安全与审计</text><text x="1060" y="368" text-anchor="middle" class="s">成本与配额</text><text x="1060" y="398" text-anchor="middle" class="s">版本、灰度与回滚</text><text x="1060" y="440" text-anchor="middle" class="s">横跨全部执行阶段</text><path d="M950 260C900 185 300 185 240 220M950 320C890 190 570 190 475 220M950 390C900 465 760 480 705 445" stroke="#d14b65" stroke-width="2" stroke-dasharray="7 5" fill="none"/><rect x="235" y="525" width="730" height="75" rx="16" fill="#fff" stroke="#9aa8b6" class="b"/><text x="600" y="556" text-anchor="middle" class="h">工程判断标准</text><text x="600" y="584" text-anchor="middle" class="s">能否恢复 · 能否观测 · 能否评测 · 能否授权 · 能否审计 · 成本是否可控</text></svg>
