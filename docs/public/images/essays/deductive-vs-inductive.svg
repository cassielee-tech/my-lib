<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 22px sans-serif;fill:#172033}.s{font:16px sans-serif;fill:#475569}.h{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.ai{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.lg{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}</style></defs><rect width="1200" height="640" rx="24" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="t">横向关系：演绎链 vs 归纳组</text><line x1="600" y1="75" x2="600" y2="600" stroke="#e2e8f0" stroke-width="3"/><text x="300" y="100" text-anchor="middle" class="t" font-size="20">演绎：环环相扣</text><rect x="100" y="130" width="400" height="84" rx="15" class="h"/><text x="300" y="162" text-anchor="middle" class="t">大前提</text><text x="300" y="192" text-anchor="middle" class="s">所有人都会死</text><rect x="100" y="260" width="400" height="84" rx="15" class="h"/><text x="300" y="292" text-anchor="middle" class="t">小前提</text><text x="300" y="322" text-anchor="middle" class="s">苏格拉底是人</text><rect x="100" y="390" width="400" height="84" rx="15" class="ai"/><text x="300" y="422" text-anchor="middle" class="t">结论</text><text x="300" y="452" text-anchor="middle" class="s">所以苏格拉底会死</text><path d="M300 214 V256" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M300 344 V386" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="320" y="240" class="s">推出</text><text x="320" y="370" class="s">推出</text><rect x="100" y="510" width="400" height="88" rx="15" class="lg"/><text x="300" y="541" text-anchor="middle" class="t" font-size="19">上一层概括什么？</text><text x="300" y="570" text-anchor="middle" class="s">「推理过程成立」——适合说服，前提一倒全链皆倒</text><text x="900" y="100" text-anchor="middle" class="t" font-size="20">归纳：并列找共性</text><rect x="665" y="130" width="150" height="84" rx="15" class="h"/><text x="740" y="168" text-anchor="middle" class="t" font-size="19">论据一</text><text x="740" y="196" text-anchor="middle" class="s">同类事实</text><rect x="825" y="130" width="150" height="84" rx="15" class="h"/><text x="900" y="168" text-anchor="middle" class="t" font-size="19">论据二</text><text x="900" y="196" text-anchor="middle" class="s">同类事实</text><rect x="985" y="130" width="150" height="84" rx="15" class="h"/><text x="1060" y="168" text-anchor="middle" class="t" font-size="19">论据三</text><text x="1060" y="196" text-anchor="middle" class="s">同类事实</text><path d="M740 214 L872 294" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M900 214 V294" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M1060 214 L928 294" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="660" y="300" width="480" height="84" rx="15" class="ai"/><text x="900" y="332" text-anchor="middle" class="t">结论：这组事实的共性</text><text x="900" y="362" text-anchor="middle" class="s">上一层思想 = 对全组的概括</text><rect x="660" y="510" width="480" height="88" rx="15" class="lg"/><text x="900" y="541" text-anchor="middle" class="t" font-size="19">上一层概括什么？</text><text x="900" y="570" text-anchor="middle" class="s">「共性结论」——适合行动方案，单点被质疑不伤全局</text></svg>
