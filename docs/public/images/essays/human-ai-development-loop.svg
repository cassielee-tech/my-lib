<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 22px sans-serif;fill:#172033}.s{font:16px sans-serif;fill:#475569}.h{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.ai{fill:#dcfce7;stroke:#16a34a;stroke-width:2}</style></defs><rect width="1200" height="520" rx="24" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="t">高质量人机协作：人控制目标和边界，AI 加速搜索与执行</text><rect x="55" y="120" width="205" height="100" rx="15" class="h"/><text x="157" y="157" text-anchor="middle" class="t">人：定义任务</text><text x="157" y="188" text-anchor="middle" class="s">范围、约束、验收标准</text><rect x="330" y="120" width="205" height="100" rx="15" class="ai"/><text x="432" y="157" text-anchor="middle" class="t">AI：搜索与计划</text><text x="432" y="188" text-anchor="middle" class="s">理解项目并提出步骤</text><rect x="605" y="120" width="205" height="100" rx="15" class="h"/><text x="707" y="157" text-anchor="middle" class="t">人：确认方向</text><text x="707" y="188" text-anchor="middle" class="s">纠正假设和影响范围</text><rect x="880" y="120" width="265" height="100" rx="15" class="ai"/><text x="1012" y="157" text-anchor="middle" class="t">AI：修改与验证</text><text x="1012" y="188" text-anchor="middle" class="s">写代码、运行检查、修正错误</text><path d="M260 170H320M535 170H595M810 170H870" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="420" y="330" width="360" height="105" rx="16" class="h"/><text x="600" y="369" text-anchor="middle" class="t">人：最终 Review 与负责</text><text x="600" y="401" text-anchor="middle" class="s">需求正确性、架构、安全、上线决策</text><path d="M1012 220V275C1012 300 800 300 760 320" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M420 382H180C120 382 120 235 157 230" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#a)"/><text x="265" y="414" text-anchor="middle" class="s">未通过则缩小问题、补充上下文，再迭代</text><text x="600" y="485" text-anchor="middle" class="t" font-size="20">AI 可以执行动作，但目标判断与责任没有离开人</text></svg>
