<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><style>.t{font:700 22px sans-serif;fill:#172033}.s{font:16px sans-serif;fill:#475569}</style><rect width="1200" height="600" rx="24" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="t">Coding Agent 不是一个模型，而是六层共同工作</text><g stroke-width="2"><rect x="180" y="80" width="840" height="65" rx="13" fill="#dbeafe" stroke="#2563eb"/><rect x="180" y="155" width="840" height="65" rx="13" fill="#e0e7ff" stroke="#6366f1"/><rect x="180" y="230" width="840" height="65" rx="13" fill="#ede9fe" stroke="#7c3aed"/><rect x="180" y="305" width="840" height="65" rx="13" fill="#fef3c7" stroke="#d97706"/><rect x="180" y="380" width="840" height="65" rx="13" fill="#dcfce7" stroke="#16a34a"/><rect x="180" y="455" width="840" height="65" rx="13" fill="#fee2e2" stroke="#dc2626"/></g><text x="310" y="120" text-anchor="middle" class="t">模型</text><text x="580" y="120" class="s">理解意图、生成候选方案</text><text x="310" y="195" text-anchor="middle" class="t">Codebase</text><text x="580" y="195" class="s">检索代码、符号、依赖和项目知识</text><text x="310" y="270" text-anchor="middle" class="t">Agent 循环</text><text x="580" y="270" class="s">规划、行动、观察结果、修正</text><text x="310" y="345" text-anchor="middle" class="t">Tools / MCP</text><text x="580" y="345" class="s">文件、终端、Git、外部服务</text><text x="310" y="420" text-anchor="middle" class="t">上下文与记忆</text><text x="580" y="420" class="s">规则、摘要、按需加载、状态延续</text><text x="310" y="495" text-anchor="middle" class="t">验证与权限</text><text x="580" y="495" class="s">编译、测试、Review、确认和审计</text><text x="600" y="562" text-anchor="middle" class="s">任何一层失真，都可能让最终结果偏离目标；模型能力并不能替代外围工程</text></svg>
