<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 22px sans-serif;fill:#172033}.s{font:16px sans-serif;fill:#475569}.h{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.o{fill:#ffedd5;stroke:#ea580c;stroke-width:2}.n{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}.lg{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}</style></defs><rect width="1200" height="570" rx="24" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="t">思考自下而上，表达自上而下</text><text x="300" y="92" text-anchor="middle" class="t" font-size="20">思考：先发散，再聚合</text><rect x="90" y="140" width="420" height="76" rx="15" class="o"/><text x="300" y="170" text-anchor="middle" class="t">③ 得出结论</text><text x="300" y="198" text-anchor="middle" class="s">最顶层思想</text><rect x="90" y="280" width="420" height="76" rx="15" class="h"/><text x="300" y="310" text-anchor="middle" class="t">② 找出逻辑关系</text><text x="300" y="338" text-anchor="middle" class="s">分组 · 排序 · MECE</text><rect x="90" y="420" width="420" height="76" rx="15" class="n"/><text x="300" y="450" text-anchor="middle" class="t">① 列出全部要点</text><text x="300" y="478" text-anchor="middle" class="s">头脑风暴，不排序</text><path d="M300 418 V360" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M300 278 V220" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="900" y="92" text-anchor="middle" class="t" font-size="20">表达：先结论，再展开</text><rect x="690" y="140" width="420" height="76" rx="15" class="o"/><text x="900" y="170" text-anchor="middle" class="t">① 先给结论</text><text x="900" y="198" text-anchor="middle" class="s">中心思想一句话</text><rect x="690" y="280" width="420" height="76" rx="15" class="h"/><text x="900" y="310" text-anchor="middle" class="t">② 回答读者疑问</text><text x="900" y="338" text-anchor="middle" class="s">纵向：疑问-回答链</text><rect x="690" y="420" width="420" height="76" rx="15" class="n"/><text x="900" y="450" text-anchor="middle" class="t">③ 展开关键论据</text><text x="900" y="478" text-anchor="middle" class="s">横向：分组与排序</text><path d="M900 216 V276" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M900 356 V416" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="530" y="270" width="140" height="110" rx="15" class="lg"/><text x="600" y="308" text-anchor="middle" class="t" font-size="19">同一座</text><text x="600" y="340" text-anchor="middle" class="t" font-size="19">金字塔</text><text x="600" y="545" text-anchor="middle" class="t" font-size="20">思考时允许混乱，表达必须有序：金字塔是思考的终点，也是表达的起点</text></svg>
