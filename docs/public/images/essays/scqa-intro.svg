<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 22px sans-serif;fill:#172033}.s{font:16px sans-serif;fill:#475569}.h{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.ai{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.lg{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}</style></defs><rect width="1200" height="560" rx="24" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="t">序言的 SCQA：先对齐情境，再引出疑问</text><rect x="60" y="100" width="240" height="120" rx="15" class="h"/><text x="180" y="135" text-anchor="middle" class="t">S 情境</text><text x="180" y="165" text-anchor="middle" class="s">读者已知、无争议</text><text x="180" y="191" text-anchor="middle" class="s">先把读者放回场景</text><rect x="340" y="100" width="240" height="120" rx="15" class="h"/><text x="460" y="135" text-anchor="middle" class="t">C 冲突</text><text x="460" y="165" text-anchor="middle" class="s">打破常态的变化</text><text x="460" y="191" text-anchor="middle" class="s">促使疑问产生</text><rect x="620" y="100" width="240" height="120" rx="15" class="h"/><text x="740" y="135" text-anchor="middle" class="t">Q 疑问</text><text x="740" y="165" text-anchor="middle" class="s">读者心中自然升起</text><text x="740" y="191" text-anchor="middle" class="s">的那个问题</text><rect x="900" y="100" width="240" height="120" rx="15" class="ai"/><text x="1020" y="135" text-anchor="middle" class="t">A 回答</text><text x="1020" y="165" text-anchor="middle" class="s">你的中心思想</text><text x="1020" y="191" text-anchor="middle" class="s">= 金字塔塔尖</text><path d="M300 160 H338" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M580 160 H618" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M860 160 H898" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="268" width="1080" height="86" rx="15" class="lg"/><text x="600" y="298" text-anchor="middle" class="s">序言只提醒读者「已知」的事，不提供新信息——读完序言，读者与你站在同一个问题面前</text><text x="600" y="330" text-anchor="middle" class="s">序言的本质是讲故事：情境与冲突一起，把疑问「种」进读者脑子里</text><text x="600" y="400" text-anchor="middle" class="t" font-size="20">三种常见变体</text><rect x="60" y="425" width="330" height="90" rx="15" class="lg"/><text x="225" y="458" text-anchor="middle" class="t" font-size="19">标准式 S→C→Q→A</text><text x="225" y="488" text-anchor="middle" class="s">平铺直叙，多数场合</text><rect x="435" y="425" width="330" height="90" rx="15" class="lg"/><text x="600" y="458" text-anchor="middle" class="t" font-size="19">开门见山式 A→S→C</text><text x="600" y="488" text-anchor="middle" class="s">结论先行，读者很忙时</text><rect x="810" y="425" width="330" height="90" rx="15" class="lg"/><text x="975" y="458" text-anchor="middle" class="t" font-size="19">突出忧虑式 C→S→A</text><text x="975" y="488" text-anchor="middle" class="s">先讲风险，推动行动</text></svg>
