<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 22px sans-serif;fill:#172033}.s{font:16px sans-serif;fill:#475569}.b{fill:#fff;stroke:#64748b;stroke-width:2}</style></defs><rect width="1200" height="470" rx="24" fill="#f8fafc"/><text x="600" y="44" text-anchor="middle" class="t">AI Coding 的跃迁：不是补全更长，而是系统能够持续行动</text><g class="b"><rect x="40" y="115" width="180" height="120" rx="14"/><rect x="270" y="115" width="180" height="120" rx="14"/><rect x="500" y="115" width="180" height="120" rx="14"/><rect x="730" y="115" width="180" height="120" rx="14"/><rect x="960" y="115" width="200" height="120" rx="14"/></g><text x="130" y="153" text-anchor="middle" class="t">规则补全</text><text x="130" y="185" text-anchor="middle" class="s">关键词 / 语法</text><text x="130" y="211" text-anchor="middle" class="s">局部确定性候选</text><text x="360" y="153" text-anchor="middle" class="t">智能补全</text><text x="360" y="185" text-anchor="middle" class="s">上下文预测</text><text x="360" y="211" text-anchor="middle" class="s">一行或一段代码</text><text x="590" y="153" text-anchor="middle" class="t">对话生成</text><text x="590" y="185" text-anchor="middle" class="s">自然语言任务</text><text x="590" y="211" text-anchor="middle" class="s">解释 / 函数 / 测试</text><text x="820" y="153" text-anchor="middle" class="t">Coding Agent</text><text x="820" y="185" text-anchor="middle" class="s">项目级检索</text><text x="820" y="211" text-anchor="middle" class="s">工具调用与验证</text><text x="1060" y="153" text-anchor="middle" class="t">多智能体协作</text><text x="1060" y="185" text-anchor="middle" class="s">拆解与并行</text><text x="1060" y="211" text-anchor="middle" class="s">团队规则与治理</text><path d="M220 175H260M450 175H490M680 175H720M910 175H950" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M90 315H1110" stroke="#14b8a6" stroke-width="8"/><text x="90" y="356" class="s">局部建议</text><text x="1110" y="356" text-anchor="end" class="s">围绕目标自主执行</text><text x="600" y="416" text-anchor="middle" class="t" font-size="20">能力范围扩大，同时上下文、权限、验证与责任问题也随之放大</text></svg>
